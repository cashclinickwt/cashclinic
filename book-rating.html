<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>قيّم الكتيّب | Cash Clinic</title>
<link rel="icon" href="brand/mark/mark-purple.png">
<link rel="stylesheet" href="assets/ds/fonts/fonts.css">
<link rel="stylesheet" href="assets/ds/tokens/colors.css">
<link rel="stylesheet" href="assets/ds/tokens/typography.css">
<link rel="stylesheet" href="assets/ds/tokens/spacing.css">
<link rel="stylesheet" href="assets/ds/tokens/effects.css">
<link rel="stylesheet" href="assets/ds/tokens/base.css">
<link rel="stylesheet" href="assets/css/site.css">

<style>
  body{background:var(--cc-purple-050);}
  .rt-hero{background:linear-gradient(150deg,var(--cc-purple-700),var(--cc-purple) 62%);color:var(--cc-cream);padding:52px 0 46px;position:relative;overflow:hidden}
  .rt-hero .cc-wrap{position:relative;z-index:1}
  .rt-hero .mark{position:absolute;inset-inline-end:-26px;bottom:-26px;width:150px;opacity:.12;z-index:0}
  .rt-badge{display:inline-block;background:var(--cc-gold);color:var(--cc-purple);font-weight:700;font-size:13.5px;border-radius:999px;padding:7px 16px}
  .rt-hero h1{font-size:clamp(26px,4vw,40px);font-weight:300;line-height:1.3;margin:16px 0 0;color:#fff}
  .rt-hero p{font-size:16.5px;line-height:1.9;color:var(--cc-purple-100);margin:14px 0 0;max-width:56ch}

  .rt-wrap{max-width:680px;margin:-26px auto 64px;padding:0 18px;position:relative;z-index:2}
  .rt-card{background:var(--cc-white);border:1px solid var(--cc-grey-200);border-radius:24px;padding:30px 26px;box-shadow:0 18px 50px rgba(47,23,72,.10)}

  .rt-q{margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--cc-grey-100)}
  .rt-q:last-of-type{border-bottom:0;padding-bottom:0;margin-bottom:0}
  .rt-q > label.q{display:block;font-size:16px;font-weight:700;color:var(--cc-purple);margin-bottom:12px;line-height:1.6}
  .rt-q .req{color:var(--cc-burgundy);font-weight:400}

  .rt-opts{display:flex;flex-wrap:wrap;gap:9px}
  .rt-opt{flex:1 1 auto;min-width:120px}
  .rt-opt input{position:absolute;opacity:0;pointer-events:none}
  .rt-opt span{display:block;text-align:center;border:2px solid var(--cc-grey-200);border-radius:14px;padding:13px 14px;font-size:15px;color:var(--cc-ink);cursor:pointer;transition:.15s;background:var(--cc-white);line-height:1.5}
  .rt-opt input:checked + span{border-color:var(--cc-purple);background:var(--cc-purple);color:var(--cc-cream);font-weight:700}
  .rt-opt input:focus-visible + span{outline:2px solid var(--cc-gold);outline-offset:2px}

  .rt-fld{margin-bottom:15px}
  .rt-fld label{display:block;font-size:13.5px;font-weight:700;color:var(--cc-ink);margin-bottom:6px}
  .rt-fld input,.rt-fld textarea,.rt-fld select{width:100%;border:2px solid var(--cc-grey-200);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;color:var(--cc-ink);background:var(--cc-white);box-sizing:border-box}
  .rt-fld textarea{min-height:96px;resize:vertical;line-height:1.85}
  .rt-fld input:focus,.rt-fld textarea:focus,.rt-fld select:focus{outline:0;border-color:var(--cc-purple)}
  .rt-phone{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:9px}
  .rt-phone select{font-size:14.5px}

  .rt-sub{margin-top:12px}
  .rt-sub textarea{min-height:80px}
  .rt-hide{display:none}

  .rt-send{width:100%;padding:17px;border:0;border-radius:999px;background:var(--cc-purple);color:var(--cc-cream);font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px}
  .rt-send:hover{filter:brightness(1.08)}
  .rt-send:disabled{opacity:.62;cursor:default}
  .rt-err{display:none;background:#FDECEC;color:var(--cc-danger);border:1px solid #F3C9C9;border-radius:12px;padding:12px 15px;font-size:14.5px;margin-top:14px;text-align:center;line-height:1.75}

  /* this page hides with .rt-hide throughout, and the card already carries it
     — leaving display:none here too would mean removing the class revealed
     nothing */
  .rt-ok{text-align:center;padding:14px 4px}
  .rt-ok .ico{font-size:52px;margin-bottom:14px}
  .rt-ok h2{font-size:24px;color:var(--cc-purple);margin:0 0 12px;font-weight:700}
  .rt-ok p{font-size:15.5px;line-height:1.95;color:var(--cc-grey-700);margin:0 auto 22px;max-width:44ch}
  .rt-ok .buy{display:inline-block;background:var(--cc-teal);color:#fff;text-decoration:none;padding:15px 32px;border-radius:999px;font-size:16px;font-weight:700}
  .rt-ok .buy:hover{filter:brightness(1.08)}
</style>
<style>
  .rt-book{display:flex;align-items:center;gap:12px;background:var(--cc-purple-050);
    border:1px solid var(--cc-purple-100);border-radius:16px;padding:14px 16px;margin-bottom:22px}
  .rt-book b{color:var(--cc-purple);font-size:16px}
  .rt-book span{color:var(--cc-grey-600);font-size:13.5px}
  /* .rt-book sets display:flex at the same specificity as .rt-hide, and this
     block comes after the imported one — so hiding has to be re-asserted last
     or the book banner shows on a page that has no book */
  .rt-hide{display:none}
</style>
</head>
<body>

<header class="cc-header"><div class="cc-wrap cc-header-in">
  <a class="cc-logo" href="index.html"><img src="brand/logo/logo-primary.png" alt="كاش كلينك" style="height:38px;width:auto"></a>
</div></header>

<section class="rt-hero">
  <div class="cc-wrap">
    <span class="rt-badge">رأيك يهمنا</span>
    <h1>قيّم الكتيّب</h1>
    <p>دقيقتين من وقتك تساعدنا نطوّر الإصدار الجاي. كل إجابة نقراها بأنفسنا.</p>
  </div>
  <img class="mark" src="brand/mark/mark-cream.png" alt="">
</section>

<div class="rt-wrap">
  <div class="rt-card" id="rtForm">

    <!-- filled from the order when they arrive from the email -->
    <div class="rt-book rt-hide" id="rtBook"><span>تقييمك لـ</span><b id="rtBookName"></b></div>

    <!-- picked by hand when the link was shared rather than emailed -->
    <div class="rt-q" id="qBook">
      <label class="q">أي كتيّب؟</label>
      <div class="rt-opts">
        <label class="rt-opt"><input type="radio" name="book" value="dalil"><span>دليل الوفرة المالية</span></label>
        <label class="rt-opt"><input type="radio" name="book" value="ahdafi"><span>أهدافي المالية</span></label>
        <label class="rt-opt"><input type="radio" name="book" value="riyada"><span>كاش ريادة</span></label>
      </div>
    </div>

    <div class="rt-q" id="qWho">
      <label class="q">بياناتك</label>
      <div class="rt-fld"><label>الاسم</label><input id="rName" type="text" placeholder="اسمك"></div>
      <div class="rt-fld"><label>الإيميل</label>
        <input id="rEmail" type="email" placeholder="example@email.com" style="direction:ltr;text-align:right"></div>
    </div>

    <div class="rt-q">
      <label class="q">وصلك الكتيّب بدون مشاكل؟</label>
      <div class="rt-opts">
        <label class="rt-opt"><input type="radio" name="arr" value="نعم"><span>نعم</span></label>
        <label class="rt-opt"><input type="radio" name="arr" value="لا"><span>لا</span></label>
      </div>
      <div class="rt-sub rt-hide" id="qArrWhy">
        <div class="rt-fld"><label>شنو صار؟</label>
          <textarea id="rArrWhy" placeholder="وش المشكلة اللي واجهتك؟"></textarea></div>
      </div>
    </div>

    <div class="rt-q">
      <label class="q">تقييمك العام للكتيّب</label>
      <div class="rt-opts">
        <label class="rt-opt"><input type="radio" name="rate" value="مفيد وممتاز"><span>مفيد وممتاز</span></label>
        <label class="rt-opt"><input type="radio" name="rate" value="متوسط"><span>متوسط</span></label>
        <label class="rt-opt"><input type="radio" name="rate" value="ضعيف"><span>ضعيف</span></label>
      </div>
      <div class="rt-fld" style="margin-top:12px"><label>ليش هالتقييم؟</label>
        <textarea id="rRateWhy" placeholder="قول لنا بصراحة"></textarea></div>
    </div>

    <div class="rt-q">
      <label class="q">طبّقت شي منه؟</label>
      <div class="rt-opts">
        <label class="rt-opt"><input type="radio" name="app" value="طبّقت شي منه"><span>طبّقت شي منه</span></label>
        <label class="rt-opt"><input type="radio" name="app" value="بديت أطبق"><span>بديت أطبق</span></label>
        <label class="rt-opt"><input type="radio" name="app" value="لسّا ما بديت"><span>لسّا ما بديت</span></label>
      </div>
    </div>

    <div class="rt-q">
      <label class="q">شنو أكثر شي استفدت منه؟</label>
      <div class="rt-fld"><textarea id="rUseful" placeholder="أي جزء أو فكرة وقفت عندها"></textarea></div>
    </div>

    <div class="rt-q">
      <label class="q">شنو تتمنى نضيفه بالإصدار الجاي؟</label>
      <div class="rt-fld"><textarea id="rWish" placeholder="اللي تحس إنه ناقص"></textarea></div>
    </div>

    <div class="rt-q">
      <label class="q">توصّي فيه غيرك؟</label>
      <div class="rt-opts">
        <label class="rt-opt"><input type="radio" name="rec" value="نعم"><span>نعم</span></label>
        <label class="rt-opt"><input type="radio" name="rec" value="لا"><span>لا</span></label>
      </div>
      <div class="rt-fld" style="margin-top:12px"><label>ليش؟</label>
        <textarea id="rRecWhy" placeholder="اختياري"></textarea></div>
    </div>

    <div class="rt-q">
      <label class="q">نقدر ننشر رأيك؟</label>
      <div class="rt-opts">
        <label class="rt-opt"><input type="radio" name="pub" value="نعم باسمي"><span>نعم باسمي</span></label>
        <label class="rt-opt"><input type="radio" name="pub" value="نعم بدون اسمي"><span>نعم بدون اسمي</span></label>
        <label class="rt-opt"><input type="radio" name="pub" value="لا"><span>لا</span></label>
      </div>
    </div>

    <button class="rt-send" id="rSend">أرسل تقييمي</button>
    <div class="rt-err" id="rErr"></div>
  </div>

  <div class="rt-card rt-ok rt-hide" id="rtOk">
    <div class="ico">🤍</div>
    <h2>وصلنا تقييمك</h2>
    <p>شكراً لوقتك. رأيك يوصل لفريق كاش كلينك ويساعدنا نطوّر الإصدار الجاي.</p>
    <a class="cc-btn cc-btn-primary" href="index.html" style="margin-top:14px">رجوع للرئيسية</a>
  </div>
</div>

<script src="assets/js/email-typo.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
const CONFIG={firebase:{apiKey:"AIzaSyCfD6ocmBsGVJms69TDbKt1PkcdSsGc3so",authDomain:"cash-quiz-906a6.firebaseapp.com",
  projectId:"cash-quiz-906a6",storageBucket:"cash-quiz-906a6.firebasestorage.app",
  messagingSenderId:"547780714224",appId:"1:547780714224:web:0e97107045a803623dec35"},functionsRegion:"us-central1"};
const app=initializeApp(CONFIG.firebase);
const fns=getFunctions(app,CONFIG.functionsRegion);
const submitBookRating   = httpsCallable(fns,"submitBookRating");
const getBookRatingOrder = httpsCallable(fns,"getBookRatingOrder");
const $=s=>document.querySelector(s);
const pick=n=>{const el=document.querySelector(`input[name="${n}"]:checked`);return el?el.value:"";};
function err(m){ const b=$("#rErr"); b.textContent=m||""; b.style.display=m?"block":"none"; }

/* The order id only fills the form in. Somebody who was handed a booklet and
   follows a shared link has an opinion worth the same, so the page works with
   no order at all — it just asks which book and who they are. */
const ORDER=new URLSearchParams(location.search).get("o")||"";
let BOOK="";

(async function(){
  if(!ORDER) return;
  try{
    const r=await getBookRatingOrder({orderId:ORDER});
    const d=(r&&r.data)||{};
    BOOK=d.productKey||"";
    if(d.bookName){ $("#rtBookName").textContent=d.bookName; $("#rtBook").classList.remove("rt-hide"); }
    $("#qBook").classList.add("rt-hide");
    if(d.name)  $("#rName").value=d.name;
    if(d.email) $("#rEmail").value=d.email;
    /* they answered already — say so instead of taking a second rating */
    if(d.rated){
      $("#rtForm").classList.add("rt-hide");
      $("#rtOk").classList.remove("rt-hide");
      $("#rtOk").querySelector("p").textContent="وصلنا تقييمك من قبل .. شكراً لوقتك 🤍";
    }
  }catch(e){ /* a bad or old link just falls back to the full form */ }
})();

document.addEventListener("change", e=>{
  if(e.target.name==="arr") $("#qArrWhy").classList.toggle("rt-hide", e.target.value!=="لا");
});

$("#rSend").addEventListener("click", async ()=>{
  const name=($("#rName").value||"").trim();
  const email=($("#rEmail").value||"").trim();
  const book=BOOK||pick("book");
  if(!book) return err("اختر الكتيّب");
  if(name.length<2) return err("اكتب اسمك");
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err("اكتب إيميل صحيح");
  const fix=window.ccEmailSuggest?window.ccEmailSuggest(email):"";
  if(fix){ if(window.ccEmailCheck) window.ccEmailCheck($("#rEmail")); return err("تأكد من إيميلك، هل تقصد "+fix+"؟"); }
  if(!pick("rate")) return err("اختر تقييمك للكتيّب");
  err("");
  const b=$("#rSend"), t=b.textContent;
  b.disabled=true; b.textContent="جارٍ الإرسال…";
  try{
    await submitBookRating({ orderId:ORDER, productKey:book, name, email,
      arrived:pick("arr")==="نعم", arrivedIssue:($("#rArrWhy").value||"").trim(),
      rating:pick("rate"), ratingReason:($("#rRateWhy").value||"").trim(),
      applied:pick("app"), mostUseful:($("#rUseful").value||"").trim(),
      wish:($("#rWish").value||"").trim(),
      recommend:pick("rec"), recommendWhy:($("#rRecWhy").value||"").trim(),
      publish:pick("pub") });
    $("#rtForm").classList.add("rt-hide");
    $("#rtOk").classList.remove("rt-hide");
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(e){ err((e&&e.message)||"صار خطأ، حاول مرة ثانية"); }
  finally{ b.disabled=false; b.textContent=t; }
});
</script>
</body>
</html>
