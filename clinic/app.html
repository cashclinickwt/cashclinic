  --wine:#e59aa4; --wine-soft:#3b1b27;
  --good:#7fd0cb; --good-soft:#163b3c; --warn:#e2b26a; --warn-soft:#3a2b14; --bad:#ef9aa5; --bad-soft:#3b1b27;
  --plum:#2f1748; --cream:#ffe7bc; --lav:#d2d4e3; --pink:#fce5ea; --mark:#d2d4e3; --mark-soft:#4a3863;

*{box-sizing:border-box}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{margin:0;color:var(--strong);text-wrap:balance;font-weight:600;line-height:1.35}
h2{font-size:1.15rem}
h3{font-size:.95rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)} .small{font-size:.82rem}
.eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1080px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .lockup{height:30px;width:auto;fill:var(--mark);display:block;direction:ltr}
.brand i{width:1px;height:22px;background:var(--line-strong)}
.brand b{font-size:1.1rem;color:var(--strong);font-weight:600}
.mk{fill:currentColor;display:block;direction:ltr}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;font:inherit;font-size:.9rem;background:none;border:0;color:var(--muted);padding:8px 14px 10px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-current="page"]{color:var(--strong);border-bottom-color:var(--accent);font-weight:600}
.tabs button:hover{color:var(--strong)}
.status{font-size:.75rem;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.status.cloud{background:var(--good-soft);color:var(--good)}
.status.local{background:var(--warn-soft);color:var(--warn)}

main{max-width:1080px;margin:0 auto;padding-block:22px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--plum);color:#fff;isolation:isolate;border-radius:28px;box-shadow:var(--shadow-brand);padding:26px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr);padding:22px 20px}}
.hero .pat,.intro .pat{position:absolute;inset:-10% -5% auto auto;width:78%;max-width:640px;fill:var(--cream);opacity:.16;z-index:-1;pointer-events:none;direction:ltr}
.hero h1{color:var(--cream);font-weight:200;font-size:clamp(1.7rem,5vw,2.5rem);letter-spacing:-.02em}
.hero .sub{color:rgba(255,255,255,.86);font-size:.9rem}
.hero .figs{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px}
.hero .fig span{display:block;font-size:.75rem;color:rgba(255,255,255,.78)}
.hero .fig b{font-size:1.5rem;font-weight:300;color:#fff}
.hero .track{height:6px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin-top:14px;max-width:420px}
.hero .track i{display:block;height:100%;background:var(--cream);border-radius:99px}
.ring{width:132px;height:132px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.2}
.ring .lbl b{font-size:2rem;font-weight:200}
.ring .lbl span{font-size:.7rem;opacity:.85}
.hero .ring circle.bgc{stroke:rgba(255,231,188,.2)} .hero .ring circle.fgc{stroke:var(--cream)}
.hero .ring .lbl b{color:var(--cream)}
.ring circle.bgc{stroke:var(--sunk)} .ring circle.fgc{stroke:var(--accent)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ice{background:var(--ice);border-radius:20px;padding:18px 22px;display:grid;gap:8px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.cols.wide{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:820px){.cols,.cols.wide{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:22px;min-width:0}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:grid;gap:2px;min-width:0}
.tile>span{font-size:.78rem;color:var(--muted)}
.tile b{font-size:1.35rem;font-weight:300;color:var(--strong)}
.tile small{font-size:.74rem;color:var(--subtle)}
.tile.pos b{color:var(--good)} .tile.neg b{color:var(--bad)}

/* bars */
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar>i.over{background:var(--bad)}
.bar>em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--strong);opacity:.55}
.bar.lg{height:12px}

/* forms */
form.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.fld{display:grid;gap:3px;min-width:0;flex:1 1 120px}
.fld.s{flex:0 1 140px}
.fld label{font-size:.74rem;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:8px 18px;background:var(--strong);color:var(--bg);cursor:pointer;white-space:nowrap}
.btn.teal{background:var(--accent);color:var(--on-accent)}
.btn.line{background:none;color:var(--strong);border:1px solid var(--line-strong)}
.btn.danger{background:var(--bad);color:var(--bg)}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.x{font:inherit;border:0;background:none;color:var(--subtle);cursor:pointer;padding:2px 8px;border-radius:8px;font-size:.85rem}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.8rem;border:1px dashed var(--line-strong);background:none;color:var(--muted);border-radius:999px;padding:3px 12px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* ledger table */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{color:var(--strong);text-align:right;border-bottom:1.5px solid var(--strong);font-weight:600;padding:6px 8px;white-space:nowrap;font-size:.8rem}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--strong);font-weight:500}
td input{padding:4px 8px;width:110px}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* checklist rows */
.list{display:grid}
.li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .name{flex:1;min-width:0}
.li .name small{display:block;color:var(--subtle);font-size:.75rem}
.li input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);flex:none;margin:0}
.li input.amt{width:96px;flex:none;padding:4px 8px;text-align:center}
.li.done .name{color:var(--muted)}
.grp-h{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-weight:600;padding-top:10px}

.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* month rail */
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.rail button{flex:0 0 auto;font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:5px 12px;cursor:pointer;line-height:1.35;text-align:center}

<script>
/* Claude's runtime is not here; these stand in for the two parts the app
   uses: the AI calls (through our backend, set by the module below) and
   saving a file. */
(function(){
  const toB64=(file)=>new Promise((res,rej)=>{
    /* a phone photo is shrunk to ~1600px first: smaller upload, same reading */
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ try{ const k=Math.min(1,1600/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const d=c.toDataURL("image/jpeg",.85); URL.revokeObjectURL(url); res({type:"image/jpeg",data:d.split(",")[1]}); }catch(e){ rej(e) } };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(Object.assign(new Error("bad image"),{code:"image_rejected"})) };
    img.src=url;
  });
  const call=async(prompt,opts,json)=>{
    if(!window.ccAiCall) throw Object.assign(new Error("off"),{code:"not_granted"});
    const image=opts&&opts.images&&opts.images[0]?await toB64(opts.images[0]):null;
    return window.ccAiCall({prompt,json:!!json,image});
  };
  const sample=async(prompt,opts)=>{ const r=await call(prompt,opts,false); return {text:r.text||""} };
  sample.json=async(prompt,opts)=>{ const r=await call(prompt,opts,true); return r.json };
  sample.limits=async()=>({images:true});
  const downloads={ async save({filename,data}){
    const blob=data instanceof Blob?data:new Blob([data],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename||"file";
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove() },1000);
  } };
  window.claude={ use: async (k)=> k==="sample" ? (window.ccAiOn?sample:null) : k==="downloads" ? downloads : null };
})();
</script>

/* ---------- computations ---------- */
const planMonths=()=>{const n=clamp(Math.round(N(S.profile.months))||24,1,120);return Array.from({length:n},(_,i)=>addM(S.profile.start||CUR,i))};
const md=m=>{const d=S.months[m]||{};return{inc:d.inc||{},paid:d.paid||{},done:d.done||null,plog:d.plog||{},extras:d.extras||[],xinc:d.xinc||[],note:d.note||'',dec:d.dec||[]}};
const mw=m=>{const d=S.months[m]=S.months[m]||{};d.inc=d.inc||{};d.paid=d.paid||{};d.extras=d.extras||[];d.xinc=d.xinc||[];d.plog=d.plog||{};d.dec=d.dec||[];
  if(!d.done){d.done={};Object.keys(d.paid).forEach(k=>d.done[k]=true)}return d};
const isDone=(d,r)=>d.done?!!d.done[r.id]:d.paid[r.id]!=null;
const isPart=(d,r)=>!isDone(d,r)&&N(d.paid[r.id])>0;
const bKind=b=>b.kind||(b.cat==='fixed'?'fixed':'var');
const debtPay=d=>N(d.installment)+N(d.extra);
const debtRows=()=>S.debts.filter(d=>debtPay(d)>0).map(d=>({id:'d_'+d.id,name:'قسط '+d.name,cat:'fixed',kind:'fixed',amount:debtPay(d),extra:N(d.extra),day:N(d.day),debt:true}));
const fixedItems=()=>S.budget.filter(b=>bKind(b)==='fixed');
const varItems=()=>S.budget.filter(b=>bKind(b)==='var');
const commitRows=()=>[...fixedItems(),...debtRows()];
const planInc=()=>sum(S.incomes,'amount');
const planFixed=()=>sum(commitRows(),'amount');
const planVar=()=>N(S.profile.minLiving)>0?N(S.profile.minLiving):sum(varItems(),'amount');
const planExp=()=>planFixed()+planVar();
const goalsNeed=()=>S.goals.map(goalStat).filter(s=>s.left>0&&s.mLeft>0).reduce((a,s)=>a+s.need,0);
function budgetBase(){const inc=planInc(),fx=planFixed(),pool=inc-fx,mn=planVar(),cap=pool-mn,need=goalsNeed();
  return{inc,fx,pool,mn,cap,need,gap:cap-need,afterGoals:inc-need}}
const debtMonths=(d,x)=>{const p=N(d.installment)+(x?N(d.extra):0);return p>0&&N(d.balance)>0?Math.ceil(N(d.balance)/p):0};

function calc(m){
  const d=md(m), rows=commitRows();
  const gotInc=S.incomes.reduce((a,i)=>a+(d.inc[i.id]!=null?N(d.inc[i.id]):0),0)+sum(d.xinc,'amount');
  const paid=rows.reduce((a,r)=>a+(d.paid[r.id]!=null?N(d.paid[r.id]):0),0);
  const vi=varItems(), legacy=vi.reduce((a,r)=>a+(d.paid[r.id]!=null?N(d.paid[r.id]):0),0);
  const extras=sum(d.extras,'amount')+legacy, varPlan=planVar();
  const spent=paid+extras;
  const saved=sum(S.contrib.filter(c=>c.month===m),'amount');
  const byCat={};Object.keys(CATS).forEach(c=>byCat[c]={plan:0,act:0});
  [...rows,...vi].forEach(r=>{const c=byCat[r.cat]||byCat.other;c.plan+=N(r.amount);if(d.paid[r.id]!=null)c.act+=N(d.paid[r.id])});
  d.extras.forEach(e=>{(byCat[e.cat]||byCat.other).act+=N(e.amount)});
  const done=rows.filter(r=>isDone(d,r)).length, part=rows.filter(r=>isPart(d,r)).length;
  return{gotInc,paid,extras,varPlan,varLeft:varPlan-extras,spent,saved,left:gotInc-spent-saved,done,part,total:rows.length,byCat,
    hasData:gotInc>0||spent>0||saved>0};
}
function goalStat(g){
  const target=N(g.target), start=N(g.start);
  const cur=start+sum(S.contrib.filter(c=>c.goalId===g.id),'amount');
  const p=target>0?clamp(cur/target*100,0,100):0;
  const left=Math.max(0,target-cur);
  const created=g.created||CUR, dl=g.deadline||addM(CUR,12);
  const mLeft=diffM(CUR,dl)+1;
  const need=mLeft>0?left/mLeft:left;
  const total=Math.max(1,diffM(created,dl)+1), el=clamp(diffM(created,CUR),0,total);
  const expected=start+(target-start)*el/total;
  const expP=target>0?clamp(expected/target*100,0,100):0;
  let st,lbl;
  if(cur>=target&&target>0){st='good';lbl='تحقق'}
  else if(mLeft<=0){st='bad';lbl='فات موعده'}
  else if(cur>=expected*1.05&&cur>start){st='good';lbl='متقدم'}
  else if(cur>=expected*0.95){st='good';lbl='على المسار'}
  else if(cur>=expected*0.8){st='warn';lbl='متأخر شوي'}
  else{st='bad';lbl='متأخر'}
  return{cur,p,left,need,mLeft,expected,expP,st,lbl,ratio:expected>0?cur/expected:1};
}
const goldVal=g=>N(g.grams)*N(S.gold24)*N(g.karat||24)/24;
const stockFx=s=>s.cur==='USD'?N(S.profile.usd)||0.307:1;
const stockVal=s=>N(s.qty)*(N(s.price)||N(s.avg))*stockFx(s);
const stockCost=s=>N(s.qty)*N(s.avg)*stockFx(s);
function wealth(){
  const by={};Object.keys(AKIND).forEach(k=>by[k]=0);
  S.assets.forEach(a=>{by[a.kind in by?a.kind:'other']+=N(a.value)});
  const goldInv=sum(S.gold.filter(g=>g.kind!=='wear'),goldVal), goldWear=sum(S.gold.filter(g=>g.kind==='wear'),goldVal);
  const stocks=sum(S.stocks,stockVal), cost=sum(S.stocks,stockCost);
  const gold=goldInv+(S.profile.countWear?goldWear:0);
  const assets=sum(Object.values(by),x=>x)+gold+stocks;
  const debt=sum(S.debts,'balance');
  return{by,goldInv,goldWear,gold,stocks,cost,assets,debt,net:assets-debt,liquid:by.cash+by.deposit};
}
function score(){
  const parts=[];
  const act=S.goals.filter(g=>N(g.target)>0);
  if(act.length){const v=act.reduce((a,g)=>a+clamp(goalStat(g).ratio,0,1),0)/act.length;parts.push({k:'الأهداف',v,w:.4})}
  const m=lastDataMonth();
  if(m){const c=calc(m),pe=planExp();
    if(pe>0&&c.spent>0)parts.push({k:'الالتزام بالميزانية',v:clamp(1-Math.max(0,c.spent-pe)/pe*2,0,1),w:.3});
    if(c.varPlan>0&&c.extras>0)parts.push({k:'المصاريف المتغيرة ضمن المتاح',v:clamp(1-Math.max(0,c.extras-c.varPlan)/c.varPlan*2,0,1),w:.3});}
    const iv=isAsas()?null:idxInvest();if(iv&&parts.length)parts.push({k:'الاستثمار',v:iv.val/100,w:.15});
  if(S.debts.length&&parts.length)parts.push({k:'الديون',v:idxDebt().val/100,w:.15});
  const dec=md(CUR).dec;
  if(dec.length&&parts.length)parts.push({k:'قرارات الشهر',v:dec.filter(x=>x.done).length/dec.length,w:.15});
  if(!parts.length)return null;
  const tw=sum(parts,'w');return{val:Math.round(parts.reduce((a,p)=>a+p.v*p.w,0)/tw*100),parts};
}
function lastDataMonth(){

/* ---------- insights (rule-based analysis) ---------- */
function insights(){
  const out=[], pi=planInc(), pe=planExp(), w=wealth();
  const inst=sum(S.debts,'installment');
  const m=lastDataMonth(), c=m?calc(m):null;
  if(!pi){out.push({l:'warn',t:'ما سجلت دخلك الشهري',b:'بدون الدخل ما نقدر نحسب الميزانية ولا نقيس قدرتك على الأهداف.',q:'شنو مصادر دخلك كلها، حتى الصغيرة منها؟',go:'base'});return out}
  const bb=budgetBase();
  if(!N(S.profile.minLiving))out.push({l:'warn',t:'ما حددت أقل مبلغ تقدر تعيش فيه',b:'هذا الرقم هو اللي يحدد كم يبقى لأهدافك من الراتب. حدده في المدخلات الأساسية.',q:'لو الشهر الجاي ضيق، شنو أقل مبلغ تقدر تعيش فيه بدون ما تتضايق؟',go:'base'});
  // variable spending vs allowance
  if(c&&c.varPlan>0&&c.extras>0){const r=c.extras/c.varPlan;
    if(r>1.05)out.push({l:'bad',t:`المصاريف المتغيرة في ${mLabel(m)} أكثر من المتاح`,b:`صرفت ${fmt0(c.extras)} د.ك والمتاح ${fmt0(c.varPlan)} د.ك. الزيادة تنسحب من حصة أهدافك.`,q:'شنو الموقف أو الشعور اللي سبق أكثر صرفة فيهم؟',go:'month'});
    else if(m===CUR&&r>0.8)out.push({l:'warn',t:`باقي ${fmt0(c.varLeft)} د.ك بس للمصاريف المتغيرة`,b:'صرفت أغلب المتاح لهالشهر. خفف الصرف لين ينزل الراتب الجاي.'});}
  // debt to income
  if(inst>0){const r=inst/pi*100;
    if(r>40)out.push({l:'bad',t:`الأقساط تاخذ ${Math.round(r)}% من دخلك`,b:'فوق ٤٠٪ يعني ضغط عالي وأي ظرف طارئ يهز الميزانية. الأولوية تقليل الديون قبل التزامات جديدة.',q:'أي قرض لو خلص يفرق معاك أكثر نفسياً؟'});
    else if(r>30)out.push({l:'warn',t:`الأقساط ${Math.round(r)}% من الدخل`,b:'ضمن الحد بس قريب من الخط الأحمر (٤٠٪). تجنب أي قسط جديد.',q:'هل في قسط تقدر تسدده مبكر من الفايض؟'});
    else out.push({l:'good',t:`الأقساط ${Math.round(r)}% من الدخل`,b:'نسبة مريحة.'});}
  // emergency fund
  if(pe>0){const mo=w.liquid/pe;
    if(mo<3)out.push({l:mo<1?'bad':'warn',t:`صندوق الطوارئ يغطي ${fmt(Math.round(mo*10)/10)} شهر`,b:`الأمان يبدأ من ٣ شهور مصاريف (${fmt0(pe*3)} د.ك) والمثالي ٦ شهور. سجل الكاش والحسابات في قسم إدارة الأصول إذا ما سجلتهم.`,q:'لو صار ظرف طارئ باجر، من وين بتدبر المبلغ؟',go:'wealth'});
    else if(mo<6)out.push({l:'warn',t:`الطوارئ تغطي ${fmt(Math.round(mo*10)/10)} شهور`,b:'وضع آمن. كمّل لين ٦ شهور وبعدها حول الزيادة للاستثمار.'});
    else out.push({l:'good',t:`الطوارئ تغطي ${Math.round(mo)} شهور`,b:'عندك أمان كافي. الكاش الزايد عن ٦ شهور ممكن يشتغل لك بالاستثمار.',q:'شنو يمنعك تستثمر الكاش الزايد؟ خوف ولا عدم وضوح؟'});}
  // feasibility of goals
  const free=bb.cap;
  const act=S.goals.map(g=>[g,goalStat(g)]).filter(([g,s])=>s.left>0&&s.mLeft>0);
  const need=act.reduce((a,[,s])=>a+s.need,0);
  if(act.length){
    if(need>free&&free>=0)out.push({l:'bad',t:'أهدافك أكبر من المتاح لها في راتبك',b:`أهدافك تحتاج ${fmt0(need)} د.ك بالشهر والمتاح لها بعد الثابتة وأقل مبلغ تعيش فيه ${fmt0(free)} د.ك. إما نطول المدة أو نرتب الأولويات أو نزيد الدخل.`,q:'لو بتختار هدف واحد بس هالسنة، أي واحد؟',go:'goals'});
    else if(free<0)out.push({l:'bad',t:'مصاريفك المخططة أكبر من دخلك',b:`الفرق ${fmt0(-free)} د.ك بالشهر. هذا لازم ينحل قبل أي هدف.`,q:'أي مصروف تحس إنه موجود من العادة مو من الحاجة؟',go:'base'});
    else out.push({l:'good',t:'أهدافك ممكنة من راتبك',b:`تحتاج ${fmt0(need)} د.ك بالشهر والمتاح لها ${fmt0(free)} د.ك.`});}
  else if(!S.goals.length)out.push({l:'warn',t:'ما عندك أهداف مسجلة',b:'الفلوس بدون هدف تنصرف. حط هدف واحد واضح بمبلغ وتاريخ.',q:'شنو الشي اللي لو حققته خلال سنة بتفتخر فيه؟',go:'goals'});
  act.filter(([,s])=>s.st==='bad').slice(0,3).forEach(([g,s])=>out.push({l:'bad',t:`هدف "${g.name}" متأخر`,b:`المفروض يكون عندك ${fmt0(s.expected)} د.ك والموجود ${fmt0(s.cur)}. تحتاج ${fmt0(s.need)} د.ك بالشهر عشان تلحق الموعد.`,q:g.why?`تذكر ليش بديت: "${g.why}". هالسبب للحين مهم لك؟`:'شنو اللي صار هالفترة وأخّر الهدف؟',go:'goals'}));
  // overspend by category
  if(c){Object.entries(c.byCat).forEach(([k,v])=>{if(v.plan>0&&v.act>v.plan*1.1)out.push({l:'warn',t:`تجاوزت ميزانية ${CATS[k]}`,b:`المخطط ${fmt0(v.plan)} والفعلي ${fmt0(v.act)} د.ك.`,q:'شنو كان الشعور أو الموقف اللي سبق هالصرف؟'})});}
  // portfolio
  if(w.stocks>0){const top=S.stocks.map(s=>[s,stockVal(s)]).sort((a,b)=>b[1]-a[1])[0];
    const share=top[1]/w.stocks;
    if(S.stocks.length>1&&share>0.4)out.push({l:'warn',t:`${top[0].sym} يشكل ${Math.round(share*100)}% من محفظتك`,b:'تركيز عالي في سهم واحد. التنويع يحميك من تقلب شركة وحدة.'});
    const pl=w.cost>0?(w.stocks-w.cost)/w.cost:0;
    if(pl<-0.15)out.push({l:'warn',t:`المحفظة نازلة ${Math.round(-pl*100)}%`,b:'النزول جزء طبيعي من الاستثمار. القرار يكون على أساس الخطة مو على أساس الخوف.',q:'لو ما شفت السعر اليوم، هل كان بيتغير قرارك؟'});
    else if(pl>0.15)out.push({l:'good',t:`المحفظة رابحة ${Math.round(pl*100)}%`,b:'أداء حلو. راجع إذا تحتاج تعيد التوازن بين الأصول.'});}
  if(w.assets>0){const inv=w.stocks+w.goldInv+w.by.realty+w.by.biz;
    if(inv/w.assets<0.15&&pe>0&&w.liquid>=pe*6)out.push({l:'warn',t:'أغلب ثروتك كاش',b:'الكاش آمن بس يخسر قيمته مع التضخم. بعد ما تأمن الطوارئ، فكر بأصول تنمو.',q:'شنو تعريفك للاستثمار الآمن؟'});}
  // net worth trend
  const ks=Object.keys(S.snaps).sort();
  if(ks.length>1){const a=S.snaps[ks[ks.length-2]],b=S.snaps[ks[ks.length-1]];
    if(b>a)out.push({l:'good',t:'صافي ثروتك زاد',b:`من ${fmt0(a)} إلى ${fmt0(b)} د.ك.`});
    else if(b<a)out.push({l:'warn',t:'صافي ثروتك نزل',b:`من ${fmt0(a)} إلى ${fmt0(b)} د.ك. شوف هل السبب صرف ولا تقلب سوق.`});}
  const order={bad:0,warn:1,good:2};return out.sort((a,b)=>order[a.l]-order[b.l]);
}

/* ---------- rules & decisions from the analysis ---------- */
const up5=x=>Math.ceil(x/5)*5;
function suggestRules(){
  const out=[], pi=planInc(), pe=planExp(), w=wealth(), inst=sum(S.debts,'installment');
  const sal=S.incomes.filter(i=>N(i.day)>0).sort((a,b)=>N(b.amount)-N(a.amount))[0];
  if(commitRows().length)out.push(`الالتزامات والأقساط تتسدد أول ما ${sal?'ينزل '+sal.name+' (يوم '+N(sal.day)+')':'ينزل الدخل'}، قبل أي صرف ثاني`);
  const gn=goalsNeed();if(gn>0)out.push(`أول ما ينزل الراتب نخصم ${fmt0(up5(gn))} د.ك للأهداف، والباقي للالتزامات والمعيشة`);
  S.goals.map(g=>[g,goalStat(g)]).filter(([,s])=>s.left>0&&s.mLeft>0).forEach(([g,s])=>out.push(`نحط ${fmt0(up5(s.need))} د.ك لهدف "${g.name}" كل شهر لين ${mLabel(g.deadline)}`));
  if(pe>0&&w.liquid<pe*3)out.push(`ما نستثمر قبل ما يوصل صندوق الطوارئ ${fmt0(up5(pe*3))} د.ك (٣ شهور مصاريف)`);
  if(pi>0&&inst/pi>0.3)out.push('ما ناخذ أي قسط أو قرض جديد لين تنزل الأقساط تحت ٣٠٪ من الدخل');
  const cap=planVar();
  if(cap>0)out.push(`سقف المصاريف المتغيرة ${fmt0(cap)} د.ك بالشهر، اللي يزيد ينتظر الشهر الجاي`);
  if(S.incomes.some(i=>i.variable||i.kind!=='salary'))out.push('أي دخل زيادة عن المتوقع: نصه للأهداف ونصه حر');
  else out.push('أي دخل إضافي أو بونص: نصه للأهداف ونصه حر');
  if(pi-pe<0)out.push(`نقلل المصاريف ${fmt0(up5(pe-pi))} د.ك بالشهر قبل ما نضيف أي هدف جديد`);
  if(S.stocks.length){out.push('ما نبيع بسبب نزول السوق. نراجع المحفظة مرة بالشهر ونقرر حسب الخطة');
    if(S.stocks.length>1)out.push('ما يتعدى أي سهم ٢٥٪ من المحفظة');}
  out.push('آخر كل شهر نسوي وقفة: نحدث الثروة ونراجع الأهداف');
  const have=new Set(S.rules.map(r=>r.t));return out.filter(t=>!have.has(t));
}
function suggestDecisions(m){
  const out=[], pe=planExp(), w=wealth();
  S.goals.map(g=>[g,goalStat(g)]).filter(([,s])=>s.left>0&&s.mLeft>0).forEach(([g,s])=>out.push(`أحوّل ${fmt0(up5(s.need))} د.ك لهدف "${g.name}"`));
  const prev=calc(addM(m,-1));
  Object.entries(prev.byCat).forEach(([k,v])=>{if(v.plan>0&&v.act>v.plan*1.1)out.push(`أرجّع ${CATS[k]} للسقف (${fmt0(v.plan)} د.ك) بعد ما تجاوزته الشهر اللي طاف`)});
  if(prev.varPlan>0&&prev.extras>prev.varPlan)out.push(`أرجّع المصاريف المتغيرة تحت ${fmt0(prev.varPlan)} د.ك وأسجلها أول بأول`);
  if(pe>0&&w.liquid<pe*3)out.push(`أزيد صندوق الطوارئ (الحين يغطي ${fmt(Math.round(w.liquid/pe*10)/10)} شهر)`);
  const free=planInc()-pe-S.goals.reduce((a,g)=>{const s=goalStat(g);return a+(s.left>0&&s.mLeft>0?s.need:0)},0);
  const sm=S.debts.filter(d=>N(d.balance)>0).sort((a,b)=>N(a.balance)-N(b.balance))[0];
  if(sm&&free>50)out.push(`أدفع ${fmt0(up5(free*0.3))} د.ك زيادة على ${sm.name} عشان يخلص أسرع`);
  if(S.stocks.length)out.push('أحدث أسعار الأسهم وأراجع المحفظة');
  if(S.gold.length)out.push('أحدث سعر غرام الذهب');
  out.push('أكتب وقفة الشهر: شنو نجح وشنو أغير');
  const have=new Set(md(m).dec.map(x=>x.t));return out.filter(t=>!have.has(t));
}

const daysIn=(y,m)=>new Date(y,m,0).getDate();
function nextDate(day){const d0=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
  for(let i=0;i<2;i++){const y=NOW.getFullYear(),m=NOW.getMonth()+i;const dt=new Date(y,m,Math.min(day,daysIn(y,m+1)));if(dt>=d0)return dt}
  return new Date(NOW.getFullYear(),NOW.getMonth()+1,Math.min(day,daysIn(NOW.getFullYear(),NOW.getMonth()+2)))}
function allReminders(){
  const out=[];
  S.incomes.filter(i=>N(i.day)>0).forEach(i=>out.push({id:'i_'+i.id,t:'نزول '+i.name,day:N(i.day),auto:'الدخل'}));
  commitRows().filter(r=>N(r.day)>0).forEach(r=>out.push({id:'b_'+r.id,t:'موعد '+r.name+' ('+fmt(N(r.amount))+' د.ك)',day:N(r.day),auto:r.debt?'القروض':'الميزانية'}));
  S.goals.forEach(g=>{const s=goalStat(g);if(s.left>0&&g.deadline>=CUR){const[y,m]=g.deadline.split('-').map(Number);out.push({id:'g_'+g.id,t:'موعد هدف "'+g.name+'"',date:g.deadline+'-'+pad(Math.min(28,daysIn(y,m))),auto:'الأهداف'})}});
  out.push({id:'review',t:'وقفة آخر الشهر: حدّث الثروة وراجع الأهداف',day:31,auto:'الخطة'});
  S.reminders.forEach(r=>out.push(Object.assign({},r)));
  out.forEach(r=>{r.next=r.date?new Date(r.date+'T00:00:00'):nextDate(r.day)});
  return out.filter(r=>!r.date||r.next>=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate())).sort((a,b)=>a.next-b.next);
}
function whenLbl(dt){const d0=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());const n=Math.round((dt-d0)/864e5);
  return n===0?['اليوم','today']:n===1?['باجر','soon']:n<=3?['باقي '+n+' أيام','soon']:n<=10?['باقي '+n+' يوم','']:[dt.getDate()+' '+AR[dt.getMonth()],'']}
function buildICS(list){
  const x=s=>String(s).replace(/\\/g,'\\\\').replace(/([,;])/g,'\\$1').replace(/\n/g,'\\n');
  const ymd=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const st=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Cash Clinic//Dafter Alwafra//AR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:متابعة كاش'];
  list.forEach(r=>{const nx=new Date(r.next.getTime()+864e5);
    L.push('BEGIN:VEVENT','UID:'+r.id+'@dafter-alwafra','DTSTAMP:'+st,'DTSTART;VALUE=DATE:'+ymd(r.next),'DTEND;VALUE=DATE:'+ymd(nx),'SUMMARY:'+x(r.t),'DESCRIPTION:'+x('تذكير من متابعة كاش · كاش كلينك'));
    if(!r.date){const days=[];for(let k=r.day;k>=28;k--)days.push(k);L.push(r.day>28?'RRULE:FREQ=MONTHLY;BYMONTHDAY='+days.join(',')+';BYSETPOS=-1':'RRULE:FREQ=MONTHLY;BYMONTHDAY='+r.day)}
    L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+x(r.t),'TRIGGER:-PT15H','END:VALARM','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+x(r.t),'TRIGGER:PT9H','END:VALARM','END:VEVENT')});
  L.push('END:VCALENDAR');return L.join('\r\n');
}

function rvAnalyzeLocal(g,m,e){
  const pl=goalPlanMonthly(g),paid=goalPaid(g,m),st=goalStat(g),hist=Object.keys(S.reviews).filter(k=>k<m&&S.reviews[k][g.id]).length;
  const f=e.feel||[],w=e.what||[];

  else if(w.includes('نسيت'))L.push('النسيان معناه إن التحويل معتمد على ذاكرتك. الحل إنه يصير تلقائي.');

function parseRules(txt){
  let by='',date='';const out=[];
  String(txt||'').split(/\r?\n/).forEach(l=>{l=l.trim();if(!l)return;
    let m=l.match(/^(?:المستشار|المستشارة)\s*[:：]\s*(.+?)(?:\s*[·|]\s*(?:التاريخ|تاريخ الاستشارة)\s*[:：]\s*(.+))?$/);if(m){by=m[1].trim();if(m[2])date=m[2].trim();return}
    m=l.match(/^(?:التاريخ|تاريخ الاستشارة)\s*[:：]\s*(.+)$/);if(m){date=m[1].trim();return}
    if(/^قواعد خطت/.test(l)||/^الصق هالرسالة/.test(l)||/^(?:العميل|اسم العميل)\s*[:：]/.test(l))return;
    const t=l.replace(/^[\s\-–—•·*▪︎◦]*(?:[0-9٠-٩]+\s*[\.\-\)\(:،]\s*)?/,'').trim();if(t)out.push(t)});
  return{by,date,rules:out};
}

function vGantt(){

function vSub(){
  const a=access();
  const st=a.why==='owner'?'انت صاحبة الدفتر، كل شي مفتوح لك.':a.why==='trial'?`شهرك المجاني فعال لين ${dTxt(a.until)} (باقي ${a.left+1} يوم).`:a.why==='sub'?`اشتراكك فعال لين ${dTxt(a.until)}.`:a.why==='expired'?'اشتراكك منتهي. بياناتك محفوظة، والتحليل والأدوات الذكية مقفلة لين تجدد.':'انت على النسخة المجانية: التسجيل كله مفتوح، والتحليل والرسومات والأدوات الذكية للمشتركين.';
  return `<section class="panel" id="sec-sub">
    <div class="panel-head"><h2>اشتراكي</h2>${subPill()}</div>
    <p>${st}</p>
    <div class="small muted">مع الاشتراك يتفتح لك: التحليل والنصائح، مؤشر الإنجاز، كل الرسومات البيانية، المدرب الذكي، قراءة الفواتير من الصورة، القرارات المقترحة، وإضافة التذكيرات لتقويم التلفون.</div>
    <div><a class="btn teal" href="${CONTACT.web}" target="_blank" rel="noopener" style="text-decoration:none">اشترك من موقعنا</a></div>

}

function sosMsg(){
  const w=wealth(),pe=planExp(),pi=planInc(),sv=SOS_SVCS.find(x=>x.id===sos.svc)||SOS_SVCS[0],A=advNow(),bb=budgetBase();
  const L=['طلب متابعة · متابعة كاش',
    'إلى: '+A.name,
    'الخدمة: '+sv.name+(sv.price?' ('+sv.price+(sv.sub==='بالشهر'?' بالشهر':'')+')':''),
    'الاسم: '+(sos.name||S.profile.name||'-'),
    'رقم التواصل: '+(sos.phone||'-'),
    
    sos.when?'الحالة: '+sos.when:'',
    '','شنو اللي صاير معاي:',(sos.text||'').trim(),'',
    'وضعي من الدفتر:',
    '- الدخل الشهري: '+fmt0(pi)+' د.ك',
    '- المصاريف الثابتة: '+fmt0(bb.fx)+' د.ك',
    '- أقل مبلغ أعيش فيه: '+fmt0(bb.mn)+' د.ك',
    '- المتاح للأهداف: '+fmt0(bb.cap)+' د.ك والأهداف تحتاج '+fmt0(bb.need)+' د.ك',
    '- الأقساط: '+fmt0(sum(S.debts,'installment'))+' د.ك بالشهر',
    '- الكاش والطوارئ: '+fmt0(w.liquid)+' د.ك'+(pe>0?' (يغطي '+(Math.round(w.liquid/pe*10)/10)+' شهر)':''),
    '- صافي الثروة: '+fmt0(w.net)+' د.ك'];
  if(sv.id==='timeline'&&S.goals.length){L.push('','أهدافي ومواعيدها:');S.goals.forEach(g=>{const s=goalStat(g);L.push('- '+g.name+': باقي '+fmt0(s.left)+' د.ك، الموعد '+mLabel(g.deadline)+(s.left>0&&s.mLeft>0?'، يحتاج '+fmt0(s.need)+' بالشهر':''))})}
  return L.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

async function runCoach(){
  const out=document.getElementById('coach-out');const q=(document.getElementById('coach-q')||{}).value||'';
  let sample=null;try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){}

  coachBusy=true;coachCtl=new AbortController();render();
  const o2=()=>document.getElementById('coach-out');
  const prompt=`أنت مدرب مالي سلوكي من "كاش كلينك" في الكويت. فلسفتك: التغيير المالي يبدأ من فهم المعتقدات والمشاعر والأسباب الجذرية للسلوك، مو من الأرقام بس. أسلوبك سقراطي: تحتوي الشخص أول، وتسأل قبل لا تنصح.
اكتب باللهجة الكويتية فقط (مو فصحى)، بنبرة هادية ومشجعة وعملية. لا تستخدم إيموجي ولا شرطات طويلة. الأرقام بالدينار الكويتي.
البنية:
١) جملة تقدير صادقة لشي إيجابي في وضعه.
٢) ثلاث ملاحظات مختصرة مبنية على الأرقام (كل وحدة سطر يبدأ بـ "- ").
٣) ثلاث خطوات عملية للشهر الجاي بأرقام محددة (كل وحدة سطر يبدأ بـ "- ").
٤) سؤالين تأمليين يساعدونه يفهم سلوكه.
خل نصايحك تمشي مع قواعد الاستشارة المذكورة في البيانات. لا تنصح بشراء أو بيع سهم معين. إذا سأل سؤال محدد، جاوبه أول وبعدها كمل البنية باختصار. الطول أقل من ٢٥٠ كلمة.

بيانات العميل (JSON):
${JSON.stringify(coachData())}

${q.trim()?'سؤال العميل: '+q.trim():'العميل يبي قراءة عامة لوضعه.'}`;
  try{
    const r=await sample(prompt,{signal:coachCtl.signal,modelTier:'default',cache:false,onText:({text})=>{const el=o2();if(el)el.textContent=text}});
    S.coach={text:r.text,at:new Date().toLocaleDateString('ar-KW-u-nu-latn',{day:'numeric',month:'long',year:'numeric'})};persist();
  }catch(e){

  }
  coachBusy=false;coachCtl=null;render();
}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
const CONFIG={firebase:{apiKey:"AIzaSyCfD6ocmBsGVJms69TDbKt1PkcdSsGc3so",authDomain:"cash-quiz-906a6.firebaseapp.com",
  projectId:"cash-quiz-906a6",storageBucket:"cash-quiz-906a6.firebasestorage.app",
  messagingSenderId:"547780714224",appId:"1:547780714224:web:0e97107045a803623dec35"},functionsRegion:"us-central1"};
const fbApp=initializeApp(CONFIG.firebase), auth=getAuth(fbApp), fns=getFunctions(fbApp,CONFIG.functionsRegion);
const getMyApp=httpsCallable(fns,"getMyApp"), saveMyApp=httpsCallable(fns,"saveMyApp"), getClinicAs=httpsCallable(fns,"getClinicAs"),
      appAi=httpsCallable(fns,"appAi",{timeout:120000}),
      createDigitalRenewal=httpsCallable(fns,"createDigitalRenewal"), getOrderStatus=httpsCallable(fns,"getOrderStatus");
const q=s=>document.querySelector(s);
const escH=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const QS=new URLSearchParams(location.search);
const AS=(QS.get("as")||"").trim().toLowerCase(), PAID=(QS.get("paid")||"").trim(), WANT_RENEW=QS.get("renew")==="1";
const WA="https://wa.me/96522260820";
const back=`<a class="cbtn" href="./${AS?"?as="+encodeURIComponent(AS):""}">رجوع لعيادتي</a>`;
const kwDate=ms=>new Date(ms).toLocaleString("ar-KW-u-nu-latn",{weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit",timeZone:"Asia/Kuwait"});
function gate(icon,title,text,btns){ q("#ccGateIcon").textContent=icon; q("#ccGateTitle").textContent=title;
  q("#ccGateText").innerHTML=text||""; q("#ccGateBtns").innerHTML=btns||""; q("#ccGate").hidden=false; }

/* saving: a moment after the last change, and before the tab goes */
let pending=null, saving=false, timer=null;
function pill(msg,err){ const p=q("#ccPill"); p.textContent=msg||""; p.classList.toggle("err",!!err); }
async function flush(){
  clearTimeout(timer); timer=null;
  if(!pending || saving) return;
  const st=pending; pending=null; saving=true; pill("جاري الحفظ…");
  try{ await saveMyApp({ state:st }); pill(""); }
  catch(e){
    const m=(e&&e.message)||"";
    if(/منتهي/.test(m)){ pending=st; pill("ما انحفظ — اشتراكك منتهي", true); saving=false; renewGate(ACCESS,true); return; }
    if(!pending) pending=st; pill("ما انحفظ — "+(m||"تحقق من الاتصال")+" · بنحاول مرة ثانية", true); timer=setTimeout(flush, 8000); }
  finally{ saving=false; if(pending && !timer) flush(); }
}
window.ccSync=(json,quiet)=>{ if(window.ccReadOnly) return; pending=json; clearTimeout(timer); timer=setTimeout(()=>{ timer=null; flush(); }, quiet?1000:0); };
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flush(); });
window.addEventListener("beforeunload",e=>{ if(pending||saving){ flush(); e.preventDefault(); e.returnValue=""; } });

/* the AI helpers, through our backend */
window.ccAiCall=async(p)=>{ try{ return (await appAi(p)).data||{}; }
  catch(e){ const m=(e&&e.message)||""; throw Object.assign(new Error(m),{code:/خلصت/.test(m)?"limit":"failed"}); } };

function readOnly(who){
  window.ccReadOnly=true; window.ccAs=who; window.ccAiOn=false;
  document.body.classList.add("ccro");
  const bar=q("#ccAsBar"); bar.hidden=false;
  bar.innerHTML=`👁️ تشوف متابعة كاش حق <b dir="ltr">${escH(who)}</b> مثل ما يشوفها — للقراءة فقط، ما ينحفظ شي`;
}
/* متابعة كاش bought on its own (12 Nov 2026): 7 KD for a month, or 15 KD
   for three months at once. Unpaid, the app locks; the file is kept. */
let ACCESS={}, PLAN="monthly";
const dateOf=ms=>{ try{ return new Date(ms).toLocaleDateString("ar-KW-u-nu-latn",{weekday:"long",day:"numeric",month:"long",timeZone:"Asia/Kuwait"}); }catch(e){ return ""; } };
function plansHtml(a){
  const pr=(a&&a.prices)||{monthly:7,quarter:15};
  return `<div class="ccPlans">
    <button type="button" class="ccPlan" data-plan="monthly" aria-pressed="${PLAN==="monthly"}"><b>شهر بشهر</b><div class="pr">${pr.monthly} <small>د.ك بالشهر</small></div><span>تجدد كل شهر بشهره وتوقف متى ما تبي</span></button>
    <button type="button" class="ccPlan" data-plan="quarter" aria-pressed="${PLAN==="quarter"}"><em class="chip">الأوفر</em><b>3 شهور مرة وحدة</b><div class="pr">${pr.quarter} <small>د.ك لـ3 شهور</small></div><span>يعني ${Math.round(pr.quarter/3)} د.ك بس بالشهر بدل ${pr.monthly}</span></button>
  </div><div class="ccErr" id="ccErr"></div>`;
}
function renewGate(a, expired){
  if(a && a.plan==="quarter") PLAN="quarter";
  const lead = expired
    ? `خلص اشتراكك ومتابعة كاش انقفلت مؤقتاً — <b>بس ملفك كله محفوظ</b>، وأول ما تجدد يرجع لك مثل ما خليته.`
    : `اشتراكك مفتوح لين <b>${escH(dateOf(a.until))}</b>. جدّد الحين وتنضاف المدة من بعده، ما يضيع عليك ولا يوم.`;
  gate(expired?"🔒":"📊", expired?"جدّد اشتراكك في متابعة كاش":"تجديد الاشتراك", lead+plansHtml(a),
    `<button type="button" class="cbtn" id="ccPay">ادفع وجدّد</button>`+(expired?back.replace('class="cbtn"','class="cbtn gh"'):`<button type="button" class="cbtn gh" id="ccLater">بعدين</button>`));
}
document.addEventListener("click",async (e)=>{
  const pl=e.target.closest(".ccPlan");
  if(pl){ PLAN=pl.dataset.plan; document.querySelectorAll(".ccPlan").forEach(b=>b.setAttribute("aria-pressed",b===pl)); return; }
  if(e.target.closest("#ccLater")){ q("#ccGate").hidden=true; return; }
  if(e.target.closest("[data-cc-renew]")){ e.preventDefault(); renewGate(ACCESS,false); return; }
  const pay=e.target.closest("#ccPay");
  if(pay){
    pay.disabled=true; pay.textContent="جاري التحويل…";
    try{ const r=(await createDigitalRenewal({ product:"mutaba", plan:PLAN })).data||{}; if(!r.url) throw new Error("ما وصلنا رابط الدفع"); location.href=r.url; }
    catch(err){ const x=q("#ccErr"); if(x) x.textContent=(err&&err.message)||"صار خطأ، حاول مرة ثانية"; pay.disabled=false; pay.textContent="ادفع وجدّد"; }
  }
});
async function waitPaid(){
  gate("⏳","نأكد الدفعة…","لحظات وتنفتح لك متابعة كاش.","");
  for(let i=0;i<12;i++){
    try{ const st=((await getOrderStatus({ orderId:PAID })).data||{}).status;
      if(st==="paid") return true;
      if(["failed","declined","cancelled","abandoned"].indexOf(st)!==-1) return false;
    }catch(e){}
    await new Promise(r=>setTimeout(r,2500));
  }
  return null;
}
/* the subscription's end date beside the package name, and a way to renew early */
function subLabel(a){
  if(!a.digital || !a.until) return a.pkgName||"";
  const d=Number(a.daysLeft)||0, left=d===1?"يوم واحد":d===2?"يومين":d<=10?d+" أيام":d+" يوم";
  return `اشتراكك لين ${dateOf(a.until)}`+(d<=5?` · باقي ${left}`:"");
}
function openApp(access, json, info){
  window.ccPkg=access.pkg||""; window.ccPkgName=AS?(access.pkgName||""):subLabel(access);
  window.ccRenew=!AS && !!access.digital && !access.staff;
  window.ccApp.open(json, info);
  q("#ccGate").hidden=true;
}

onAuthStateChanged(auth, async (u)=>{
  if(!u){ location.replace("./"+(AS?"?as="+encodeURIComponent(AS):"")); return; }
  try{
    if(AS){
      const d=(await getClinicAs({ email:AS })).data||{};
      readOnly(AS);
      const a=d.app||{};
      if(!a.open && !d.appState){
        return gate("🔒","متابعة كاش مقفولة عنده",
          a.reason==="before"?`عنده ${escH(a.pkgName)} — تنفتح له بعد جلسته الأولى (${escH(kwDate(a.nextMs))}).`
          :a.reason==="expired"?`اشتراكه في متابعة كاش انتهى يوم ${escH(dateOf(a.until))}، وما كتب فيها شي.`
                             :"ما عنده باقة أساس الحرية المالية ولا باقة الوفرة المالية ولا اشتراك في متابعة كاش، فما تنفتح له.",
          `<a class="cbtn" href="./?as=${encodeURIComponent(AS)}">عيادته</a>`);
      }
      return openApp(a, d.appState, { name:d.name||"" });
    }
    if(!u.emailVerified){
      try{ await u.reload(); }catch(e){}
      if(!auth.currentUser.emailVerified) return gate("✉️","أكّد إيميلك أول","متابعة كاش ملفك المالي الخاص، فتنفتح بعد ما تأكّد إيميلك من عيادتي.",back);
    }
    let paidOk=null;
    if(PAID){ paidOk=await waitPaid(); history.replaceState(null,"",location.pathname); }
    const d=(await getMyApp({})).data||{};
    const a=d.access||{}; ACCESS=a;
    if(!a.open){
      if(a.reason==="expired"){
        renewGate(a,true);
        if(paidOk===false) q("#ccErr").textContent="ما تمت الدفعة — جرّب مرة ثانية.";
        if(paidOk===null && PAID) q("#ccErr").textContent="الدفعة لسّا تتأكد — إذا انسحبت الفلوس حدّث الصفحة بعد دقيقة.";
        return;
      }
      if(a.reason==="before") return gate("🔒","تنفتح بعد جلستك الأولى",
        `متابعة كاش جزء من <b>${escH(a.pkgName)}</b> — تنفتح لك بعد ما تخلص جلستك الأولى${a.nextMs?` (${escH(kwDate(a.nextMs))})`:""}، عشان نبنيها سوا على أرقامك.`, back);
      return gate("📊","متابعة كاش",
        "نظامك المالي الشخصي: ميزانيتك وشهرك وأهدافك وديونك وأصولك واستثمارك بمكان واحد. تقدر تشترك فيها لحالك بـ <b>10 د.ك</b> وأول شهر مشمول، أو تنفتح لك مع <b>باقة أساس الحرية المالية</b> و<b>باقة الوفرة المالية</b> بعد أول جلسة.<br>إذا اشتركت بإيميل ثاني، ادخل عيادتي فيه أو كلّمنا واتساب ونحوّلها لك.",
        `<a class="cbtn" href="../quiz/mutaba.html">اعرف أكثر واشترك</a>`+back+`<a class="cbtn gh" href="${WA}" target="_blank" rel="noopener">واتساب</a>`);
    }
    window.ccAiOn=true;
    openApp(a, d.state, { name:d.name||u.displayName||"" });
    if(paidOk) pill("تم التجديد ✓");
    if(WANT_RENEW && !paidOk && a.digital && !a.staff){ history.replaceState(null,"",location.pathname); renewGate(a,false); }
  }catch(e){
    gate("⚠️","ما قدرنا نفتح متابعة كاش", escH((e&&e.message)||"صار خطأ")+" — حاول مرة ثانية بعد شوي.", back);
  }
});
</script>
