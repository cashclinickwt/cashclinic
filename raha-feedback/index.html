<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شاركنا رأيك | Cash Clinic</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../brand/mark/mark-purple.png">
<link rel="stylesheet" href="../assets/ds/fonts/fonts.css">
<style>
  :root{ --ink:#2F1749; --royal:#614588; --lav:#D2D3E1; --gold:#D3A146; --cream:#FFE6BB;
         --teal:#2F8789; --muted:#6B6577; --line:#E4E1EA; --ice:#F4FAFC; --wine:#962E37; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--ice);color:var(--ink);
       padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
  .wrap{max-width:560px;margin:0 auto}
  header{text-align:center;margin-bottom:18px}
  header img{width:150px;height:auto}
  .brand{font-size:13px;color:var(--muted);margin-top:6px}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 18px;
        box-shadow:0 8px 24px rgba(47,23,73,.07)}
  .tag{display:inline-block;background:var(--ink);color:var(--cream);font-size:13px;font-weight:600;
       border-radius:999px;padding:5px 14px}
  h1{font-size:24px;line-height:1.5;margin:12px 0 4px}
  .sub{color:var(--muted);font-size:14.5px;line-height:1.8;margin:0 0 6px}
  .hi{font-size:15px;font-weight:600;color:var(--royal);margin:0 0 4px}
  .q{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line)}
  .q .t{font-size:15.5px;font-weight:700;margin:0 0 10px;line-height:1.7}
  .q .t small{font-weight:500;color:var(--muted);font-size:12.5px}
  .q.miss .t{color:var(--wine)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{font:inherit;font-size:14.5px;border:1.5px solid var(--line);background:#fff;color:var(--ink);
       border-radius:999px;padding:10px 15px;cursor:pointer;min-height:44px}
  .opt.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
  /* stars run right to left like the rest of the page: the first star is on
     the right, and tapping the third fills the three from the right. The
     wrapper is only as wide as the stars, so ضعيف / ممتاز sit under the ends. */
  .rate{display:inline-block}
  .stars{display:flex;gap:6px}
  .star{font-size:34px;line-height:1;background:none;border:0;cursor:pointer;color:#D9D5E2;
        padding:4px;min-width:44px;min-height:44px}
  .star.on{color:var(--gold)}
  .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
  .f{margin:10px 0 0}
  .f label{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px}
  .f input,.f textarea{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);
       border-radius:12px;padding:12px 13px;background:#fff;color:var(--ink)}
  .f textarea{min-height:82px;resize:vertical}
  .btn{display:block;width:100%;font:inherit;font-size:17px;font-weight:700;border:0;border-radius:14px;
       padding:15px;margin-top:22px;background:var(--gold);color:#2A1406;cursor:pointer}
  .btn:disabled{opacity:.6}
  .msg{display:none;margin-top:12px;border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.8}
  .msg.err{display:block;background:#FDECEC;color:#8A1F28}
  .priv{font-size:12px;color:var(--muted);line-height:1.8;margin-top:14px;text-align:center}
  .done{text-align:center;padding:26px 8px}
  .done .big{font-size:46px}
  .done h2{font-size:22px;margin:10px 0 8px}
  .done p{color:var(--muted);line-height:1.9;margin:0}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="../brand/logo/logo-primary.png" alt="Cash Clinic — كاش كلينك">
    <div class="brand">ورشة «كيف تصنع راحتك المالية»</div>
  </header>
  <main class="card" id="app"><p class="sub" style="text-align:center">لحظة…</p></main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
const CC_CFG={firebase:{apiKey:"AIzaSyCfD6ocmBsGVJms69TDbKt1PkcdSsGc3so",authDomain:"cash-quiz-906a6.firebaseapp.com",
  projectId:"cash-quiz-906a6",storageBucket:"cash-quiz-906a6.firebasestorage.app",
  messagingSenderId:"547780714224",appId:"1:547780714224:web:0e97107045a803623dec35"},functionsRegion:"us-central1"};
const fns = getFunctions(initializeApp(CC_CFG.firebase), CC_CFG.functionsRegion);
const who    = httpsCallable(fns, "rahaFeedbackWho");
const submit = httpsCallable(fns, "submitRahaFeedback");

/* these lists must match RAHA_FB on the server word for word — the server
   rejects anything that is not on its own list, and a test fails if they drift */
const OPT = {
  clarity:   ["نعم، بشكل كبير", "إلى حد ما", "لا"],
  recommend: ["نعم بالتأكيد", "ممكن", "لا"],
  contact:   ["نعم", "لا"],
  heard:     ["Instagram", "WhatsApp", "عن طريق صديق / ترشيح", "إعلان", "فعالية أو لقاء سابق", "أخرى"],
};
const A = {};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const T = new URLSearchParams(location.search).get("t") || "";
let KNOWN = false;

function thanks(){
  $("#app").innerHTML = `<div class="done"><div class="big">🌹</div>
    <h2>شكراً لمشاركتك</h2>
    <p>رأيك جزء من تطويرنا، ونتمنى إن تجربتك مع كاش كلينك كانت خطوة حقيقية نحو وضوح وسيطرة أكبر على حياتك المالية.</p></div>`;
  window.scrollTo(0, 0);
}

const stars = (k, title) => `<div class="q" data-q="${k}"><div class="t">${title}</div>
  <div class="rate"><div class="stars" role="radiogroup" aria-label="${esc(title)}">${[1,2,3,4,5].map((n)=>
    `<button type="button" class="star" data-k="${k}" data-v="${n}" aria-label="${n} من 5">★</button>`).join("")}</div>
  <div class="ends"><span>ضعيف</span><span>ممتاز</span></div></div></div>`;
const pick = (k, title, extra) => `<div class="q" data-q="${k}"><div class="t">${title}</div>
  <div class="opts">${OPT[k].map((v)=>`<button type="button" class="opt" data-k="${k}" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>${extra||""}</div>`;
const open = (k, title) => `<div class="q" data-q="${k}"><div class="t">${title} <small>(اختياري)</small></div>
  <div class="f"><textarea id="f_${k}" maxlength="1500" placeholder="اكتب هنا…"></textarea></div></div>`;

function render(first){
  $("#app").innerHTML = `
    <span class="tag">استبيان الورشة</span>
    <h1>شاركنا رأيك 💜</h1>
    ${first ? `<p class="hi">أهلاً ${esc(first)}</p>` : ""}
    <p class="sub">رأيك يهمنا ويساعدنا نطوّر تجربتك القادمة مع كاش كلينك.</p>
    ${KNOWN ? "" : `<div class="q" data-q="phone"><div class="t">رقمك اللي سجّلت فيه بالورشة</div>
      <div class="f"><input id="f_phone" type="tel" inputmode="tel" maxlength="40" autocomplete="tel" placeholder="9xxxxxxx"
        style="direction:ltr;text-align:right"></div></div>`}
    ${stars("overall",  "بشكل عام، شلون تقيّم تجربتك في الورشة؟")}
    ${stars("content",  "شلون تقيّم محتوى الورشة ومدى استفادتك منه؟")}
    ${stars("delivery", "شلون تقيّم أسلوب تقديم المستشارتين وتبسيط المعلومات؟")}
    ${open("liked", "شنو أكثر شيء عجبك أو استفدت منه خلال الأيام الثلاثة؟")}
    ${pick("clarity", "بعد الورشة، هل حسّيت إن عندك وضوح أكبر تجاه وضعك وأهدافك المالية؟")}
    ${open("topic", "شنو الموضوع المالي اللي ودك كاش كلينك يتكلم عنه أو يقدم عنه ورشة مستقبلًا؟")}
    ${pick("recommend", "هل ترشّح ورشة كاش كلينك لشخص آخر؟")}
    <div class="q" data-q="ref" id="qRef" hidden><div class="t">هل في شخص تحب ترشّح له برامج أو خدمات كاش كلينك؟ <small>(اختياري)</small></div>
      <div class="f"><label for="f_refName">الاسم</label><input id="f_refName" maxlength="120" autocomplete="off"></div>
      <div class="f"><label for="f_refPhone">رقم الهاتف (اختياري)</label><input id="f_refPhone" type="tel" inputmode="tel" maxlength="40" autocomplete="off"></div></div>
    ${pick("contact", "هل تحب نتواصل معك مستقبلًا بخصوص الورش والخدمات الجديدة؟")}
    ${pick("heard", "شلون عرفت عن كاش كلينك أو عن الورشة؟",
      `<div class="f" id="otherBox" hidden><input id="f_heardOther" maxlength="200" placeholder="اكتب من وين…"></div>`)}
    ${open("ideas", "إذا عندك أي اقتراح أو ملاحظة تساعدنا نخلي تجربتك القادمة أفضل، شاركنا فيها.")}
    <button class="btn" id="go" type="button">أرسل رأيي</button>
    <div class="msg" id="msg" role="alert"></div>
    <p class="priv">إجاباتك تستخدمها كاش كلينك بس لتطوير ورشها وخدماتها.</p>`;
}

function sync(){
  document.querySelectorAll(".star").forEach((b)=>{ b.classList.toggle("on", Number(b.dataset.v) <= (A[b.dataset.k]||0)); });
  document.querySelectorAll(".opt").forEach((b)=>{ b.classList.toggle("on", A[b.dataset.k] === b.dataset.v); });
  /* «إذا نعم» — the referral only follows a yes or a maybe */
  $("#qRef").hidden = !(A.recommend && A.recommend !== "لا");
  $("#otherBox").hidden = A.heard !== "أخرى";
}

function wire(){
  $("#app").addEventListener("click", (e)=>{
    const b = e.target.closest(".star,.opt"); if(!b) return;
    A[b.dataset.k] = b.classList.contains("star") ? Number(b.dataset.v) : b.dataset.v;
    const q = b.closest(".q"); if(q) q.classList.remove("miss");
    sync();
  });
  /* typing into a question marked red clears it, same as tapping an answer */
  $("#app").addEventListener("input", (e)=>{ const q=e.target.closest(".q"); if(q) q.classList.remove("miss"); });
  $("#go").addEventListener("click", send);
}

function fail(t){ const m=$("#msg"); m.textContent=t; m.className="msg err"; }

async function send(){
  const need = ["overall","content","delivery","clarity","recommend","contact","heard"];
  const miss = need.filter((k)=>!A[k]);
  document.querySelectorAll(".q").forEach((q)=>q.classList.toggle("miss", miss.indexOf(q.dataset.q)!==-1));
  if(miss.length){
    fail("باقي أسئلة ما جاوبت عليها، معلّمة بالأحمر.");
    const q=document.querySelector(`.q[data-q="${miss[0]}"]`); if(q) q.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  const v = (id) => ((document.getElementById(id)||{}).value||"").trim();
  /* the QR ties the reply to a buyer by the number they registered with */
  if(!KNOWN && v("f_phone").replace(/\D/g,"").length<8){
    const q=document.querySelector('.q[data-q="phone"]'); if(q){ q.classList.add("miss"); q.scrollIntoView({behavior:"smooth",block:"center"}); }
    fail("اكتب رقمك اللي سجّلت فيه بالورشة كامل."); return;
  }
  const btn=$("#go"); btn.disabled=true; btn.textContent="جارٍ الإرسال…"; $("#msg").className="msg";
  try{
    await submit({ t:T, ...A,
      liked:v("f_liked"), topic:v("f_topic"), ideas:v("f_ideas"),
      refName:v("f_refName"), refPhone:v("f_refPhone"), heardOther:v("f_heardOther"),
      phone:v("f_phone") });
    thanks();
  }catch(err){
    fail((err&&err.message)||"ما قدرنا نرسل ردك، جرّب مرة ثانية.");
    btn.disabled=false; btn.textContent="أرسل رأيي";
  }
}

(async ()=>{
  let first = "";
  if(T){
    try{
      const r = (await who({ t:T })).data || {};
      if(r.done) return thanks();
      if(r.known){ KNOWN = true; first = r.first || ""; }
    }catch(_){ /* an unreachable server still gets the form; submit will say if it fails */ }
  }
  render(first); wire(); sync();
})();
</script>
<script src="../assets/js/hit.js" defer></script>
</body>
</html>
