<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم الفريق | كاش كلينك</title>
<style>
  :root{ --auber:#2F1748; --gold:#D3A146; --teal:#2F8789; --olive:#505632;
         --cream:#FFE7BC; --ink:#2F1748; --muted:#6B6577; --line:#E4E1EA; --bg:#F7F6F9; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
  /* ---- login ---- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px 30px;max-width:400px;width:100%;box-shadow:0 18px 50px rgba(47,23,72,.08)}
  .card h1{font-size:22px;margin:0 0 4px}
  .card p{color:var(--muted);font-size:14px;margin:0 0 22px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .fld input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;background:#fff;direction:ltr;text-align:right}
  .fld input:focus{outline:none;border-color:var(--auber)}
  .btn{width:100%;padding:14px;border:0;border-radius:999px;background:var(--auber);color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer}
  .btn:disabled{opacity:.6;cursor:default}
  .err{background:#FDE5E9;color:#962E37;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;display:none}
  .logo{width:150px;display:block;margin:0 auto 18px}
  /* ---- dashboard ---- */
  #dash{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .top .who{font-size:14px;color:var(--muted)}
  .top .who b{color:var(--ink);display:block;font-size:16px}
  .lo{padding:9px 18px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-family:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
  .sec{margin-bottom:34px}
  .sec h2{font-size:19px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
  .sec h2 span{width:8px;height:20px;border-radius:3px;background:var(--gold)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
  .kpi .n{font-size:28px;font-weight:800;direction:ltr;text-align:right}
  .kpi .l{font-size:13px;color:var(--muted);margin-top:2px}
  .tbl{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--line)}
  th{background:#FAF9FB;font-weight:600;color:var(--muted);font-size:13px}
  tr:last-child td{border-bottom:0}
  td.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
  .badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:14px}
  .muted{color:var(--muted);font-size:13px}
  .flt{display:inline-flex;gap:6px;margin-bottom:12px}
  .flt button{padding:7px 16px;border:1.5px solid var(--line);background:#fff;border-radius:999px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--muted)}
  .flt button.on{background:var(--auber);color:#fff;border-color:var(--auber)}
  .view-btn{padding:6px 14px;border:1.5px solid var(--auber);background:#fff;border-radius:999px;font-family:inherit;font-size:13px;cursor:pointer;color:var(--auber);white-space:nowrap}
  .view-btn:hover{background:var(--auber);color:#fff}
  .report-links{display:flex;flex-wrap:wrap;gap:12px}
  .report-btn{display:inline-flex;align-items:center;gap:8px;background:var(--auber);color:#fff;font-weight:700;font-size:15px;padding:14px 24px;border-radius:14px;text-decoration:none;font-family:inherit}
  .report-btn:hover{filter:brightness(1.12)}
  /* modal */
  .ovl{position:fixed;inset:0;background:rgba(47,23,72,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:50}
  .ovl.on{display:flex}
  .modal{background:#fff;border-radius:22px;max-width:560px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.25);overflow:hidden}
  .m-x{position:absolute;top:20px;left:20px;width:38px;height:38px;border-radius:50%;border:0;background:#fff;color:var(--auber);font-size:22px;cursor:pointer;line-height:1}
  .m-hero{background:var(--auber);color:#fff;text-align:center;padding:34px 26px 28px;position:relative}
  .m-hero .who{font-size:15px;opacity:.85;margin-bottom:14px}
  .m-hero .big{font-size:54px;font-weight:800;direction:ltr;line-height:1}
  .m-hero .bnd{display:inline-block;margin-top:12px;padding:6px 20px;border-radius:999px;font-size:14px;font-weight:700;color:#fff}
  .m-body{padding:26px}
  .m-diag{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;font-size:14.5px;line-height:1.9;color:var(--muted);margin-bottom:22px}
  .m-axis{margin-bottom:16px}
  .m-axis .arow{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}
  .m-axis .arow b{font-weight:600;color:var(--ink)}
  .m-axis .arow .p{direction:ltr;font-weight:700}
  .track{height:9px;background:#EFEDF3;border-radius:999px;overflow:hidden}
  .track i{display:block;height:100%;border-radius:999px}
  .m-meta{font-size:12.5px;color:var(--muted);margin-top:18px;text-align:center;direction:ltr}
  .m-intake{margin-bottom:22px;display:flex;flex-direction:column;gap:10px}
  .m-intake .row{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .m-intake .k{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
  .m-intake .v{display:block;font-size:14px;line-height:1.7;color:var(--ink)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <img class="logo" src="https://cashclinic.net/brand/logo/logo-primary.png" alt="Cash Clinic"
         onerror="this.style.display='none'">
    <h1>لوحة تحكم الفريق</h1>
    <p>سجّل دخولك بحساب كاش كلينك</p>
    <div class="err" id="loginErr"></div>
    <div class="fld"><label>البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="username" placeholder="name@cashclinic.net"></div>
    <div class="fld"><label>كلمة المرور</label>
      <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn" id="loginBtn">دخول</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dash"><div class="wrap">
  <div class="top">
    <div class="who">مرحباً<b id="uName">—</b><span id="uRole" class="muted"></span></div>
    <button class="lo" id="logoutBtn">تسجيل الخروج</button>
  </div>

  <div class="sec" id="reportsSec" hidden>
    <h2><span></span> أنظمة التقارير</h2>
    <div class="report-links">
      <a class="report-btn" id="rptRiyada" href="https://cashclinickw.github.io/cash-riyada-reports/dashboard.html" target="_blank" rel="noopener" hidden>سستم تقارير كاش ريادة ←</a>
      <a class="report-btn" id="rptNas" href="https://cashclinickw.github.io/cashclinicslides/dashboard.html" target="_blank" rel="noopener" hidden>سستم تقارير اللجنة الخيرية ←</a>
    </div>
  </div>

  <div class="sec">
    <h2><span></span> المبيعات</h2>
    <div class="flt" id="salesFlt">
      <button data-f="all" class="on">الكل</button>
      <button data-f="month">هذا الشهر</button>
    </div>
    <div class="kpis" id="salesKpis"></div>
    <div class="tbl" id="salesTbl"></div>
  </div>

  <div class="sec">
    <h2><span></span> نتائج الاختبارات</h2>
    <div class="kpis" id="quizKpis"></div>
    <div class="tbl" id="quizTbl"></div>
  </div>

  <div class="sec" id="coursesSec" hidden>
    <h2><span></span> تسجيلات الدورات</h2>
    <div class="kpis" id="courseKpis"></div>
    <div class="tbl" id="courseTbl"></div>
  </div>

  <div class="sec" id="eventsSec" hidden>
    <h2><span></span> تسجيلات اللقاء</h2>
    <div class="kpis" id="eventKpis"></div>
    <div class="tbl" id="eventTbl"></div>
  </div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFunctions, httpsCallable }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

const CONFIG={firebase:{apiKey:"AIzaSyCfD6ocmBsGVJms69TDbKt1PkcdSsGc3so",authDomain:"cash-quiz-906a6.firebaseapp.com",
  projectId:"cash-quiz-906a6",storageBucket:"cash-quiz-906a6.firebasestorage.app",
  messagingSenderId:"547780714224",appId:"1:547780714224:web:0e97107045a803623dec35"},
  functionsRegion:"us-central1"};

const app=initializeApp(CONFIG.firebase);
const auth=getAuth(app);
const getDashboard=httpsCallable(getFunctions(app,CONFIG.functionsRegion),"getDashboard");

const $=s=>document.querySelector(s);
const ROLE_AR={all:"صلاحية كاملة",personal:"كاش ناس",riyada:"كاش ريادة"};
let DATA=null, SFILTER="all";

const fmt=n=>Number(n||0).toLocaleString("en-US");
const money=n=>fmt(n)+" د.ك";
const dt=ms=>{ if(!ms) return "—"; const d=new Date(ms);
  return d.toLocaleDateString("en-GB")+" · "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); };
const bandColor=b=>{ if(/ممتاز|جيد/.test(b))return"#2F8789"; if(/متوسط/.test(b))return"#D3A146"; return"#962E37"; };
const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- login ---------- */
$("#loginBtn").addEventListener("click", doLogin);
$("#pass").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
async function doLogin(){
  const err=$("#loginErr"); err.style.display="none";
  const email=$("#email").value.trim(), pass=$("#pass").value;
  if(!email||!pass){ return showErr("اكتب البريد وكلمة المرور"); }
  $("#loginBtn").disabled=true; $("#loginBtn").textContent="جارٍ الدخول…";
  try{ await signInWithEmailAndPassword(auth, email, pass); }
  catch(e){ showErr(authMsg(e)); }
  finally{ $("#loginBtn").disabled=false; $("#loginBtn").textContent="دخول"; }
}
function showErr(m){ const e=$("#loginErr"); e.textContent=m; e.style.display="block"; }
function authMsg(e){
  const c=(e&&e.code)||"";
  if(c.includes("invalid-cred")||c.includes("wrong-password")||c.includes("user-not-found")) return "البريد أو كلمة المرور غير صحيحة";
  if(c.includes("too-many")) return "محاولات كثيرة، جرّب بعد شوي";
  if(c.includes("invalid-email")) return "صيغة البريد غير صحيحة";
  return "تعذّر الدخول، حاول مرة ثانية";
}
$("#logoutBtn").addEventListener("click", ()=>signOut(auth));

/* ---------- auth state ---------- */
onAuthStateChanged(auth, async (user)=>{
  if(!user){ $("#dash").style.display="none"; $("#login").style.display="flex"; DATA=null; return; }
  $("#login").style.display="none"; $("#dash").style.display="block";
  $("#uName").textContent=user.email;
  try{
    const r=await getDashboard(); DATA=r.data;
    $("#uRole").textContent=ROLE_AR[DATA.role]||"";
    var _rl=DATA.role;
    if(_rl==="riyada"||_rl==="all") $("#rptRiyada").hidden=false;
    if(_rl==="personal"||_rl==="all") $("#rptNas").hidden=false;
    if(!$("#rptRiyada").hidden||!$("#rptNas").hidden) $("#reportsSec").hidden=false;
    render();
  }catch(e){
    const msg=(e&&e.message)||"تعذّر تحميل البيانات";
    $("#salesTbl").innerHTML=`<div class="empty">${esc(msg)}</div>`;
    $("#quizTbl").innerHTML="";
    if((e&&e.code)==="functions/permission-denied"){ setTimeout(()=>signOut(auth),2500); }
  }
});

/* ---------- filters ---------- */
document.querySelectorAll("#salesFlt button").forEach(b=>b.addEventListener("click",()=>{
  SFILTER=b.dataset.f;
  document.querySelectorAll("#salesFlt button").forEach(x=>x.classList.toggle("on",x===b));
  renderSales();
}));
function inThisMonth(ms){ if(!ms)return false; const d=new Date(ms),n=new Date();
  return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth(); }

/* ---------- render ---------- */
function render(){ renderSales(); renderQuiz(); renderCourses(); renderEvents(); }

function renderSales(){
  const S=DATA.sales;
  let orders=S.orders.slice();
  if(SFILTER==="month") orders=orders.filter(o=>inThisMonth(o.when));
  const rev=orders.reduce((a,o)=>a+Number(o.amount||0),0);
  $("#salesKpis").innerHTML=`
    <div class="kpi"><div class="n">${money(rev)}</div><div class="l">إجمالي الإيرادات</div></div>
    <div class="kpi"><div class="n">${fmt(orders.length)}</div><div class="l">عدد الطلبات</div></div>`+
    S.byProduct.map(p=>`<div class="kpi"><div class="n">${money(p.revenue)}</div><div class="l">${esc(p.product)} · ${fmt(p.count)} طلب</div></div>`).join("");
  if(!orders.length){ $("#salesTbl").innerHTML=`<div class="empty">لا توجد طلبات بعد</div>`; return; }
  $("#salesTbl").innerHTML=`<table><thead><tr>
      <th>التاريخ</th><th>الاسم</th><th>الكتاب</th><th>المبلغ</th><th>الجوال</th></tr></thead><tbody>`+
    orders.map(o=>`<tr>
      <td class="num">${dt(o.when)}</td><td>${esc(o.name)||"—"}</td>
      <td>${esc(o.product)}</td><td class="num">${money(o.amount)}</td>
      <td class="num">${esc(o.phone)||"—"}</td></tr>`).join("")+`</tbody></table>`;
}

function renderCourses(){
  const C = DATA.courses;
  const sec = $("#coursesSec");
  if(!C || !C.regs || !C.regs.length){ if(sec) sec.hidden=true; return; }
  sec.hidden=false;
  const t=C.totals||{};
  const prog=(C.byProgram&&C.byProgram[0])||null;
  const seatsLeft = prog && prog.seatsOnsite!=null ? Math.max(0, prog.seatsOnsite - (prog.onsite||0)) : null;
  $("#courseKpis").innerHTML=`
    <div class="kpi"><div class="n">${fmt(t.count||0)}</div><div class="l">إجمالي التسجيلات</div></div>
    <div class="kpi"><div class="n">${money(t.revenue||0)}</div><div class="l">إجمالي الإيرادات</div></div>
    <div class="kpi"><div class="n">${fmt(t.onsite||0)}</div><div class="l">حضوري${seatsLeft!=null?` · باقي ${fmt(seatsLeft)} مقعد`:""}</div></div>
    <div class="kpi"><div class="n">${fmt(t.online||0)}</div><div class="l">أونلاين</div></div>`;
  $("#courseTbl").innerHTML=`<table><thead><tr>
      <th>التاريخ</th><th>الاسم</th><th>الدورة</th><th>الحضور</th><th>المبلغ</th><th>الجوال</th><th>البريد</th></tr></thead><tbody>`+
    C.regs.map(r=>`<tr>
      <td class="num">${dt(r.when)}</td><td>${esc(r.name)||"—"}</td>
      <td>${esc(r.program)}</td>
      <td><span class="badge" style="background:${r.mode==="onsite"?"#505632":"#2F8789"}">${r.mode==="onsite"?"حضوري":"أونلاين"}</span></td>
      <td class="num">${money(r.amount)}</td>
      <td class="num">${esc(r.phone)||"—"}</td><td class="num">${esc(r.email)||"—"}</td></tr>`).join("")+`</tbody></table>`;
}

function renderEvents(){
  const E = DATA.events;
  const sec = $("#eventsSec");
  if(!E || !E.regs || !E.regs.length){ if(sec) sec.hidden=true; return; }
  sec.hidden=false;
  const t=E.totals||{};
  $("#eventKpis").innerHTML=`
    <div class="kpi"><div class="n">${fmt(t.count||0)}</div><div class="l">إجمالي المسجّلين</div></div>`;
  $("#eventTbl").innerHTML=`<table><thead><tr>
      <th>التاريخ</th><th>الاسم</th><th>هل هو؟</th><th>الهدف من التسجيل</th><th>الجوال</th><th>البريد</th></tr></thead><tbody>`+
    E.regs.map(r=>`<tr>
      <td class="num">${dt(r.when)}</td><td>${esc(r.name)||"—"}</td>
      <td>${esc(r.audience)||"—"}</td>
      <td style="white-space:normal;max-width:260px">${esc(r.goal)||"—"}</td>
      <td class="num">${esc(r.phone)||"—"}</td><td class="num">${esc(r.email)||"—"}</td></tr>`).join("")+`</tbody></table>`;
}

const RESULT_META = {"abundance-quiz": {"order": ["mindset", "discipline", "resilience", "growth"], "dims": {"mindset": "العقلية المالية", "discipline": "الانضباط السلوكي", "resilience": "المرونة المالية", "growth": "الاستعداد للنمو"}, "B1": 50, "B2": 75, "bands": ["منخفض", "متوسط", "ممتاز"], "diag": {"high": "تشخيصك يبين أنك بنيت أساس قوي، عندك وعي مالي جيد وتتابع مصروفاتك وتتصرف بحكمة في أغلب المواقف. الفرصة الآن أنك تطور نظام موحد يربط بين أهدافك واحتياجاتك الفعلية، وتنقل نفسك من الاستقرار للوفرة. كل خطوة صغيرة تسويها الآن بتختصر عليك سنوات من التخبط لاحقا.", "mid": "تشخيصك يبين أنك بنيت أساس لا بأس فيه، عندك وعي مالي في جوانب وتحتاج تشتغل على جوانب ثانية. عندك نقاط قوة واضحة ونقاط تحتاج تطوير. معالجة أهم جانبين أو ثلاثة بتنقلك نقلة كبيرة نحو الوفرة.", "low": "تشخيصك يبين أنك في مرحلة تحتاج تبني فيها أساس مالي أوضح. لا تخاف من الأرقام، معرفتك بوضعك الحين هي أول وأهم خطوة. ركز على جانب واحد في كل مرة وابدأ من وعيك بمصاريفك."}}, "riyada-quiz": {"order": ["cash", "pricing", "sales", "product", "ops", "strategy"], "dims": {"cash": "الكاش والمالية", "pricing": "التسعير", "sales": "المبيعات والتسويق", "product": "المنتج أو الخدمة", "ops": "العمليات والتشغيل", "strategy": "الاستراتيجية والنمو"}, "B1": 40, "B2": 70, "bands": ["ضعيف", "متوسط", "جيد"], "diag": {"low": "تشخيص مشروعك يبين إنه في مرحلة تحتاج تدخل سريع: في محاور أساسية فيها تسريبات تأثر على استقرار كاش مشروعك. لا تخاف من الأرقام، الخبر الزين إن معرفتك بوضعك الحين هي أول وأهم خطوة. ركز على محور واحد في كل مرة وابدأ من الكاش.", "mid": "تشخيص مشروعك يبين إنك بنيت أساس لا بأس فيه، بس في محاور تحتاج تشتغل عليها عشان تثبت وتكبر. عندك نقاط قوة واضحة ونقاط فيها تسريبات تأثر على كاش مشروعك. معالجة أهم محورين أو ثلاثة بتنقلك نقلة كبيرة.", "high": "تشخيص مشروعك يبين إنه في وضع صحي وقوي: عندك أساس متين في أغلب المحاور، وتشتغل بأرقام وأنظمة مو بس بالإحساس. الفرصة الحين إنك تنتقل من الاستقرار للنمو المتسارع، وتبني على نقاط قوتك عشان توسع بثقة."}}};
function bandFor(src, ov){ const m=RESULT_META[src]; if(!m) return ""; return ov>=m.B2?m.bands[2] : ov>=m.B1?m.bands[1] : m.bands[0]; }
function diagFor(src, ov){ const m=RESULT_META[src]; if(!m) return ""; const lvl = ov>=m.B2?"high" : ov>=m.B1?"mid" : "low"; return (m.diag&&m.diag[lvl])||""; }

function openResult(idx){
  const l=DATA.quiz.leads[idx]; if(!l) return;
  const src=l.source, m=RESULT_META[src];
  const sc=l.scores||{}; const ov = (sc.overall!=null)?sc.overall : (l.score!=null?l.score:0);
  const bandTxt = l.band || bandFor(src, ov);
  const diag = l.diagnosis || diagFor(src, ov);
  const col = bandColor(bandTxt||"");
  let axes="";
  if(m){ axes = m.order.map(k=>{
    const v = sc[k]!=null ? sc[k] : 0;
    return `<div class="m-axis">
      <div class="arow"><b>${esc(m.dims[k]||k)}</b><span class="p" style="color:${bandColor(bandFor(src,v))}">${v}%</span></div>
      <div class="track"><i style="width:${v}%;background:${bandColor(bandFor(src,v))}"></i></div>
    </div>`; }).join("");
  }
  document.getElementById("modalBody").innerHTML=`
    <button class="m-x" onclick="closeResult()">×</button>
    <div class="m-hero">
      <div class="who">${esc(l.name||"—")} · ${esc(l.quizTitle||src)}</div>
      <div class="big">${ov}%</div>
      ${bandTxt?`<div class="bnd" style="background:${col}">${esc(bandTxt)}</div>`:""}
    </div>
    <div class="m-body">
      ${diag?`<div class="m-diag">${esc(diag)}</div>`:""}
      ${axes}
      ${(l.priority||l.notes)?`<div class="m-intake">${l.priority?`<div class="row"><span class="k">الهدف الأهم من العلاج المالي</span><span class="v">${esc(l.priority)}</span></div>`:""}${l.notes?`<div class="row"><span class="k">ملاحظات العميل</span><span class="v">${esc(l.notes)}</span></div>`:""}</div>`:""}
      <div class="m-meta">${esc(l.phone||"")} ${l.email?" · "+esc(l.email):""}</div>
    </div>`;
  document.getElementById("ovl").classList.add("on");
}
function closeResult(){ document.getElementById("ovl").classList.remove("on"); }
window.openResult=openResult; window.closeResult=closeResult;

function renderQuiz(){
  const Q=DATA.quiz;
  $("#quizKpis").innerHTML=`
    <div class="kpi"><div class="n">${fmt(Q.totals.count)}</div><div class="l">عدد من أنهوا الاختبار</div></div>`+
    Q.byQuiz.map(q=>`<div class="kpi"><div class="n">${fmt(q.count)}</div><div class="l">${esc(q.title||q.source)}</div></div>`).join("");
  if(!Q.leads.length){ $("#quizTbl").innerHTML=`<div class="empty">لا توجد نتائج بعد</div>`; return; }
  const multi=DATA.scope.length>1;
  $("#quizTbl").innerHTML=`<table><thead><tr>
      <th>التاريخ</th><th>الاسم</th>${multi?"<th>الاختبار</th>":""}<th>النتيجة</th><th>التقييم</th><th>الجوال</th><th>البريد</th><th></th></tr></thead><tbody>`+
    Q.leads.map((l,i)=>`<tr>
      <td class="num">${dt(l.when)}</td><td>${esc(l.name)||"—"}</td>
      ${multi?`<td>${esc(l.quizTitle||l.source)}</td>`:""}
      <td class="num">${l.score!=null?l.score+"%":"—"}</td>
      <td>${l.band?`<span class="badge" style="background:${bandColor(l.band)}">${esc(l.band)}</span>`:"—"}</td>
      <td class="num">${esc(l.phone)||"—"}</td><td class="num">${esc(l.email)||"—"}</td>
      <td><button class="view-btn" onclick="openResult(${i})">عرض النتيجة</button></td></tr>`).join("")+`</tbody></table>`;
}
</script>
<div class="ovl" id="ovl" onclick="if(event.target===this)closeResult()"><div class="modal" id="modalBody"></div></div>
</body>
</html>
