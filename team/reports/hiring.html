<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>نظام المقابلة المهيكلة · كاش كلينك</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--auber:#2F1748;--auber2:#614588;--gold:#D3A146;--cream:#FFE7BC;--teal:#2F8789;
        --burg:#962E37;--olive:#505632;--ink:#2F1749;--muted:#6B6577;--line:#E7E3EE;--bg:#F7F5FA}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.75}
  .wrap{max-width:1120px;margin:0 auto;padding:0 18px 90px}
  .top{background:var(--auber);color:#fff;padding:16px 0;margin-bottom:22px}
  .top .wrap{padding-bottom:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .top a{color:var(--cream);text-decoration:none;font-weight:600;font-size:13.5px}
  .top b{font-size:17px;font-weight:700}
  .top .sp{flex:1}
  h2{font-size:19px;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
  h2>span:first-child{width:8px;height:20px;border-radius:3px;background:var(--gold);flex:0 0 auto}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
  .roles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .roles button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 18px;
    font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
  .roles button.on{background:var(--auber);border-color:var(--auber);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .f label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;
    padding:9px 12px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
  .f textarea{min-height:70px;resize:vertical}
  .f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--auber2)}
  .comp{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
  .comph{background:#FAF8FC;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;
    align-items:flex-start;gap:12px;flex-wrap:wrap}
  .comph b{font-size:16px;color:var(--auber)}
  .comph .w{background:var(--auber);color:#fff;border-radius:999px;padding:2px 11px;font-size:12px;font-weight:700}
  .comph .d{flex:1 1 100%;font-size:13px;color:var(--muted);margin-top:2px}
  .comph .cs{margin-inline-start:auto;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
  .q{border-top:1px solid var(--line);padding:16px 18px}
  .q:first-of-type{border-top:0}
  .qh{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
  .qn{font-family:ui-monospace,monospace;font-size:19px;color:var(--auber2);font-weight:700;min-width:30px}
  .qt{flex:1;font-weight:600;font-size:15.5px}
  .tag{border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .tag.red{background:var(--burg);color:#fff}
  .tag.hist{background:var(--olive);color:#fff}
  .tag.live{background:var(--teal);color:#fff}
  .row{display:flex;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}
  .row .k{min-width:96px;font-weight:700;color:var(--muted);font-size:12.5px;padding-top:2px}
  .row .v{flex:1}
  .row.a5 .k{color:var(--teal)} .row.a3 .k{color:var(--gold)} .row.a1 .k{color:var(--burg)}
  .row.ex{background:#F4F8F8;margin:6px -18px;padding:9px 18px;border-top:1px solid #DCEAEA}
  .row.ex .k{color:var(--teal)}
  .row.ex .v{font-weight:600}
  .row.rf{background:#FDF3F4;margin:6px -18px 0;padding:8px 18px;border-top:1px solid #F0D8DB}
  .row.rf .k,.row.rf .v{color:var(--burg)}
  .score{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .score label{border:2px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer;
    font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px}
  .score input{accent-color:var(--auber);margin:0}
  .score label.on5{border-color:var(--teal);background:#EAF4F4}
  .score label.on3{border-color:var(--gold);background:#FDF6E8}
  .score label.on1{border-color:var(--burg);background:#FBEEEF}
  .score .flag{margin-inline-start:auto;font-size:13px;font-weight:700;color:var(--burg);
    display:flex;align-items:center;gap:6px;cursor:pointer}
  .note{margin-top:9px}
  .bar{position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    box-shadow:0 -6px 22px rgba(47,23,72,.09);padding:11px 18px;z-index:40}
  .bar .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .tot{font-size:15px;font-weight:700}
  .tot b{font-size:24px}
  .verdict{border-radius:999px;padding:4px 15px;font-size:13.5px;font-weight:700;color:#fff}
  .verdict.pass{background:#128C4A} .verdict.fail{background:var(--burg)} .verdict.part{background:var(--muted)}
  .btn{border:0;border-radius:10px;padding:10px 20px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .btn.p{background:var(--auber);color:#fff} .btn.g{background:#fff;color:var(--auber);border:2px solid var(--auber)}
  .btn:disabled{opacity:.55;cursor:default}
  .msg{font-size:13.5px;font-weight:700}
  .msg.ok{color:#128C4A} .msg.bad{color:var(--burg)}
  .ovl{position:fixed;inset:0;background:rgba(47,23,72,.5);display:none;align-items:center;
    justify-content:center;padding:20px;z-index:60}
  .ovl.on{display:flex}
  .modal{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:82vh;overflow:auto;padding:20px 22px}
  .lrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
  .lrow:first-of-type{border-top:0}
  .lrow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow .s{font-weight:700} .lrow .muted{color:var(--muted);font-size:12.5px}
  .redlist{background:#FDF3F4;border:1px solid #F0D8DB;border-radius:12px;padding:11px 15px;
    color:var(--burg);font-size:13.5px;font-weight:600;margin-bottom:14px}
  @media print{
    .top,.bar,.roles,.noprint{display:none!important}
    body{background:#fff} .wrap{padding:0}
    .comp,.card{break-inside:avoid;box-shadow:none}
    .q{break-inside:avoid}
  }
</style></head><body>

<div class="top"><div class="wrap">
  <b>نظام المقابلة المهيكلة</b>
  <span style="opacity:.75;font-size:13px" id="hSub">كاش كلينك · وثيقة داخلية</span>
  <span class="sp"></span>
  <a href="../dashboard.html">← رجوع للوحة التحكم</a>
</div></div>

<div class="wrap">
  <div class="roles noprint" id="roleTabs"></div>
  <div class="card">
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px">
      <b style="font-size:18px" id="rName">—</b>
      <span style="color:var(--muted);font-size:13.5px" id="rSub"></span>
    </div>
    <div style="color:var(--muted);font-size:13px" id="rNums"></div>
  </div>

  <h2><span></span> بيانات المرشح</h2>
  <div class="card">
    <div class="grid">
      <div class="f noprint"><label>من طلبات التوظيف <span style="font-weight:400">(اختياري)</span></label>
        <select id="cvPick"><option value="">— اكتب البيانات يدويا —</option></select></div>
      <div class="f"><label>الاسم</label><input id="fName" type="text"></div>
      <div class="f"><label>الإيميل</label><input id="fEmail" type="text" style="direction:ltr;text-align:right"></div>
      <div class="f"><label>الجوال</label><input id="fPhone" type="text" style="direction:ltr;text-align:right"></div>
      <div class="f"><label>التاريخ والوقت</label><input id="fWhen" type="datetime-local"></div>
      <div class="f"><label>المقابل الأول</label><input id="fI1" type="text"></div>
      <div class="f"><label>المقابل الثاني</label><input id="fI2" type="text"></div>
      <div class="f"><label>مصدر التقديم</label><input id="fSrc" type="text"></div>
      <div class="f"><label>الراتب المتوقع</label><input id="fPay" type="text"></div>
      <div class="f"><label>مدة الإشعار · أقرب مباشرة</label><input id="fNotice" type="text"></div>
      <div class="f"><label>المرحلة الحالية</label>
        <select id="fStage">
          <option>فرز الملف</option><option>مكالمة فرز</option>
          <option selected>المقابلة المهيكلة</option><option>اختبار عملي</option><option>فحص المراجع</option>
        </select></div>
    </div>
  </div>

  <div id="redBox"></div>
  <h2><span></span> الكفايات والأسئلة</h2>
  <div id="comps"></div>

  <h2><span></span> الخلاصة والقرار</h2>
  <div class="card">
    <div class="grid">
      <div class="f"><label>القرار</label>
        <select id="fDecision">
          <option value="">— لم يحدد —</option>
          <option>يمر للاختبار العملي</option><option>تحت الدراسة</option>
          <option>مرفوض</option><option>مرفوض · علم أحمر</option>
        </select></div>
    </div>
    <div class="f" style="margin-top:12px"><label>ملاحظات ختامية · اقتباسات حرفية</label>
      <textarea id="fFinal"></textarea></div>
  </div>
</div>

<div class="bar noprint"><div class="in">
  <span class="tot">الدرجة <b id="tScore">—</b> <span style="color:var(--muted)">من 85</span></span>
  <span class="verdict part" id="tVerdict">لم يكتمل</span>
  <span style="color:var(--muted);font-size:13px" id="tDone">0 من 22</span>
  <span class="sp" style="flex:1"></span>
  <span class="msg" id="msg"></span>
  <button class="btn g" id="bOpen">الملفات المحفوظة</button>
  <button class="btn g" id="bPrint">طباعة</button>
  <button class="btn g" id="bNew">جديد</button>
  <button class="btn p" id="bSave">حفظ</button>
</div></div>

<div class="ovl" id="listOvl"><div class="modal">
  <div style="display:flex;align-items:center;margin-bottom:12px">
    <b style="font-size:17px;flex:1">المقابلات المحفوظة</b>
    <button class="btn g" id="listX">إغلاق</button></div>
  <div id="listBody"><div style="color:var(--muted)">لحظة…</div></div>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script>
const ROLES = {"invest":{"name":"كاش انفيست","role":"أخصائي دعم الخطة الاستثمارية","sub":"عن بعد · خلف الكواليس تحت إشراف سارة الهندي","minutes":75,"max":85,"gate":68,"comps":[{"t":"الأمانة المهنية والالتزام","w":3,"def":"يفرق بين التثقيف والتوصية، ويثبت على الحد تحت الإلحاح، ويعترف بحدود معرفته بلا حرج","qs":[{"n":1,"flags":["علم أحمر محتمل"],"q":"عميل كتب لك: »أشتري ذهب الحين ولا أنتظر؟« .. اكتب لي حرفيا الرد اللي بترسله.","extra":"","follow":"»رجع وقال: أدري إنك ما تنصح، بس بيني وبينك شرأيك؟« ← ثم إن ثبت: »ولح مرة ثالثة وقال رأيك أنت أهم من أي أحد.«","a5":"يثبت على الحد في المحاولات الثلاث، ويعيد التأطير إلى الهدف والأفق الزمني ونسبة الأصل من المحفظة، ويحول لسارة بصياغة مهذبة جاهزة، ويوثق السؤال للمتابعة.","a3":"يرفض في الأولى ثم يلين تحت الإلحاح إلى رأي غير مباشر )»أنا شخصيا أميل إلى..«(.","a1":"يعطي قرارا من أول مرة، أو يعطيه بصيغة »بيني وبينك« ويعتبرها استثناء مقبولا.","red":"أي إجابة تحمل قرارا بالشراء أو الانتظار، ولو بصيغة »لو أنا مكانك« .. ينهى الترشيح."},{"n":2,"flags":["علم أحمر محتمل"],"q":"شنو رأيك بالسوق حاليا؟ ووين تشوفه بعد ستة أشهر؟","extra":"","follow":"»طيب لو أجبرتك تعطيني رقما واحدا؟« ← الإجابة الثانية هي الاختبار الحقيقي لا الأولى.","a5":"يتكلم بسيناريوهات ومحركات، ويرفض بأدب إعطاء رقم حتى بعد الضغط، ويشرح لماذا التنبؤ نفسه ممارسة مضرة مهنيا.","a3":"يبدأ باحتمالات ثم يعطي رقما واتجاها حين يضغط عليه.","a1":"يتنبأ بثقة من الإجابة الأولى، بأرقام أو تواريخ أو »أ كيد بيصعد«.","red":"توقع واثق باتجاه السوق أمام صاحبة العمل .. سيقوله أمام العميل من باب أولى."},{"n":3,"flags":[],"q":"عطني موقفا ضغط فيه أحد عليك عشان تعطي معلومة أو رأيا ما كنت مرتاحا له .. شنو صار بالضبط؟","extra":"سؤال تاريخي","follow":"»منو كان الشخص .. عميل ولا مديرك؟« · »شنو الجملة اللي قلتها له حرفيا؟« · »وشنو كلفك الموقف؟«","a5":"موقف محدد قال فيه »لا« لجهة أعلى منه، يذكر الجملة الحرفية، ويعترف بكلفة تحملها ولم يندم عليها.","a3":"موقف حقيقي لكنه تعامل معه بالتأجيل أو التهرب أو تمريره لغيره.","a1":"لا يملك أي موقف رغم سنوات خبرته، أو رخ وبرر الرضوخ بمنطق المصلحة.","red":""}]},{"t":"خلف الكواليس وتقبل الإشراف","w":3,"def":"ينتج بلا ظهور، ويستقبل التعديل من مرجع أعلى بمهنية، ولا يربط قيمته بالاعتراف العلني","qs":[{"n":4,"flags":[],"q":"الدور خلف الكواليس .. المخرجات تطلع باسم العيادة وسارة، مو باسمك. شنو شعورك الصادق؟","extra":"علم أحمر محتمل","follow":"»وشلون بتوصفه لزملائك بالمجال أو لأهلك؟« ← هذا هو السؤال الكاشف لا الأول · »وبعد سنتين إذا ما ظهر اسمك ولا مرة، شنو موقفك؟« · »عندك حساب أو منصة استثمارية باسمك؟ وشنو مصيرها لو انضممت لنا؟«","a5":"مرتاح ويعطي تجربة سابقة مماثلة، ويجيب سؤال الزملاء والأهل بلا تردد، ويربط قيمته بالأثر والنتيجة، ويعرض تنظيم أي نشاط شخصي بما لا يتعارض.","a3":"يوافق منطقيا لكنه يتردد عند سؤال الزملاء والأهل، أو يسأل عن ذكر داخلي لاسمه أمام الفريق.","a1":"يفاوض على الظهور، أو يشترط ذكر اسمه، أو يوافق بلسانه وملامحه تقول غير ذلك.","red":"يملك منصة استثمارية شخصية نشطة ويرى الوظيفة رافدا لها .. تعارض مصالح مباشر."},{"n":5,"flags":[],"q":"عطني موقفا حقيقيا عدل فيه شغلك بالكامل وأنت مو مقتنع .. شنو سويت بالضبط؟ ثم: شنو حسيت؟","extra":"سؤال تاريخي","follow":"»عطني الجملة اللي طرحت فيها اعتراضك حرفيا« ← طلب الجملة يكسر الادعاء · »ومتى طرحتها .. وقت التسليم ولا بعده؟« · »وشنو كانت النتيجة؟«","a5":"نفذ ثم فتح النقاش بقناة ووقت مناسبين، يعطي الجملة الحرفية، ويميز بوضوح بين خلاف الذوق وخلاف المعيار المهني.","a3":"نفذ صامتا ولم يناقش أبدا، أو ناقش في وقت غير مناسب فأربك التسليم.","a1":"جادل أثناء التسليم، أو نفذ متضايقا وما زال يحمل الموقف إلى اليوم، أو ينكر أن الموقف أزعجه أصلا.","red":""},{"n":6,"flags":[],"q":"شنو آخر ملاحظة قاسية استلمتها بالشغل؟ منو قالها، ووين كنت وقتها، وشنو سويت بعدها بأسبوع؟","extra":"سؤال تاريخي","follow":"»وشنو كان أول رد فعل لك بالدقيقة الأولى؟« · »وهل تغيرت علاقتك بالشخص بعدها؟«","a5":"تفاصيل غنية )شخص، مكان، صياغة(، ويصف تغييرا سلوكيا محددا نفذ خلال أيام، وعلاقته بالشخص بقيت أو تحسنت.","a3":"يتذكر الملاحظة بوضوح لكنه لا يذكر تغييرا ملموسا بعدها.","a1":"»ما استلمت ملاحظة قاسية«، أو يحول الرواية إلى قصة تثبت أنه كان على حق والملاحظة ظالمة.","red":""}]},{"t":"الانضباط الذاتي عن بعد","w":2,"def":"ينجز بلا رقابة، وله إيقاع يومي ثابت، ويحول أخطاءه إلى أنظمة","qs":[{"n":7,"flags":["سؤال تاريخي"],"q":"وصف لي يوم الثلاثاء اللي فات بالتفصيل .. من أول ما صحيت إلى ما نمت.","extra":"","follow":"»وشنو صار الساعة 3 بالضبط؟« · »وكيف عرفت إن يوم الشغل خلص؟« ← من لا يملك إشارة إغلاق لليوم لا يملك حدودا، ويحترق خلال أشهر.","a5":"تفاصيل وأوقات تجري بسلاسة، وفيها إيقاع متكرر: بداية معرفة، فواصل، وإشارة إغلاق واضحة لليوم.","a3":"يستذكر اليوم لكن بلا إيقاع ثابت .. يومه يتشكل بحسب ما يرد عليه.","a1":"لا يقدر على استذكار يوم واحد محدد، أو يعمم بصيغة »عادة أسوي..« ولا يتماسك تحت المتابعة.","red":""},{"n":8,"flags":["سؤال تاريخي"],"q":"شنو آخر شي أنجزته وما كان فيه أحد يراقبك ولا موعد تسليم يلاحقك؟ وكم صار له؟","extra":"","follow":"»وكم استغرق منك؟« · »وشنو اللي خلاك تكمله مع إن ما أحد كان بيسأل عنه؟«","a5":"التزام شخصي مستمر وحديث )محفظة يتابعها بانتظام، دورة أ كملها، محتوى ينشره بإيقاع(، ويشرح دافعه الداخلي بوضوح.","a3":"مثال حقيقي لكنه قديم أو انقطع بعد فترة قصيرة.","a1":"كل إنجازاته جاءت بضغط خارجي أو موعد تسليم .. وهذا أخطر مؤشر لدور بلا رقابة يومية.","red":""},{"n":9,"flags":["سؤال تاريخي"],"q":"شنو أ كبر تأخير أو نسيان صار منك بالشغل؟ وشنو النظام اللي بنيته بعده عشان ما يتكرر؟","extra":"","follow":"»وريني النظام هذا الحين إذا موجود على جهازك« ← أقوى تحقق بالمقابلة كلها · »وكم مرة أمسكت عليك شيئا آخر ثلاثة أشهر؟«","a5":"يعترف بلا مقدمات، ويصف نظاما ملموسا بناه بعدها، ويقدر على عرضه فورا على شاشته.","a3":"يعترف ويصف نية للتحسن، لكن بلا نظام قائم يمكن عرضه.","a1":"»ما نسيت شي أبدا« .. إما مبالغة أو لم يحمل مسؤولية حقيقية. أو اعتراف بلا أي أثر بعده.","red":""}]},{"t":"الدقة وضبط الجودة","w":2,"def":"يملك عملية تحقق موثقة قبل التسليم، ويصحح خطأه ولو لم يكتشف","qs":[{"n":10,"flags":["علم أحمر محتمل"],"q":"سلمت تقريرا، وبعد يومين اكتشفت فيه رقما غلط وما أحد لاحظه .. شنو تسوي؟","extra":"","follow":"»ولو الغلط يغير الخلاصة اللي بنى عليها العميل قراره؟« · »ولو اكتشفته قبل يوم من عرض مهم لنا؟« ← رفع الكلفة تدريجيا يكشف حد نزاهته الحقيقي.","a5":"يبلغ فورا بلا تردد في كل السيناريوهات، ويقترح صيغة تصحيح أمام العميل بأقل ضرر، ويتحمل المسؤولية بلا تبرير.","a3":"يبلغ في الحالة البسيطة ويتردد حين ترتفع الكلفة أو يقترب موعد مهم.","a1":"»على حسب حجم الغلط«، أو »أصلحه بالتقرير الجاي بهدوء«، أو أي تردد ملحوظ في الإجابة الأولى.","red":"تردد واضح أمام الحالة الأولى البسيطة .. تحت ضغط حقيقي سيخفي أ كثر."},{"n":11,"flags":[],"q":"اشرح لي خطوة بخطوة كيف تتحقق من صحة أرقامك قبل التسليم.","extra":"","follow":"»وكم مرة مسكت عليك طريقتك هذي غلطا خلال آخر ثلاثة أشهر؟« ← من يقول »ولا مرة« إما لا يستخدمها أو لا يعمل بحجم كاف.","a5":"خطوات محددة قابلة للتكرار: مطابقة مع مصدرين، حساب عكسي، فاصل زمني قبل التسليم، قائمة تحقق ثابتة .. ويعطي أمثلة أمسكتها فعلا.","a3":"يذكر خطوة أو خطوتين حقيقيتين لكن بلا انتظام ولا توثيق.","a1":"»أنا دقيق بطبعي« أو »أراجع مرة ثانية« بلا وصف لأي آلية.","red":""},{"n":12,"flags":[],"q":"من وين تجيب بياناتك؟ سم لي مصادرك بالاسم .. وشنو تسوي لو مصدران تعارضا؟","extra":"","follow":"»وشنو مصدر ما تعتمد عليه أبدا؟ وليش؟« ← معرفة ما يستبعد أدل من معرفة ما يستخدم.","a5":"مصادر أولية محددة بالاسم، ويفرق بين مصدر البيانات ومصدر الرأي، وعند التعارض يرجع للمصدر الأصلي لا للأحدث.","a3":"مصادر معقولة لكنها ثانوية، وعند التعارض يرجح بلا معيار واضح.","a1":"»من تويتر« أو »من القروبات« أو »من النت«، أو مصادر مؤثرين بلا تمييز.","red":""}]},{"t":"التبسيط والمحتوى المقيد","w":2,"def":"يبسط بلا تشويه، ويسوق داخل قيود لا وعود فيها بعائد","qs":[{"n":13,"flags":["اختبار حي"],"q":"»أنا عميلة ما أعرف شي بالاستثمار .. فسر لي إعادة توازن المحفظة بدقيقة.« شغلي مؤقتا أمامه.","extra":"","follow":"»الحين اشرحها لعميل عمره 60 وخايف يخسر« ← تبديل الجمهور فورا يكشف المرونة الحقيقية · »واشرحها بجملة وحدة«.","a5":"لغة يومية ومثال محسوس، لا يمرر مصطلحا إلا ويشرحه، ينهي ضمن الدقيقة، ويعيد الصياغة بنجاح حين يتغير الجمهور.","a3":"شرح صحيح لكنه مطول أو يميل للغة المحلل، ويتعثر قليلا عند تبديل الجمهور.","a1":"مصطلحات بلا شرح، أو تبسيط مخل يشوه المعنى، أو يتوتر ويخرج عن السؤال.","red":""},{"n":14,"flags":[],"q":"كيف تسوق لباقة استثمارية بدون ما توعد بأي عائد؟ عطني ثلاث زوايا مختلفة.","extra":"","follow":"»وأي وحدة فيهن أضعف؟ وليش؟« ← قدرته على نقد اقتراحه أدل من الاقتراح نفسه.","a5":"ثلاث زوايا متمايزة فعلا )الوضوح · الطمأنينة · تجنب الأخطاء المكلفة · الانضباط(، يربطها بحالة العميل لا بالمنتج، وينقد أضعفها بنفسه.","a3":"زاويتان معقولتان وثالثة مكررة، أو زوايا صحيحة لكنها عامة تصلح لأي منتج.","a1":"كل زواياه تلمح للعائد، أو يرى القيد عائقا تسويقيا يجب الالتفاف عليه.","red":""},{"n":15,"flags":[],"q":"شنو المحتوى المالي اللي تشوفه مضرا للناس؟ وسبق واشتغلت على محتوى ما ارتحت له؟ شنو سويت؟","extra":"","follow":"»وشنو كانت النتيجة لما اعترضت؟« · »ولو طلب منك اليوم محتوى ما ترتاح له، شنو تسوي بالضبط؟«","a5":"ينقد وعود الأرباح وإثارة الخوف والاستعجال، ويشرح الضرر على المتلقي لا على السمعة، ويعطي موقفا حقيقيا اعترض فيه.","a3":"نقد سليم نظريا لكن بلا موقف شخصي، أو اعترض داخليا ولم يفعل شيئا.","a1":"لا يرى مشكلة في محتوى الربح السريع، أو ينتقد الشكل )»تصميم رديء«( لا الجوهر.","red":""}]},{"t":"الحكم على المعلومة","w":2,"def":"يفلتر الضجيج بمعيار صريح، ويتحقق من المصدر قبل التمرير","qs":[{"n":16,"flags":[],"q":"تابعت قروبا وطلع فيه كلام ملفت .. كيف تقرر إذا يستاهل يوصل لسارة ولا لا؟","extra":"","follow":"»عطني مثالا من الأسبوع اللي فات: شي مررته وشي حجبته .. وليش؟« ← المثال المزدوج يكشف وجود المعيار من عدمه.","a5":"معيار صريح ومتسق )المصدر · هل يمس عملاءنا · جديد أم متكرر · قابل للتحقق(، ويعطي مثالين حقيقيين حديثين بالاتجاهين.","a3":"عنده حس فلترة معقول لكن بلا معيار يمكن تعليمه لغيره.","a1":"»أرسل كل شي مهم« بلا معيار .. سيغرق سارة ويصبح عبئا لا مساعدة.","red":""},{"n":17,"flags":[],"q":"وصلك خبر من مصدر واحد فقط، يبدو مهما وعاجلا ويمس عملاءنا .. شنو تسوي بالساعة الجاية؟","extra":"","follow":"»ولو ما لقيت مصدرا ثانيا خلال ساعة؟«","a5":"يبحث عن تأ كيد مستقل قبل أي تمرير، وإن لم يجد يمرره لسارة موسوما بأنه غير مؤكد ومع رابط المصدر.","a3":"يمرره بسرعة معتمدا على أهميته، وينوي التحقق لاحقا.","a1":"يمرره فورا بلا تحقق ولا وسم، أو يبني عليه محتوى مباشرة.","red":""}]},{"t":"التوافق والاستمرارية","w":2,"def":"ينسجم مع هوية العيادة العلاجية، ودوافعه قابلة للتحقق عندنا","qs":[{"n":20,"flags":["علم أحمر محتمل"],"q":"عميل قال لك: »ودي أضاعف فلوسي خلال سنة« .. شنو ترد؟","extra":"","follow":"»ولو قال: أنا مستعد أتحمل أي مخاطرة، بس دلني؟«","a5":"يعيد تأطير التوقع بلطف، ويسأل عن الهدف الحقيقي وراء الرقم، ويربطه بالمخاطرة والأفق الزمني .. ويثبت حتى بعد إعلان العميل تحمله للمخاطرة.","a3":"يعيد التأطير أولا ثم يلين ويقترح اتجاها عاما عند الإلحاح.","a1":"يماشي العميل، أو يقترح أدوات عالية المخاطر، أو يعده بأي شكل.","red":"أي وعد أو مماشاة .. تتعارض مباشرة مع هوية العيادة العلاجية."},{"n":21,"flags":[],"q":"شنو تعرف عن العيادة؟ ولو صار لك القرار .. شنو أول شي تغيره بالباقة الاستثمارية؟","extra":"","follow":"»وشنو أول شي ما تغيره أبدا؟« ← يكشف هل فهم ما يميزنا أم قرأ الصفحة التعريفية فقط.","a5":"تفاصيل تدل على اطلاع حقيقي، واقتراح محدد مع تبرير ولو كان نقدا، ويعرف ما يستحق الحفاظ عليه.","a3":"اطلاع سطحي مع اقتراح عام يصلح لأي جهة.","a1":"معلومات من الصفحة التعريفية فقط، أو »كل شي ممتاز ما أغير شي«، أو نقد بلا بديل.","red":""},{"n":22,"flags":[],"q":"بعد سنة .. شنو اللي إذا صار تقول الوظيفة نجحت لي شخصيا؟ وشنو اللي يخليك تفكر تتركها؟","extra":"","follow":"الشق الثاني هو الأهم .. اسأليه ولا تحذفيه، فهو يعطيك ورقة الاحتفاظ به مبكرا.","a5":"هدف محدد قابل للتحقيق عندنا فعلا، وسبب ترك واقعي يمكننا تجنبه أو معالجته.","a3":"هدف عام، أو يتجنب الإجابة عن سبب الترك.","a1":"الراتب فقط، أو هدف لا نستطيع توفيره أصلا )ظهور شخصي، إدارة فريق كبير( .. سيرحل خلال سنة.","red":""}]},{"t":"صدق الخبرة وعمقها","w":1,"def":"روايته عن خبرته مطابقة للواقع، وارتباطاته معلنة","qs":[{"n":18,"flags":["سؤال تاريخي"],"q":"خذني على آخر مشروع استثماري من أوله لآخره .. شنو دورك بالضبط وشنو دور غيرك فيه؟","extra":"","follow":"»منو كان يراجع شغلك؟ وشنو أ كثر ملاحظة تتكرر عليك منه؟« ← تطابق لاحقا مع فحص المراجع في قسم .17","a5":"يفصل بدقة بين مساهمته ومساهمة غيره، ويعرف حدود دوره، ويذكر ملاحظة متكررة عليه بلا دفاعية.","a3":"وصف صحيح لكنه عام، ويصعب تحديد ما نفذه بنفسه.","a1":"كل شي »أنا سويته«، أو لا يتذكر تفاصيل مشروع قريب.","red":""},{"n":19,"flags":["علم أحمر محتمل"],"q":"عندك أي التزام عمل ثاني حاليا؟ كم ساعة فعلية تعطينا؟ وكيف بتوزعها على الأسبوع؟","extra":"","follow":"","a5":"يصرح تلقائيا بأي ارتباط، ويعطي ساعات محددة وتوزيعا أسبوعيا واقعيا، ويقترح كيف يفصل بينها.","a3":"يصرح بعد السؤال المباشر، وتوزيعه للساعات عام.","a1":"مراوغة، أو »أقدر أدبر وقتي«، أو يذكر الارتباط فقط بعد السؤال مرتين.","red":"ارتباط مخفي يعترف به بعد الإلحاح .. المشكلة ليست بالارتباط بل بإخفائه."}]}]},"support":{"name":"خدمة العملاء","role":"خدمة العملاء وتطوير العمل","sub":"واتساب فقط · بلا مكالمات · مناوبات مرنة","minutes":75,"max":85,"gate":68,"comps":[{"t":"السرعة وإدارة الساعة الأولى","w":3,"def":"يرد سريعا ولو بلا حل، ويملك المشكلة من أول رسالة، ويرتب عدة محادثات متزامنة بلا ضياع أحد","qs":[{"n":1,"flags":["اختبار حي"],"q":"وصلتك هذه الرسالة الحين .. اكتب لي حرفيا ردك الأول على جوالك، ومعك دقيقتان.","extra":"الرسالة السلام عليكم .. أنا عندي أقساط متأخرة وبنك يهددني بقضية وما أدري وش أسوي، تكفون ردوا علي 10:42 م","follow":"»ليش اخترت تبدأ بهذي الجملة تحديدا؟« · »ولو ما عندك أي معلومة عن حالته، شنو أقصى شي تقدر تعطيه بأول رسالة؟«","a5":"رد فوري قصير يطمئن ويملك المشكلة، بلا وعد بحل ولا رأي مالي، وفيه سؤال واحد يقرب الحل، وإشارة واضحة لما سيحدث بعده ومتى.","a3":"رد لطيف لكنه عام )»بنتواصل معك قريبا«( بلا سؤال يقرب الحل ولا توقيت.","a1":"يبدأ بجمع بيانات كنموذج بارد، أو يعد بحل، أو يعطي رأيا، أو رد طويل جدا على رسالة قلق.","red":""},{"n":2,"flags":[],"q":"عندك سبع محادثات مفتوحة بنفس اللحظة، واثنتان منها متأخرة أ كثر من ساعة .. رتب لي شنو تسوي بالضبط","extra":"وبأي ترتيب.","follow":"»وكيف تعرف إن وحدة منهم انتظرت ساعة .. عندك طريقة ولا بالذاكرة؟« ← الاعتماد على الذاكرة يسقط أول يوم ازدحام.","a5":"يعطي قاعدة ترتيب واضحة )المتأخر أولا · ثم الحرج · ثم السريع الإغلاق(، ويصف آلية ملموسة للوسم أو التتبع، ويرسل ردا قصيرا للمتأخرين قبل أن يبدأ الحل.","a3":"ترتيب معقول لكنه بالحدس، بلا آلية تتبع يمكن تعليمها لغيره.","a1":"»أرد بالترتيب اللي وصلوني«، أو يبدأ بالأسهل، أو يعتمد على ذاكرته بالكامل.","red":""},{"n":3,"flags":["سؤال تاريخي"],"q":"شنو أطول وقت تأخرت فيه على عميل بشغل سابق؟ شنو صار، وشنو سويت لما رجعت له؟","extra":"","follow":"»وشنو غيرت بعدها عشان ما يتكرر؟« · »وكم مرة صار لك هذا آخر ثلاثة أشهر؟«","a5":"موقف محدد بتاريخ ونتيجة، اعتذر فيه بلا تبرير طويل وأصلح الضرر، وبنى بعده عادة أو نظاما يقدر على وصفه.","a3":"يذكر موقفا حقيقيا لكنه يبرره بالظروف ولم يغير شيئا بعده.","a1":"»ما تأخرت أبدا« .. إما مبالغة أو لم يعمل بحجم كاف. أو يلوم النظام أو الفريق بالكامل.","red":""}]},{"t":"حدود الدور والأمانة المهنية","w":3,"def":"لا يعطي رأيا ماليا ولا توصية، ولا يعد بمبلغ أو موعد لا يملكه، ويصعد في وقتها بلا حرج","qs":[{"n":4,"flags":[],"q":"عميلة كتبت: »بيني وبينك .. أسدد قرض السيارة أول ولا البطاقة؟ أنت أدرى مني.« شنو ترد؟","extra":"علم أحمر محتمل","follow":"»رجعت وقالت: أدري إنك ما تقدر تنصح، بس أعطني توجيه عام؟« ← ثم إن ثبت: »قالت إنها بتترك البرنامج إذا ما حصلت جواب اليوم.«","a5":"يثبت في المحاولات الثلاث، يعتذر بدفء لا بجفاء، يشرح لماذا الجواب يحتاج نظرة على كامل وضعها، ويحولها للمختصة بموعد محدد ويوثق السؤال.","a3":"يرفض أولا ثم يلين إلى »توجيه عام« أو رأي غير مباشر تحت الضغط الثالث.","a1":"يجيب من أول مرة، أو يجيب بصيغة »بيني وبينك« ويعتبرها استثناء مقبولا، أو يرفض بجفاء يخسر العميلة.","red":"أي إجابة تحمل ترجيحا بين خيارين ماليين، ولو بصيغة »عموما الناس يبدون بـ..« .. ينهى الترشيح."},{"n":5,"flags":[],"q":"عميل يسأل: »متى بيوصلني تقريري؟« وأنت ما تعرف .. والمختصة ما ردت عليك من أمس. شنو تكتب له؟","extra":"علم أحمر محتمل","follow":"»ولو ضغط وقال أعطني تاريخ تقريبي وخلاص؟« · »ومتى تصعد الموضوع داخليا .. بعد كم ساعة بالضبط؟«","a5":"لا يخترع موعدا، يصارح بأنه يتابع الآن ويعطي موعدا للرد لا للتسليم، ويحدد لنفسه سقفا زمنيا واضحا للتصعيد الداخلي، ويعود للعميل حتى لو لم يصله جديد.","a3":"يصارح بأنه سيتابع لكن بلا موعد للرد ولا سقف للتصعيد .. فيبقى العميل معلقا.","a1":"يعطي تاريخا تقريبيا من عنده، أو يجاري الضغط بـ»بكرة إن شاء الله«، أو يصمت حتى ترد المختصة.","red":"اختراع موعد لتهدئة العميل .. الوعد المكسور يكلف أضعاف الانتظار المعلن."},{"n":6,"flags":[],"q":"عطني موقفا ضغط فيه عميل أو مدير عليك عشان تعطي معلومة أو تسوي شي ما كنت مرتاحا له .. شنو صار؟","extra":"سؤال تاريخي","follow":"»شنو الجملة اللي كتبتها له حرفيا؟« · »وشنو كلفك الموقف؟« · »ولو تكرر اليوم تسوي نفس الشي؟«","a5":"موقف محدد قال فيه »لا« ولو لجهة أعلى منه، يذكر الجملة الحرفية، ويعترف بكلفة تحملها ولم يندم عليها.","a3":"موقف حقيقي لكنه تعامل معه بالتأجيل أو التهرب أو تمريره لغيره.","a1":"لا يملك أي موقف رغم سنوات خبرته، أو رضخ وبرر بمنطق »العميل دائما على حق«.","red":""}]},{"t":"التعامل مع الغاضب والمتعثر","w":2,"def":"يمتص الغضب بلا مجاراة ولا دفاع، ويحفظ كرامة العميل المحرج من وضعه المالي","qs":[{"n":7,"flags":["اختبار حي"],"q":"وصلتك هذه الرسالة .. اكتب ردك حرفيا.","extra":"الرسالة صار لي 3 أيام أنتظر وما أحد رد علي .. هذي خدمة؟ ادفع وأتوسل عشان يردون علي؟ أبي أرجع فلوسي 1:17 ص","follow":"»ولو رد عليك برسالة أقسى وفيها كلام شخصي عليك؟« · »وشنو تسوي بعد ما ترد .. تسكر المحادثة ولا شي ثاني؟«","a5":"يعترف بالتأخير صراحة بلا تبرير، يعتذر مرة واحدة بوضوح، ينتقل فورا إلى فعل محدد بتوقيت، ولا يجاري النبرة ولا يدافع .. ويصعد داخليا بعدها.","a3":"يعتذر بلطف لكنه يبرر التأخير بالضغط أو النظام، أو يكرر الاعتذار بلا فعل محدد.","a1":"يدافع أو يشرح إجراءات الشركة، أو يرد ببرود قالبي، أو يجاري النبرة، أو يتجاهل طلب استرجاع المبلغ.","red":"أي جدال أو رد بنفس نبرة العميل .. القناة مكتوبة ومحفوظة، والرسالة الواحدة تنتشر."},{"n":8,"flags":[],"q":"عميلة كتبت وهي محرجة: »أنا أستحي أقول لكم كم علي ديون .. حسيت إني فاشلة.« شنو ترد؟","extra":"","follow":"»وليش اخترت هذي الصياغة؟« · »وشنو الشي اللي ما تكتبه لها أبدا بهذي اللحظة؟«","a5":"يطبع الموقف بلا تصغير له ولا مبالغة في التعاطف، يحفظ كرامتها، لا يعلق على الرقم إطلاقا، وينقلها بهدوء إلى الخطوة العملية التالية.","a3":"رد لطيف لكنه عام أو مفرط في المجاملة والتطمين، بلا خطوة عملية.","a1":"يواسي بنبرة شفقة أو وعظ، أو يعلق على قراراتها السابقة، أو يقفز مباشرة لطلب البيانات بلا أي تقدير.","red":""},{"n":9,"flags":["سؤال تاريخي"],"q":"شنو آخر عميل خرج منك زعلان ولا قدرت ترضيه؟ شنو صار، وشنو تسوي لو رجع اليوم؟","extra":"","follow":"»وشنو أثر عليك شخصيا من الموقف؟« · »وكيف تفصل بين شغلك ومزاجك لما يجيك عميل قاسي؟«","a5":"موقف محدد يرويه بلا دفاعية، يعترف بما كان يمكن فعله أفضل، ويصف كيف يفصل الغضب عن نفسه بلا برود ولا احتراق.","a3":"موقف حقيقي لكنه يحمل العميل كامل المسؤولية، أو لا يذكر أثرا شخصيا إطلاقا.","a1":"»كل عملائي راضين«، أو يروي الموقف بامتعاض ما زال يحمله، أو يصف العملاء بلغة استعلاء.","red":""}]},{"t":"الكتابة ونبرة العيادة","w":2,"def":"يكتب واضحا وقصيرا وهادئا، بلا قوالب جامدة وبلا إفراط في المجاملة","qs":[{"n":10,"flags":[],"q":"اكتب لي رسالة ترفض فيها طلب عميل بتأجيل موعد جلسته للمرة الثالثة .. بحيث ما يزعل ولا يحس بالرفض","extra":"اختبار حي جافا.","follow":"»طيب اختصرها لنصف الطول بلا ما تخسر معناها« ← الاختصار تحت الطلب يكشف تحكمه الحقيقي باللغة.","a5":"قصيرة وواضحة، الرفض فيها صريح بلا مواربة، ومعه بديل عملي، وبنبرة دافئة بلا مجاملة زائدة .. ويختصرها بنجاح عند الطلب.","a3":"مهذبة لكنها مطولة أو ملتوية، أو الرفض فيها غير واضح فيتوهم العميل موافقة.","a1":"قالب جامد، أو أخطاء إملائية ظاهرة، أو نبرة بيروقراطية، أو إفراط بالإيموجي وعلامات التعجب.","red":""},{"n":11,"flags":[],"q":"شنو الفرق بينك وأنت ترد على عميل بالواتساب وبينك وأنت ترد عليه بمكالمة؟ عطني مثالين.","extra":"","follow":"»وشنو الشي اللي ينفهم غلط بالكتابة وما ينفهم غلط بالصوت؟«","a5":"يدرك أن الكتابة تفقد النبرة فتحتاج تصريحا بالنية، ويعطي أمثلة ملموسة )تقسيم الرسائل · تجنب السخرية · تأ كيد الفهم كتابة · لا رسائل صوتية(.","a3":"يدرك الفرق نظريا لكن أمثلته عامة.","a1":"»ما في فرق«، أو يفضل المكالمة ويرى الكتابة عائقا، أو يقترح حل المواقف الصعبة بمكالمة .. وهذا غير متاح في الدور.","red":""},{"n":12,"flags":["اختبار حي"],"q":"هذي رسالة كتبها موظف سابق .. أعد صياغتها.","extra":"الرسالة عزيزي العميل المحترم، نفيدكم علما بأنه تم استلام طلبكم وسيتم الرد عليكم في أقرب وقت ممكن حسب الإجراءات المتبعة لدينا، شاكرين لكم حسن تعاونكم معنا ونعتذر عن أي إزعاج قد يحصل تمت القراءة","follow":"»شنو أ كثر شي مزعج بالرسالة الأصلية؟« ← تشخيصه للمشكلة أدل من إعادة صياغته لها.","a5":"يشخص المشكلة )لغة إدارية باردة · بلا توقيت · بلا مالك للطلب · اعتذار مبهم(، ويكتب بديلا قصيرا بضمير المتكلم مع توقيت واضح واسم من يتابع.","a3":"يبسطها ويقصرها لكنه يبقي اللغة الإدارية أو ينسى التوقيت.","a1":"يرى الرسالة الأصلية مهذبة وسليمة، أو يعيد صياغتها بقالب إداري آخر.","red":""}]},{"t":"حل المشكلة وتطوير العمل","w":2,"def":"يفهم الطلب الحقيقي ويغلق بحل لا بتدوير، ويرصد ما يتكرر ويرفعه باقتراح عملي يقلل تكراره","qs":[{"n":13,"flags":[],"q":"عميل كتب: »ما اشتغل معي الرابط.« بس .. شنو تسوي؟","extra":"","follow":"»وكم سؤالا بترسل له قبل ما تحل؟« ← عشرة أسئلة استجواب تخسر العميل بقدر ما يخسره الصمت.","a5":"يسأل سؤالا واحدا دقيقا أو يطلب لقطة شاشة، ويرسل معه الحل الأرجح مسبقا كي لا ينتظر العميل دورتين.","a3":"يسأل أسئلة صحيحة لكن على دفعات متتالية، فتطول الدورة.","a1":"يرسل قائمة أسئلة كاستجواب، أو يحول الطلب لجهة أخرى فورا، أو يجيب بحل عام لا علاقة له بالمشكلة.","red":""},{"n":14,"flags":[],"q":"عطني مشكلة عميل حليتها بنفسك بلا ما ترجع لأحد .. وأخرى اضطررت تحولها. كيف عرفت الفرق؟","extra":"سؤال تاريخي","follow":"»وشنو أطول شي انتظرته من زميل قبل ما تصعد؟« · »ومنو كان يعرف إنك حولت .. العميل ولا بس أنت؟«","a5":"حد فاصل واضح يمكن تعليمه لغيره، ويبقى مالكا للمحادثة بعد التحويل ويتابعها حتى تغلق، ويشعر العميل بما حدث.","a3":"يفرق بالحدس، ويحول ثم يعتبر مسؤوليته انتهت.","a1":"يحول كل شيء تقريبا، أو يحاول حل ما ليس من صلاحياته، أو يترك العميل بلا إشعار بالتحويل.","red":""},{"n":15,"flags":[],"q":"شنو أ كثر سؤال أو شكوى تكررت عليك من العملاء بشغلك السابق؟ وشنو سويت عشان تقل .. لا عشان","extra":"محور التطوير تجاوب عليها كل مرة؟","follow":"»ووصل اقتراحك لأحد فوقك ولا حليته لحالك؟« · »وشنو صار بعده .. تغير شي فعلا؟« · »ولو دخلت علينا وشفت مشكلة متكررة، شنو تسوي بالضبط وبأي ترتيب؟«","a5":"يرصد التكرار بوعي ويفرق بين معالجة الحالة ومعالجة السبب، ويصف تغييرا فعليا نتج عن اقتراحه )نص جاهز · تعديل رسالة تلقائية · تبسيط خطوة في الخدمة( مع أثر ملموس على وقته أو على العميل، ويعرف لمن يرفع الاقتراح وكيف يصيغه.","a3":"يذكر السؤال المتكرر ويجيب عليه كل مرة بإتقان، بلا محاولة لتقليل تكراره .. أو رفع اقتراحا ولم يتابعه.","a1":"لا يتذكر ما يتكرر عليه، أو يرى أن حل ذلك ليس من شغله، أو ينتقد الشركة السابقة بلا اقتراح بديل.","red":""}]},{"t":"الانضباط بلا دوام ثابت","w":2,"def":"يلتزم بنافذته المتفق عليها، ويسلم المناوبة بنظام، ويشعر قبل الغياب لا بعده","qs":[{"n":16,"flags":[],"q":"ما في دوام ثابت .. في نافذة تغطية نتفق عليها. شنو النافذة اللي تقدر تلتزم فيها فعلا كل يوم؟","extra":"علم أحمر محتمل","follow":"»وشنو الأوقات اللي أ كيد ما تقدر ترد فيها؟« · »وعندك أي ارتباط عمل ثاني حاليا؟«","a5":"يعطي نافذة محددة وواقعية، ويصرح تلقائيا بالأوقات التي لا يستطيع الرد فيها وبأي ارتباط قائم، ويسأل عن آلية التسليم بين المناوبات.","a3":"يعطي نافذة عامة أو متفائلة، ويصرح بارتباطاته بعد السؤال المباشر.","a1":"»أنا متاح 24 ساعة« .. وعد لا يصمد أسبوعين. أو مراوغة، أو إخفاء ارتباط يكتشف لاحقا.","red":"ارتباط عمل مخفي يعترف به بعد الإلحاح .. المشكلة ليست بالارتباط بل بإخفائه."},{"n":17,"flags":[],"q":"انتهت نافذتك وعندك محادثتان مفتوحتان ما انحلتا .. شنو تسوي بالضبط قبل ما تقفل؟","extra":"","follow":"","a5":"يرسل رسالة إغلاق للعميلين توضح متى يعود، ويسلم ملخصا مكتوبا للمناوبة التالية بحالة كل محادثة والخطوة المطلوبة.","a3":"يشعر العميل لكنه لا يسلم شيئا للفريق، أو العكس.","a1":"يقفل ويكمل بكرة، أو يبقى يشتغل ساعتين إضافيتين كل يوم .. وكلاهما ينهار خلال شهر.","red":""},{"n":18,"flags":["سؤال تاريخي إن أمكن"],"q":"مرضت أو صار عندك طارئ بنص نافذتك .. شنو تسوي بأول عشر دقائق؟","extra":"","follow":"","a5":"يشعر الفريق فورا بقناة متفق عليها، يحدد ما هو عالق ومن يستلمه، ويعطي وقتا متوقعا لعودته .. ويذكر مثالا حقيقيا فعل فيه ذلك.","a3":"يشعر الفريق لكن متأخرا أو بلا تسليم واضح لما هو عالق.","a1":"يختفي ويشرح بعد يوم، أو يفترض أن أحدا سيلاحظ ويغطي مكانه.","red":""}]},{"t":"الدقة وضبط المعلومة","w":2,"def":"لا يخترع معلومة، ويتحقق قبل أن يكتب رقما أو موعدا، ويصحح خطأه أمام العميل","qs":[{"n":19,"flags":["علم أحمر محتمل"],"q":"اكتشفت إنك أعطيت عميلا معلومة غلط قبل يومين وما أحد لاحظ .. شنو تسوي؟","extra":"","follow":"»ولو المعلومة الغلط خلته يفوت موعدا أو يدفع مبلغا؟« · »ومنو تخبر أول .. العميل ولا مديرك؟«","a5":"يبلغ داخليا فورا ويصحح مع العميل بلا تبرير، ويتحمل المسؤولية، ويثبت على ذلك حتى حين ترتفع الكلفة.","a3":"يصحح في الحالة البسيطة ويتردد حين تكبر الكلفة أو يخشى اللوم.","a1":"»على حسب حجم الغلط«، أو يصلحها بهدوء بلا إخبار أحد، أو تردد ملحوظ في الإجابة الأولى.","red":"إخفاء خطأ وقع مع عميل .. في قناة محفوظة، الخطأ المخفي يظهر دائما ومعه ثقة مهدورة."},{"n":20,"flags":[],"q":"عميل سأل عن تفصيل بخدمة وأنت مو متأ كد من الجواب .. شنو تسوي؟","extra":"","follow":"»وكم مرة صار لك إنك قلت لعميل ما أدري؟« ← من لم يقلها أبدا إما لا يعمل بحجم كاف أو يخترع.","a5":"يقولها بوضوح ويعطي موعدا للعودة بالجواب، ويتحقق من المصدر المعتمد لا من ذاكرته، ويعود في الموعد حتى لو لم يكتمل الجواب.","a3":"يقول إنه سيتأ كد لكن بلا موعد للعودة، أو يتحقق من زميل بدل المصدر المعتمد.","a1":"يجاوب بالأقرب لظنه، أو يتجنب السؤال، أو يحوله لغيره بلا متابعة.","red":""}]},{"t":"صدق الخبرة والاستمرارية","w":1,"def":"روايته عن خبرته مطابقة للواقع، ودوافعه للبقاء قابلة للتحقق عندنا","qs":[{"n":21,"flags":[],"q":"خذني على آخر مكان اشتغلت فيه خدمة عملاء .. كم محادثة باليوم، وشنو دورك بالضبط، ومنو كان يراجع","extra":"سؤال تاريخي شغلك؟","follow":"»شنو أ كثر ملاحظة تتكرر عليك منه؟« ← تطابق لاحقا مع فحص المراجع في قسم .18","a5":"أرقام محددة وواقعية، يفصل بدقة بين ما نفذه وما نفذه غيره، ويذكر ملاحظة متكررة عليه بلا دفاعية.","a3":"وصف صحيح لكنه عام، ويصعب تحديد حجم عمله الفعلي.","a1":"أرقام مبالغ فيها لا تتماسك تحت المتابعة، أو لا يتذكر تفاصيل عمل قريب.","red":""},{"n":22,"flags":[],"q":"بعد سنة .. شنو اللي إذا صار تقول الوظيفة نجحت لي؟ وشنو اللي يخليك تفكر تتركها؟","extra":"","follow":"الشق الثاني هو الأهم .. اسأليه ولا تحذفيه، فهو يعطيك ورقة الاحتفاظ به مبكرا.","a5":"هدف محدد قابل للتحقيق عندنا فعلا، وسبب ترك واقعي يمكننا تجنبه أو معالجته.","a3":"هدف عام، أو يتجنب الإجابة عن سبب الترك.","a1":"الراتب فقط، أو هدف لا نستطيع توفيره أصلا )دوام ثابت · إدارة فريق · دور استشاري مالي( .. سيرحل خلال سنة.","red":""}]}]},"bizdev":{"name":"تطوير الأعمال","role":"تطوير الأعمال والأوتوميشن","sub":"تقليل التكاليف · أتمتة العمليات · يقاس بالدينار والساعات","minutes":75,"max":85,"gate":68,"comps":[{"t":"قياس التوفير بالأرقام","w":3,"def":"يبني حالة بالساعات والدينار قبل وبعد، ويطرح كلفة الأداة والصيانة، ويعرف ما لا يستطيع قياسه","qs":[{"n":1,"flags":["علم أحمر محتمل"],"q":"عطني نظاما بنيته ووفر فلوسا فعلا .. وكم وفر بالضبط؟ وكيف حسبت الرقم؟","extra":"","follow":"»وشنو كانت كلفة الأداة والصيانة سنويا؟ وطرحتها من الرقم؟« ← السؤال الكاشف · »ومنو صدق على الرقم .. أنت ولا المالية؟« · »والرقم هذا بعد سنة ثبت ولا نزل؟«","a5":"مثال محدد بساعات قبل وبعد، وكلفة ساعة معلومة، ويطرح كلفة الأداة والبناء والصيانة، وصدق عليه أحد من المالية، ويعرف كم صمد الرقم بعد سنة.","a3":"وفر حقيقي وحساب معقول للساعات، لكن بلا طرح كلفة الأداة أو بلا تصديق من أحد.","a1":"نسب مئوية جاهزة بلا حساب، أو »وفرنا وقتا كثيرا« بلا رقم، أو رقم لا يتماسك عند سؤال المتابعة.","red":"رقم توفير كبير يتبين أنه لم يطرح منه كلفة الأداة .. سيقدم لنا الأرقام بنفس الطريقة."},{"n":2,"flags":["تمرين حي"],"q":"هذي الحالة قدامك .. احسب لي التوفير السنوي بصوت عالي، وعندك ورقة وقلم.","extra":"الحالة موظفة تصرف 45 دقيقة لكل عميلة على تفريغ كشوف وتجهيز تقرير · 40 عميلة شهريا · راتبها 700 دينار شهريا · الأداة المقترحة اشتراكها 25 دينارا شهريا · بناء الحل يستغرق 30 ساعة مرة واحدة · وبعد الأتمتة تبقى مراجعة بشرية 10 دقائق لكل عميلة.","follow":"»وشنو الفرضيات اللي مو متأ كد منها في حسابك؟« · »ولو قلت لك إن الموظفة ما بتترك الشغل .. يتغير رقمك؟« ← هنا يظهر فهمه لفرق التوفير النقدي عن الوقت المفرج.","a5":"يشتق كلفة الساعة من الراتب، يحسب الساعات قبل وبعد، يطرح الاشتراك وساعات البناء، يعطي نطاقا لا رقما قاطعا، ويفرق صريحا بين توفير نقدي وساعات مفرجة تعاد استثمارها في شغل آخر.","a3":"حساب صحيح لكنه يقدم رقما قاطعا بلا فرضيات معلنة، أو ينسى ساعات البناء.","a1":"يرفض الحساب أو يتهرب منه، أو يخطئ في المنطق الأساسي، أو يعد الوقت المفرج توفيرا نقديا مباشرا.","red":""},{"n":3,"flags":["سؤال تاريخي"],"q":"شنو مشروع أتمتة اشتغلت عليه وما وفر شي .. أو كلف أ كثر من اللي وفر؟","extra":"","follow":"»ومتى عرفت إنه ما وفر؟ وشنو سويت وقتها؟« · »وشنو تسوي مختلفا اليوم؟«","a5":"مثال صريح بلا تجميل، يذكر الرقم والسبب، ويصف كيف أوقفه أو رجع عنه، ويعطي درسا صار قاعدة عنده بعده.","a3":"يعترف بمشروع فشل لكنه يحمل الظروف أو الفريق السبب الكامل.","a1":"»كل مشاريعي وفرت« .. إما مبالغة أو لم يقس شيئا أصلا. أو يذكر فشلا ولا يعرف كلفته.","red":""}]},{"t":"أمانة الوعد وحدود الأتمتة","w":3,"def":"لا يعد بتوفير لا يستطيع إثباته، ويرفض أتمتة القرار المالي والتواصل الحساس، ويعلن المخاطر قبل البناء","qs":[{"n":4,"flags":["علم أحمر محتمل"],"q":"لو قلت لك: أبي أقلل تكاليفي %30 هذي السنة .. شنو ترد علي بأول جلسة؟","extra":"","follow":"»ولو قلت لك إني محتاجة الرقم هذا وخلاص، تقدر ولا لا؟« ← ثم إن ثبت: »وإذا قال غيرك إنه يقدر؟«","a5":"لا يقبل الرقم ولا يرفضه، يسأل عن بنية المصاريف الحالية قبل أي التزام، يشرح أن نسبة بلا بيانات وعد لا خطة، ويقترح تسلسلا: قياس أولا ثم أهداف بأرقام موثقة .. ويثبت على ذلك تحت الضغط.","a3":"يتحفظ أولا ثم يلين ويعطي نسبة تقريبية لإرضائك تحت الضغط الثاني.","a1":"يقول »نعم أقدر« من أول جلسة، أو يعطي نسبة أو جدولا زمنيا قبل أن يرى رقما واحدا من مصاريفنا.","red":"أي التزام برقم أو نسبة قبل رؤية البيانات .. من يعد صاحبة العمل هكذا سيعد بالمثل في كل تقرير لاحق."},{"n":5,"flags":["علم أحمر محتمل"],"q":"شنو الشي اللي ما تؤتمته أبدا في شركة مثل شركتنا؟ وليش؟","extra":"","follow":"»ولو الأتمتة توفر وقتا كبيرا فعلا .. يتغير موقفك؟« · »وشنو تسوي لو طلب منك أحد أتمتة رد آلي على أسئلة العملاء المالية؟«","a5":"يسمي حدودا صريحة بلا تلقين: القرار المالي، والتواصل الحساس مع عميلة متعثرة، والرسائل التي تبدو تحصيلا، ونقل بيانات العملاء لأدوات خارجية بلا ضبط .. ويشرح الضرر على العميلة وعلى العيادة لا على السمعة فقط، ويثبت حتى مع إغراء التوفير.","a3":"يذكر حدا أو حدين صحيحين لكن بتعبير عام، أو يستثني منها إن كان التوفير كبيرا.","a1":"»كل شي قابل للأتمتة«، أو يرى الحدود عائقا مؤقتا، أو يقترح ردا آليا على الأسئلة المالية.","red":"اقتراح أتمتة ترسل رسائل مالية أو تحصيلية لعميلة متعثرة بلا مراجعة بشرية .. يتعارض مباشرة مع هوية العيادة العلاجية."},{"n":6,"flags":["سؤال تاريخي"],"q":"عطني موقفا عارضت فيه قرار جهة أعلى منك في مشروع أتمتة .. شنو صار بالضبط؟","extra":"","follow":"»شنو الجملة اللي قلتها له حرفيا؟« · »وشنو كلفك الموقف؟« · »ولو نفذت رغم اعتراضك، وثقت اعتراضك ولا سكت؟«","a5":"موقف محدد اعترض فيه بأرقام لا بمشاعر، يذكر الجملة الحرفية، ووثق موقفه كتابة، ونفذ بمهنية بعد القرار النهائي.","a3":"موقف حقيقي لكنه اعترض شفويا بلا أرقام، أو أجل الاعتراض حتى فات وقته.","a1":"لا يملك أي موقف رغم خبرته، أو نفذ متضايقا وما زال يحمل الموقف، أو جادل حتى تعطل المشروع.","red":""}]},{"t":"تشخيص العملية قبل الأداة","w":2,"def":"يرسم العملية الحالية ويقيس زمنها، ويبدأ بالحذف والتبسيط قبل أي أداة","qs":[{"n":7,"flags":[],"q":"دخلت علينا اليوم أول يوم .. شنو تسوي بأول أسبوعين بالضبط؟ وشنو ما تسويه؟","extra":"","follow":"»ومنو تقابل؟ وشنو تسأله؟« · »ومتى تقترح أول حل .. بأي أسبوع؟« ← من يقترح حلا بالأسبوع الأول لم يشخص شيئا.","a5":"يبدأ بمقابلة من ينفذ العمل لا من يديره، ويرسم العمليات ويقيس أزمنتها بأرقام، ويرتبها بحسب الكلفة والتكرار، ويصرح بأنه لا يقترح أدوات في أول أسبوعين.","a3":"خطة معقولة للاستكشاف لكنها بلا قياس زمني، أو يخلط الاستكشاف بالحلول المبكرة.","a1":"يبدأ بمراجعة الأدوات أو بتقديم منظومة جاهزة نجحت عند غيرنا.","red":""},{"n":8,"flags":["حالة حية"],"q":"هذي عملية عندنا .. شخصها لي وقل لي شنو أول شي تسويه فيها.","extra":"الحالة تقرير متابعة شهري لكل عميلة: موظفة تطلب كشوفا من العميلة على الواتساب، تنتظر ردها أياما، تفرغ الأرقام يدويا، ترسل التقرير للمراجعة، ثم يعاد عليها بتعديلات، ثم ترسله للعميلة .. ومتوسط الدورة كاملة عشرة أيام.","follow":"»وأي خطوة تحذفها بالكامل لو خيرتك؟« ← الحذف قبل الأتمتة هو الاختبار الحقيقي · »ووين أطول انتظار في العملية؟ وهل هو عندنا ولا عند العميلة؟«","a5":"يفصل زمن العمل عن زمن الانتظار ويرى أن أطول كلفة في الانتظار لا في التفريغ، ويقترح حذف أو دمج خطوة قبل أي أداة، ويسأل عن سبب دورة المراجعة المتكررة بدل أتمتتها.","a3":"يشخص التفريغ اليدوي فقط ويقترح أتمتته، بلا تفكيك للانتظار ولا لدورة المراجعة.","a1":"ينتقل لأداة فورا، أو يقترح أتمتة العملية كما هي بخطواتها الزائدة، أو يقترح إلحاحا آليا على العميلة.","red":""},{"n":9,"flags":["سؤال تاريخي"],"q":"عطني عملية حذفتها أو بسطتها بلا أي أداة .. وكم وفرت؟","extra":"","follow":"»وكيف أقنعت اللي كان يسويها إنها ما تلزم؟«","a5":"مثال محدد بحذف فعلي وأرقام، ويشرح كيف تحقق أن الخطوة لا لزوم لها، وكيف أدار النقاش مع من كان ينفذها.","a3":"مثال تبسيط حقيقي لكن بلا أرقام أو بلا حذف فعلي لأي خطوة.","a1":"كل أمثلته أدوات وأنظمة .. لم يحذف شيئا في حياته المهنية، وهذا يعني أنه سيؤتمت لنا الهدر كما هو.","red":""}]},{"t":"التنفيذ الفعلي والتسليم","w":2,"def":"بنى بيده أنظمة تعمل اليوم، ويقدر على عرض دليل حي عليها لا وصف لها","qs":[{"n":10,"flags":["عرض حي"],"q":"شارك شاشتك وورني نظاما بنيته بنفسك ويشتغل اليوم .. وخذني على أجزائه.","extra":"","follow":"»وشنو الجزء اللي بنيته بنفسك وشنو اللي جاهز؟« · »وشنو أصعب شي وقفك فيه وكيف حليته؟«","a5":"يعرض نظاما حقيقيا يعمل، يفصل بدقة بين ما بناه وما استخدمه جاهزا، ويشرح قرارا تقنيا اتخذه وبديله الذي رفضه، وأجزاؤه مسماة وموثقة بلا فوضى.","a3":"يعرض شيئا حقيقيا لكنه بسيط جدا أو قديم، أو يشرح جيدا دون أن يفصل مساهمته عن غيره.","a1":"لا يملك شيئا يعرضه، أو يعتذر بأن كل شي على أجهزة العمل بلا أي بديل، أو يعرض عروضا تقديمية عن مشاريع لا النظام نفسه.","red":""},{"n":11,"flags":[],"q":"شنو أسرع شي قدرت تشغله وتجيب منه نتيجة .. وكم استغرق من أول فكرة لأول تشغيل؟","extra":"","follow":"»وليش هذي السرعة كانت ممكنة؟« · »وشنو الشي اللي أخر عليك مشروعا أ كثر من المتوقع؟«","a5":"يفكر بأصغر نسخة قابلة للتشغيل ويعطي مدة قصيرة بأسبوعين أو أقل، ويشرح ما قرر تأجيله ليطلع أسرع، ويعرف سبب تأخر مشروع آخر بلا تبرير.","a3":"يعطي مثالا حقيقيا لكن مدته طويلة، أو يصف مشروعا كاملا بلا مفهوم النسخة الأولى الصغيرة.","a1":"كل مشاريعه كبيرة وطويلة، أو يرى التسليم السريع تنازلا عن الجودة.","red":""},{"n":12,"flags":[],"q":"كيف توثق شي بنيته؟ وشنو تسلمه لنا بالضبط لما تخلص؟","extra":"","follow":"»ولو تركت الشغل بكرة .. منو يقدر يشغله؟ وكيف؟« ← أهم سؤال في هذا الدور.","a5":"توثيق مختصر وعملي: العملية، والحسابات والصلاحيات، ونقاط الفشل المحتملة، وخطوات التشغيل لغير التقني .. ويقدر على تسمية شخص شغل نظامه بعده فعلا.","a3":"يوثق تقنيا فقط، أو يوثق بلغة لا يفهمها غير التقني.","a1":"»النظام واضح ما يحتاج توثيق«، أو يوثق بعد الطلب فقط .. وهذا يخلق اعتمادا كاملا عليه.","red":""}]},{"t":"الموثوقية وما بعد التشغيل","w":2,"def":"يتوقع الفشل ويبني له تنبيها وخطة تراجع، ويوثق بما يمكن غيره من تشغيله","qs":[{"n":13,"flags":["سؤال تاريخي"],"q":"أتمتة بنيتها وقفت وأنت مو موجود، وما أحد داري .. شنو صار؟ وشنو غيرت بعدها؟","extra":"","follow":"»وكم مر عليها قبل ما تكتشفون؟« · »وشنو الضرر اللي وصل للعميل؟«","a5":"مثال صريح، يعترف بالضرر بلا تجميل، وبنى بعده تنبيها للفشل ومراجعة دورية .. ويقول إن كل أتمتة عنده اليوم تخبر إذا وقفت.","a3":"حصل وأصلحه لكن بلا نظام تنبيه بعده، أو يعتمد على ملاحظة المستخدمين.","a1":"»ما صار« .. إما لم يبن شيئا يعمل فعلا أو لا يتابع ما بناه. أو يقلل من أثر التوقف.","red":""},{"n":14,"flags":[],"q":"قبل ما تشغل أي أتمتة عندنا .. شنو تجهز تحسبا للفشل؟","extra":"","follow":"»ولو الفشل صار في أتمتة تلمس بيانات عملاء؟«","a5":"تنبيه عند الفشل، وخطة رجوع للطريقة اليدوية، وتشغيل مواز فترة قبل الاعتماد الكامل، ونسخة احتياطية، ومسؤول معروف بالاسم .. ويشدد أ كثر إن كانت البيانات حساسة.","a3":"يذكر بندا أو بندين )نسخة احتياطية أو تجربة أولية( بلا تنبيه ولا خطة رجوع.","a1":"يفترض أن الأتمتة تعمل ثم يعالج المشاكل حين تظهر، أو يعتبر التشغيل المواز مضيعة للوقت.","red":""},{"n":15,"flags":[],"q":"كم من وقتك الأسبوعي يروح على صيانة اللي بنيته سابقا؟ وكيف تمنعه من يكبر؟","extra":"","follow":"","a5":"يعطي نسبة واقعية من وقته، ويدرك أن كل نظام جديد يزيد عبء الصيانة، ويصف كيف يبسط أو يتقاعد أنظمة قديمة بدل تكديسها.","a3":"يعطي نسبة معقولة بلا خطة لضبط نموها.","a1":"»الأنظمة اللي أبنيها ما تحتاج صيانة«، أو صيانته تستهلك معظم وقته ولا يرى فيها مشكلة.","red":""}]},{"t":"التبني البشري وإدارة التغيير","w":2,"def":"يدرب المستخدمين ويتعامل مع المقاومة، ولا يبني نظاما يفهمه هو وحده","qs":[{"n":16,"flags":["سؤال تاريخي"],"q":"بنيت شي صح وما أحد استخدمه .. شنو صار؟ وشنو سويت؟","extra":"","follow":"»وشنو كان السبب الحقيقي من وجهة نظرهم لا من وجهة نظرك؟«","a5":"مثال صريح، ويحمل نفسه مسؤولية عدم التبني لا المستخدمين، ويصف ما تعلمه: إشراكهم من التشخيص، والتدريب على شغلهم الحقيقي، والبدء بمن يتحمس أولا.","a3":"مثال حقيقي لكنه يرى السبب في مقاومة الفريق أو ضعف دعم الإدارة فقط.","a1":"»الناس ما تحب التغيي const $=s=>document.querySelector(s);

let ROLE="invest", ID="", SC={}, RF={}, NOTE={}, APPS=[], CVID="";
const DRAFT="cc_hire_draft_v1";

/* ---------- scoring ----------
   Each question is 1, 3 or 5. A competency scores the average of its own
   questions, then that average is multiplied by the competency weight. The
   eight weights add to 17, so a perfect sheet is 17 x 5 = 85 — which is why
   the gate at 68 means the same thing on all three roles. An unanswered
   question leaves its competency partial, and the total is marked as such
   rather than quietly reading low. */
function calc(){
  const r=ROLES[ROLE]; let tot=0, done=0, all=0, partial=false;
  r.comps.forEach((c,ci)=>{
    const vals=c.qs.map(q=>SC[q.n]).filter(v=>v);
    all+=c.qs.length; done+=vals.length;
    if(vals.length<c.qs.length) partial=true;
    const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    tot += avg*c.w;
    const el=document.getElementById("cs"+ci);
    if(el) el.textContent = vals.length ? `${(avg*c.w).toFixed(1)} من ${c.w*5}` : `— من ${c.w*5}`;
  });
  const reds=Object.keys(RF).filter(k=>RF[k]);
  $("#tScore").textContent = done ? tot.toFixed(1) : "—";
  $("#tDone").textContent = `${done} من ${all}`;
  const v=$("#tVerdict");
  if(reds.length){ v.className="verdict fail"; v.textContent=`علم أحمر · ${reds.length}`; }
  else if(partial){ v.className="verdict part"; v.textContent="لم يكتمل"; }
  else if(tot>=r.gate){ v.className="verdict pass"; v.textContent=`يعبر · ${r.gate} فأعلى`; }
  else { v.className="verdict fail"; v.textContent=`تحت الحد · ${r.gate}`; }
  $("#redBox").innerHTML = reds.length
    ? `<div class="redlist">🚩 علم أحمر مرفوع على ${reds.length} سؤال: ${reds.map(n=>"رقم "+n).join(" · ")}. قرار التوظيف لا يتخذ بغياب أي منهما مهما كان انطباعك قويا.</div>` : "";
  saveDraft();
}

function paint(){
  const r=ROLES[ROLE];
  $("#rName").textContent=r.role; $("#rSub").textContent=r.sub;
  $("#rNums").textContent=`22 سؤالا على ثماني كفايات · الدرجة الكاملة ${r.max} · حد العبور ${r.gate} · ${r.minutes} دقيقة`;
  $("#hSub").textContent=`${r.name} · وثيقة داخلية · لا تسلم للمرشح`;
  document.querySelectorAll("#roleTabs button").forEach(b=>b.classList.toggle("on",b.dataset.r===ROLE));
  $("#comps").innerHTML = r.comps.map((c,ci)=>`
    <div class="comp">
      <div class="comph"><b>${esc(c.t)}</b><span class="w">وزن ${c.w}</span>
        <span class="cs" id="cs${ci}">— من ${c.w*5}</span>
        <div class="d">${esc(c.def)}</div></div>
      ${c.qs.map(q=>`
      <div class="q">
        <div class="qh"><span class="qn">${String(q.n).padStart(2,"0")}</span>
          <span class="qt">${esc(q.q)}</span>
          ${q.flags.map(f=>`<span class="tag ${f==="سؤال تاريخي"?"hist":f==="اختبار حي"?"live":"red"}">${esc(f)}</span>`).join("")}</div>
        ${q.extra?`<div class="row ex"><span class="k">اعرضه عليه</span><span class="v">${esc(q.extra)}</span></div>`:""}
        ${q.follow?`<div class="row"><span class="k">أسئلة المتابعة</span><span class="v">${esc(q.follow)}</span></div>`:""}
        <div class="row a5"><span class="k">ممتازة · 5</span><span class="v">${esc(q.a5)}</span></div>
        <div class="row a3"><span class="k">مقبولة · 3</span><span class="v">${esc(q.a3)}</span></div>
        <div class="row a1"><span class="k">ضعيفة · 1</span><span class="v">${esc(q.a1)}</span></div>
        ${q.red?`<div class="row rf"><span class="k">علم أحمر</span><span class="v">${esc(q.red)}</span></div>`:""}
        <div class="score">
          ${[5,3,1].map(v=>`<label data-q="${q.n}" data-v="${v}">
            <input type="radio" name="q${q.n}" value="${v}"> ${v} ${v===5?"ممتازة":v===3?"مقبولة":"ضعيفة"}</label>`).join("")}
          <label class="flag"><input type="checkbox" data-rf="${q.n}"> ارفع علم أحمر</label>
        </div>
        <div class="f note"><label>ملاحظاتي · اقتباس حرفي لا خلاصة</label>
          <textarea data-note="${q.n}"></textarea></div>
      </div>`).join("")}
    </div>`).join("");
  restoreInputs(); calc();
}
function restoreInputs(){
  document.querySelectorAll(".score label[data-q]").forEach(l=>{
    const n=+l.dataset.q, v=+l.dataset.v, on=SC[n]===v;
    l.querySelector("input").checked=on;
    l.className=on?("on"+v):"";
  });
  document.querySelectorAll("[data-rf]").forEach(c=>{ c.checked=!!RF[+c.dataset.rf]; });
  document.querySelectorAll("[data-note]").forEach(t=>{ t.value=NOTE[+t.dataset.note]||""; });
}
document.addEventListener("change", e=>{
  const l=e.target.closest(".score label[data-q]");
  if(l){ SC[+l.dataset.q]=+l.dataset.v; restoreInputs(); calc(); return; }
  if(e.target.dataset.rf!==undefined){ RF[+e.target.dataset.rf]=e.target.checked; calc(); return; }
});
document.addEventListener("input", e=>{
  if(e.target.dataset.note!==undefined){ NOTE[+e.target.dataset.note]=e.target.value; saveDraft(); }
});

const FIELDS=["fName","fEmail","fPhone","fWhen","fI1","fI2","fSrc","fPay","fNotice","fStage","fDecision","fFinal"];
function snapshot(){
  const o={role:ROLE,cvId:CVID,scores:SC,redFlags:RF,notes:NOTE,fields:{}};
  FIELDS.forEach(f=>o.fields[f]=($("#"+f)||{}).value||"");
  const r=ROLES[ROLE]; let tot=0,done=0,all=0;
  r.comps.forEach(c=>{const v=c.qs.map(q=>SC[q.n]).filter(x=>x);all+=c.qs.length;done+=v.length;
    tot+=(v.length?v.reduce((a,b)=>a+b,0)/v.length:0)*c.w;});
  o.total=+tot.toFixed(1); o.answered=done; o.questions=all;
  o.gate=r.gate; o.passed=done===all && tot>=r.gate && !Object.values(RF).some(Boolean);
  o.reds=Object.keys(RF).filter(k=>RF[k]).map(Number);
  return o;
}
function load(o){
  ROLE=(o.role&&ROLES[o.role])?o.role:"invest";
  SC=o.scores||{}; RF=o.redFlags||{}; NOTE=o.notes||{}; CVID=o.cvId||"";
  Object.keys(SC).forEach(k=>SC[k]=+SC[k]);
  paint();
  FIELDS.forEach(f=>{ if($("#"+f)) $("#"+f).value=(o.fields||{})[f]||""; });
  if($("#cvPick")) $("#cvPick").value=CVID;
  calc();
}
function saveDraft(){ try{ localStorage.setItem(DRAFT,JSON.stringify({id:ID,at:Date.now(),data:snapshot()})); }catch(e){} }
function msg(t,ok){ const m=$("#msg"); m.textContent=t||""; m.className="msg"+(t?(ok?" ok":" bad"):""); }

    APPS=((r.data&&r.data.careers&&r.data.careers.list)||[]);
    const sel=$("#cvPick");
    sel.innerHTML='<option value="">— اكتب البيانات يدويا —</option>'+
      APPS.map(a=>`<option value="${esc(a.id)}">${esc(a.name)} · ${esc(a.role)}</option>`).join("");
    sel.value=CVID;
  }catch(e){ console.error("applicants:",e); }
}
$("#cvPick").addEventListener("change", ()=>{
  CVID=$("#cvPick").value;
  const a=APPS.find(x=>x.id===CVID); if(!a) return;
  $("#fName").value=a.name||""; $("#fEmail").value=a.email||""; $("#fPhone").value=a.phone||"";
  if(!$("#fSrc").value) $("#fSrc").value="طلب توظيف من الموقع";
  saveDraft();
});

$("#bSave").addEventListener("click", async ()=>{
  const b=$("#bSave"); const name=($("#fName").value||"").trim();
  if(name.length<2) return msg("اكتب اسم المرشح قبل الحفظ",false);
  b.disabled=true; msg("جارٍ الحفظ…",true);
  try{
    const r=await call("saveHiringReport",{id:ID||"",body:snapshot()});
    ID=(r.data&&r.data.id)||ID; msg("انحفظ ✅",true);
    try{ localStorage.removeItem(DRAFT); }catch(e){}
  }catch(e){ msg((e&&e.message)||"تعذّر الحفظ",false); }
  finally{ b.disabled=false; }
});
$("#bNew").addEventListener("click", ()=>{
  if(!confirm("تفتح مقابلة جديدة فاضية؟ تأكد إنك حفظت الحالية.")) return;
  ID=""; SC={}; RF={}; NOTE={}; CVID="";
  FIELDS.forEach(f=>{ if($("#"+f)) $("#"+f).value=""; });
  $("#fStage").value="المقابلة المهيكلة";
  try{ localStorage.removeItem(DRAFT); }catch(e){}
  paint(); msg("",true);
});
$("#bPrint").addEventListener("click", ()=>window.print());
$("#bOpen").addEventListener("click", async ()=>{
  $("#listOvl").classList.add("on");
  $("#listBody").innerHTML='<div style="color:var(--muted)">لحظة…</div>';
  try{
    const r=await call("listHiringReports",{});
    const rows=(r.data&&r.data.list)||[];
    $("#listBody").innerHTML = rows.length ? rows.map(x=>`
      <div class="lrow">
        <b>${esc(x.name)||"(بدون اسم)"}</b>
        <span class="muted">${esc((ROLES[x.role]||{}).name||x.role)}</span>
        <span class="s" style="color:${x.passed?"#128C4A":"var(--burg)"}">${x.total} / ${x.gate}</span>
        <span class="muted">${esc(x.when||"")}</span>
        <button class="btn g" data-open="${esc(x.id)}">افتح</button>
        <button class="btn g" data-del="${esc(x.id)}" style="border-color:var(--burg);color:var(--burg)">حذف</button>
      </div>`).join("") : '<div style="color:var(--muted)">ما في مقابلات محفوظة بعد.</div>';
  }catch(e){ $("#listBody").innerHTML=`<div style="color:var(--burg)">${esc((e&&e.message)||"تعذّر التحميل")}</div>`; }
});
$("#listX").addEventListener("click", ()=>$("#listOvl").classList.remove("on"));
$("#listOvl").addEventListener("click", async e=>{
  if(e.target===$("#listOvl")) return $("#listOvl").classList.remove("on");
  const o=e.target.closest("[data-open]"), d=e.target.closest("[data-del]");
  if(o){
    try{ const r=await call("getHiringReport",{id:o.dataset.open});
      ID=o.dataset.open; load((r.data&&r.data.body)||{});
      $("#listOvl").classList.remove("on"); msg("انفتح الملف",true);
    }catch(err){ msg((err&&err.message)||"تعذّر الفتح",false); }
  }
  if(d){
    if(!confirm("تحذف هذه المقابلة نهائيا؟")) return;
    try{ await call("deleteHiringReport",{id:d.dataset.del});
      if(ID===d.dataset.del) ID="";
      $("#bOpen").click();
    }catch(err){ msg((err&&err.message)||"تعذّر الحذف",false); }
  }
});

$("#roleTabs").innerHTML=Object.keys(ROLES).map(k=>
  `<button data-r="${k}">${esc(ROLES[k].name)}</button>`).join("");
$("#roleTabs").addEventListener("click", e=>{
  const b=e.target.closest("button[data-r]"); if(!b||b.dataset.r===ROLE) return;
  const answered=Object.keys(SC).length;
  if(answered && !confirm("تبدل الدور؟ الدرجات المدخلة بتنمسح لأن الأسئلة تختلف.")) return;
  ROLE=b.dataset.r; SC={}; RF={}; NOTE={}; paint();
});

firebase.auth().onAuthStateChanged(u=>{
  if(!u){ location.href="../dashboard.html"; return; }
  if(!$("#fI1").value) $("#fI1").value=(u.email||"").split("@")[0];
  if(!$("#fWhen").value){
    const n=new Date(Date.now()-new Date().getTimezoneOffset()*60000);
    $("#fWhen").value=n.toISOString().slice(0,16);
  }
  loadApps();
});

/* an interview that was open when the tab closed comes back as it was */
(function(){
  paint();
  let d=null; try{ d=JSON.parse(localStorage.getItem(DRAFT)||"null"); }catch(e){}
  if(d && d.data && (Object.keys(d.data.scores||{}).length || (d.data.fields||{}).fName)){
    if(confirm("عندك مقابلة ما انحفظت. تكملها؟")){ ID=d.id||""; load(d.data); }
    else { try{ localStorage.removeItem(DRAFT); }catch(e){} }
  }
})();
</script></body></html>
