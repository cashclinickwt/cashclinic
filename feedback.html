<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- session feedback, reached from the email that goes out after a session -->
<title>كيف كانت جلستك؟ | كاش كلينك</title>
<link rel="icon" href="brand/mark/mark-purple.png">
<link rel="stylesheet" href="assets/ds/fonts/fonts.css">
<link rel="stylesheet" href="assets/ds/tokens/colors.css">
<link rel="stylesheet" href="assets/ds/tokens/typography.css">
<link rel="stylesheet" href="assets/ds/tokens/spacing.css">
<link rel="stylesheet" href="assets/ds/tokens/effects.css">
<link rel="stylesheet" href="assets/ds/tokens/base.css">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  body{background:var(--cc-purple-050);}
  .rt-hero{background:linear-gradient(150deg,var(--cc-purple-700),var(--cc-purple) 62%);color:var(--cc-cream);padding:52px 0 46px;position:relative;overflow:hidden}
  .rt-hero .cc-wrap{position:relative;z-index:1}
  .rt-hero .mark{position:absolute;inset-inline-end:-26px;bottom:-26px;width:150px;opacity:.12;z-index:0}
  .rt-badge{display:inline-block;background:var(--cc-gold);color:var(--cc-purple);font-weight:700;font-size:13.5px;border-radius:999px;padding:7px 16px}
  .rt-hero h1{font-size:clamp(26px,4vw,40px);font-weight:300;line-height:1.3;margin:16px 0 0;color:#fff}
  .rt-hero p{font-size:16.5px;line-height:1.9;color:var(--cc-purple-100);margin:14px 0 0;max-width:56ch}

  .rt-wrap{max-width:680px;margin:-26px auto 64px;padding:0 18px;position:relative;z-index:2}
  .rt-card{background:var(--cc-white);border:1px solid var(--cc-grey-200);border-radius:24px;padding:30px 26px;box-shadow:0 18px 50px rgba(47,23,72,.10)}

  .rt-q{margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--cc-grey-100)}
  .rt-q:last-of-type{border-bottom:0;padding-bottom:0;margin-bottom:0}
  .rt-q > label.q{display:block;font-size:16px;font-weight:700;color:var(--cc-purple);margin-bottom:12px;line-height:1.6}
  .rt-q .req{color:var(--cc-burgundy);font-weight:400}

  .rt-opts{display:flex;flex-wrap:wrap;gap:9px}
  .rt-opt{flex:1 1 auto;min-width:120px}
  .rt-opt input{position:absolute;opacity:0;pointer-events:none}
  .rt-opt span{display:block;text-align:center;border:2px solid var(--cc-grey-200);border-radius:14px;padding:13px 14px;font-size:15px;color:var(--cc-ink);cursor:pointer;transition:.15s;background:var(--cc-white);line-height:1.5}
  .rt-opt input:checked + span{border-color:var(--cc-purple);background:var(--cc-purple);color:var(--cc-cream);font-weight:700}
  .rt-opt input:focus-visible + span{outline:2px solid var(--cc-gold);outline-offset:2px}

  .rt-fld{margin-bottom:15px}
  .rt-fld label{display:block;font-size:13.5px;font-weight:700;color:var(--cc-ink);margin-bottom:6px}
  .rt-fld input,.rt-fld textarea,.rt-fld select{width:100%;border:2px solid var(--cc-grey-200);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;color:var(--cc-ink);background:var(--cc-white);box-sizing:border-box}
  .rt-fld textarea{min-height:96px;resize:vertical;line-height:1.85}
  .rt-fld input:focus,.rt-fld textarea:focus,.rt-fld select:focus{outline:0;border-color:var(--cc-purple)}
  .rt-phone{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:9px}
  .rt-phone select{font-size:14.5px}

  .rt-sub{margin-top:12px}
  .rt-sub textarea{min-height:80px}
  .rt-hide{display:none}

  .rt-send{width:100%;padding:17px;border:0;border-radius:999px;background:var(--cc-purple);color:var(--cc-cream);font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px}
  .rt-send:hover{filter:brightness(1.08)}
  .rt-send:disabled{opacity:.62;cursor:default}
  .rt-err{display:none;background:#FDECEC;color:var(--cc-danger);border:1px solid #F3C9C9;border-radius:12px;padding:12px 15px;font-size:14.5px;margin-top:14px;text-align:center;line-height:1.75}

  .rt-ok{display:none;text-align:center;padding:14px 4px}
  .rt-ok .ico{font-size:52px;margin-bottom:14px}
  .rt-ok h2{font-size:24px;color:var(--cc-purple);margin:0 0 12px;font-weight:700}
  .rt-ok p{font-size:15.5px;line-height:1.95;color:var(--cc-grey-700);margin:0 auto 22px;max-width:44ch}
  .rt-ok .buy{display:inline-block;background:var(--cc-teal);color:#fff;text-decoration:none;padding:15px 32px;border-radius:999px;font-size:16px;font-weight:700}
  .rt-ok .buy:hover{filter:brightness(1.08)}
</style>
</head>
<body>

<header class="cc-header">
  <div class="cc-header-in">
    <a class="cc-logo" href="index.html"><img src="brand/logo/logo-primary.png" alt="Cash Clinic" style="height:38px;width:auto;display:block;"></a>
    <a class="cc-btn cc-btn-wa" href="https://wa.me/96522260820" style="font-size:15px;padding:11px 20px;">
      <svg class="cc-wa-ico" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16.04 4C9.9 4 4.92 8.98 4.92 15.12c0 2.02.53 3.98 1.55 5.72L4 28l7.34-1.92a11.1 11.1 0 0 0 4.7 1.05h.01c6.14 0 11.12-4.98 11.12-11.12C27.17 8.98 22.18 4 16.04 4Zm0 20.3h-.01a9.2 9.2 0 0 1-4.69-1.28l-.34-.2-3.9 1.02 1.04-3.8-.22-.35a9.17 9.17 0 0 1-1.4-4.9c0-5.08 4.13-9.2 9.22-9.2 2.46 0 4.77.96 6.51 2.7a9.14 9.14 0 0 1 2.7 6.51c0 5.08-4.13 9.2-9.22 9.2Z"/></svg>
      <span>استفسار</span>
    </a>
  </div>
</header>

<section class="rt-hero">
  <div class="rt-wrap">
    <span class="rt-badge">تقييم الجلسة</span>
    <h1>كيف كانت جلستك؟</h1>
    <p id="fbLead">رأيك يساعدنا نحسّن الجلسة الجاية. ما ياخذ منك دقيقتين.</p>
  </div>
</section>

<main class="rt-wrap rt-main">
  <div class="rt-card" id="fbCard">
    <div id="fbInfo" class="rt-note" style="display:none"></div>

    <div class="rt-q">
      <label class="q">تقييمك للاستشارة</label>
      <div class="rt-opts" id="qSession"></div>
    </div>

    <div class="rt-q">
      <label class="q">تقييمك للمستشار <span id="fbWho" class="muted"></span></label>
      <div class="rt-opts" id="qConsultant"></div>
    </div>

    <div class="rt-q" id="qPlaceWrap">
      <label class="q">تقييمك للمكان</label>
      <div class="rt-opts" id="qPlace"></div>
    </div>

    <div class="rt-q">
      <label class="q">شنو تعلمت من الجلسة؟</label>
      <textarea id="fbLearned" rows="3" placeholder="أهم شي طلعت فيه…"></textarea>
    </div>

    <div class="rt-q">
      <label class="q">شنو ممكن نحسّنه؟</label>
      <textarea id="fbImprove" rows="3" placeholder="أي شي كان ينفع يكون أفضل…"></textarea>
    </div>

    <div class="rt-q">
      <label class="q">ملاحظات (اختياري)</label>
      <textarea id="fbNotes" rows="3" placeholder="أي شي تحب تقوله لنا…"></textarea>
    </div>

    <div class="rt-err" id="fbErr" style="display:none"></div>
    <button class="rt-btn" id="fbBtn">أرسل التقييم</button>
  </div>

  <div class="rt-card rt-done" id="fbThanks" style="display:none">
    <h2>وصلنا تقييمك 🌿</h2>
    <p>شكراً لوقتك — نقراه كله، ويفرق معنا فعلاً.</p>
    <a class="rt-btn" href="/">رجوع للموقع</a>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

const CONFIG={firebase:{apiKey:"AIzaSyCfD6ocmBsGVJms69TDbKt1PkcdSsGc3so",authDomain:"cash-quiz-906a6.firebaseapp.com",
  projectId:"cash-quiz-906a6",storageBucket:"cash-quiz-906a6.firebasestorage.app",
  messagingSenderId:"547780714224",appId:"1:547780714224:web:0e97107045a803623dec35"},functionsRegion:"us-central1"};

const app = initializeApp(CONFIG.firebase);
const fns = getFunctions(app, CONFIG.functionsRegion);
const getBooking = httpsCallable(fns, "getFeedbackBooking");
const submit     = httpsCallable(fns, "submitSessionFeedback");

const $ = s => document.querySelector(s);
const ID = new URLSearchParams(location.search).get("b") || "";
const SCALE = ["ممتاز","جيد","متوسط","ضعيف"];

/* the same four-point scale everywhere, so the answers stay comparable */
function paintScale(box, name){
  $(box).innerHTML = SCALE.map(v =>
    `<label class="rt-opt"><input type="radio" name="${name}" value="${v}"><span>${v}</span></label>`).join("");
}
["qSession:session","qConsultant:consultant","qPlace:place"].forEach(p=>{
  const [box,name]=p.split(":"); paintScale("#"+box, name);
});
const pick = n => { const el=document.querySelector(`input[name="${n}"]:checked`); return el?el.value:""; };
function err(m){ const e=$("#fbErr"); e.textContent=m; e.style.display="block";
  e.scrollIntoView({behavior:"smooth",block:"center"}); }

(async function(){
  if(!ID){ err("الرابط ناقص. افتح التقييم من الإيميل اللي وصلك."); $("#fbBtn").disabled=true; return; }
  try{
    const r = await getBooking({ id: ID });
    const d = r.data || {};
    if(d.done){ $("#fbCard").style.display="none"; $("#fbThanks").style.display="block"; return; }
    if(d.name) $("#fbLead").textContent = `أهلاً ${d.name} — رأيك يساعدنا نحسّن الجلسة الجاية.`;
    if(d.consultant) $("#fbWho").textContent = "· " + d.consultant;
    /* an online session has no room to rate */
    if(d.mode !== "present") $("#qPlaceWrap").style.display = "none";
    if(d.what){ const i=$("#fbInfo"); i.textContent = d.what; i.style.display="block"; }
  }catch(e){ err((e && e.message) || "ما قدرنا نفتح التقييم"); $("#fbBtn").disabled=true; }
})();

$("#fbBtn").addEventListener("click", async () => {
  const b=$("#fbBtn");
  const payload = { id: ID,
    session: pick("session"), consultant: pick("consultant"), place: pick("place"),
    learned: $("#fbLearned").value.trim(), improve: $("#fbImprove").value.trim(),
    notes: $("#fbNotes").value.trim() };
  if(!payload.session && !payload.consultant && !payload.learned && !payload.notes){
    return err("عبّي التقييم أول");
  }
  b.disabled=true; const t=b.textContent; b.textContent="جارٍ الإرسال…";
  try{
    await submit(payload);
    $("#fbCard").style.display="none"; $("#fbThanks").style.display="block";
    window.scrollTo({ top:0, behavior:"smooth" });
  }catch(e){ err((e && e.message) || "ما وصل التقييم، جرّب مرة ثانية"); b.disabled=false; b.textContent=t; }
});
</script>
</body>
</html>
