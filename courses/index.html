<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدورات والبرامج | كاش كلينك</title>
<meta name="description" content="دورات وبرامج كاش كلينك المالية.">
<style>
  :root{ --auber:#2F1748; --gold:#D3A146; --olive:#505632; --cream:#FFE7BC; --ink:#2F1748; --muted:#6B6577; --line:#E7E3EE; --bg:#F7F6F9; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7}
  .wrap{max-width:940px;margin:0 auto;padding:0 18px}
  .back{display:inline-block;margin:18px 0;color:var(--muted);font-size:14px;text-decoration:none}
  .head{text-align:center;padding:20px 0 30px}
  .head h1{font-size:clamp(26px,5vw,38px);margin:0 0 8px}
  .head p{color:var(--muted);margin:0;font-size:16px}
  .grid{display:grid;grid-template-columns:1fr;gap:20px;padding-bottom:56px}
  .card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 14px 40px rgba(47,23,72,.06);text-decoration:none;color:inherit;display:block;transition:.18s}
  .card:hover{transform:translateY(-3px);box-shadow:0 20px 50px rgba(47,23,72,.12)}
  .card .top{background:linear-gradient(150deg,#3A1D5A,#2F1748 60%);color:#fff;padding:30px 28px}
  .card .brand{font-size:13px;color:var(--cream);margin-bottom:8px}
  .card .top h2{margin:0 0 8px;font-size:clamp(20px,3.4vw,26px)}
  .card .top .eq{color:#E9E2F5;font-size:14.5px}
  .card .body{padding:22px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
  .card .facts{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13.5px;color:#43405A}
  .go{background:var(--auber);color:#fff;border-radius:999px;padding:11px 24px;font-size:15px;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← الرئيسية</a>
  <div class="head">
    <h1>الدورات والبرامج</h1>
    <p>برامج عملية تبني فيها وعيك وعاداتك المالية</p>
  </div>
  <div class="grid">
    <a class="card" href="raha.html">
      <div class="top">
        <div class="brand">كاش ناس · الاستقرار المالي</div>
        <h2>ورشة كيف تصنع راحتك المالية؟</h2>
        <div class="eq">الراحة المالية = قرارات مدروسة + وعي + سلوك + نظام</div>
      </div>
      <div class="body">
        <div class="facts">
          <span class="chip">٢١–٢٣ سبتمبر ٢٠٢٦</span>
          <span class="chip">من ٦ إلى ٩ مساءً</span>
          <span class="chip">اونلاين وحضوري</span>
        </div>
        <span class="go">التفاصيل والتسجيل</span>
      </div>
    </a>
  </div>
</div>
</body>
</html>
