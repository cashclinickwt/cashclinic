<style>
/* Layout: lavender page, white rounded cards with soft shadow, one dark plum welcome card, wine pill buttons */
:root{
  --font:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --page:#dcdaea;
  --card:#ffffff;
  --inner:#f4f1f8;
  --ink:#2f1748;
  --body:#3a3348;
  --muted:#6f6880;
  --faint:#a09bb0;
  --wine:#972e38;
  --wine-hover:#7a2430;
  --pink:#fce5ea;
  --teal:#23908c;
  --teal-bg:#e3f2f0;
  --cream:#ffe7bc;
  --line:#e7e3ef;
  --line-strong:#cfc8dc;
  --shadow:0 6px 22px rgba(47,23,72,.07);
  color-scheme:light;
}
/* Deliberate single light look in every viewer theme */
body{background:var(--page);color:var(--body);font-family:var(--font);font-size:16px;line-height:1.9}
.bg-tree{position:fixed;left:max(8px,env(safe-area-inset-left,0px));bottom:0;height:min(92vh,1100px);width:auto;opacity:.18;pointer-events:none;z-index:0}
@media (max-width:760px){.bg-tree{opacity:.1;left:-30px}}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:flex;flex-direction:column;gap:18px}

.brand{display:flex;justify-content:flex-start;padding-block:4px}
.brand img{height:54px;width:auto;display:block}

.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:26px 24px}

.hero{position:relative;overflow:hidden;isolation:isolate;background:var(--ink);border-radius:20px;box-shadow:var(--shadow);padding:32px 26px 28px}
.hero::before{content:"";position:absolute;inset:-12% -8%;background:url(assets/img/survey/s-22dc8bed4c.png) no-repeat center/cover;opacity:.75;z-index:-1}
@media (max-width:480px){.hero::before{opacity:.55;inset:-4% -4%;background-size:auto 95%;background-position:left center}}
.hero h1{margin:0 0 10px;font-weight:300;font-size:clamp(2rem,6vw,2.75rem);line-height:1.25;letter-spacing:-.01em;text-wrap:balance;color:#ffffff}
.hero p{margin:0;color:#ffffff;opacity:.9;max-width:50ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:18px;font-size:.85rem;color:var(--cream)}

.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 18px;display:flex;align-items:center;gap:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--page)}
.bar{flex:1;height:6px;background:var(--inner);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--wine);border-radius:999px;transition:width .3s ease}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pct{font-size:.78rem;font-weight:600;color:var(--teal);background:var(--teal-bg);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}

#parts{display:flex;flex-direction:column;gap:18px;margin-top:18px}
section.part{display:flex;flex-direction:column;gap:22px}
.sec-head{display:flex;align-items:center;gap:16px}
.sec-num{font-weight:300;font-size:46px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.sec-head h2{margin:0;font-size:1.4rem;font-weight:700;color:var(--ink);line-height:1.4}
.sec-head .sub{font-size:.85rem;color:var(--muted)}

.q{display:flex;flex-direction:column;gap:10px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0;padding-bottom:0}
.q legend,.q .qt{font-weight:500;color:var(--ink);font-size:1.05rem;padding:0;line-height:1.7}
.q legend{margin-bottom:10px}
.q .qn{color:var(--wine);font-weight:600;margin-inline-end:6px;font-variant-numeric:tabular-nums}
fieldset{border:0;margin:0;padding:0;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{display:inline-block;padding:8px 16px;border-radius:999px;background:var(--inner);color:var(--body);font-size:.95rem;line-height:1.6;transition:background .15s,color .15s,box-shadow .15s;cursor:pointer;user-select:none}
.opt:hover span{box-shadow:inset 0 0 0 1px var(--line-strong)}
.opt input:checked + span{background:var(--ink);color:#ffffff;box-shadow:none}
.opt input:focus-visible + span{outline:2px solid var(--wine);outline-offset:2px}
.q.missing{background:var(--pink);border-radius:16px;padding:14px 16px;border-bottom:0}
.q.missing legend,.q.missing .qt{color:var(--wine);font-weight:600}
.q.missing .hint{display:block}
.hint{display:none;font-size:.82rem;color:var(--wine)}

.nps{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px}
.nps .opt span{display:flex;align-items:center;justify-content:center;padding:10px 0;border-radius:12px;font-variant-numeric:tabular-nums;width:100%;box-sizing:border-box}
.nps-ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
@media (max-width:480px){.nps{grid-template-columns:repeat(6,minmax(0,1fr))}.nps-ends{display:none}.nps-note{display:block!important}}
.nps-note{display:none;font-size:.8rem;color:var(--muted)}

textarea{width:100%;box-sizing:border-box;min-height:120px;resize:vertical;border:0;border-radius:14px;background:var(--inner);color:var(--body);font:inherit;padding:14px 16px;line-height:1.8}
textarea::placeholder{color:var(--faint)}
textarea:focus-visible{outline:2px solid var(--wine);outline-offset:2px}

.actions{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 30px;font:inherit;font-weight:600;font-size:1rem;cursor:pointer;background:var(--wine);color:#ffffff;text-decoration:none;display:inline-block;transition:background .15s}
.btn:hover{background:var(--wine-hover)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn.ghost:hover{background:var(--inner)}
.err{font-size:.9rem;color:var(--wine);background:var(--pink);border-radius:14px;padding:10px 16px}

.done{display:flex;flex-direction:column;gap:18px}
.thanks{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.thanks h1{margin:0 0 8px;font-weight:300;font-size:clamp(1.9rem,6vw,2.5rem);line-height:1.25;color:var(--ink)}
.thanks p{margin:0;color:var(--body);max-width:44ch;min-width:0}
.thanks img{height:170px;width:auto;display:block}
@media (max-width:480px){.thanks{grid-template-columns:1fr}.thanks img{height:130px;justify-self:center}}
.summary{background:var(--inner);border-radius:14px;padding:16px 20px;white-space:pre-wrap;font-size:.92rem;color:var(--body);max-height:340px;overflow:auto;margin:0;font-family:inherit}
.row{display:flex;flex-wrap:wrap;gap:10px}
.note{font-size:.88rem;color:var(--teal);background:var(--teal-bg);border-radius:14px;padding:8px 14px;align-self:flex-start}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.who{display:grid;gap:14px}
.who .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.who .two{grid-template-columns:1fr}}
.who label{display:block;font-weight:500;color:var(--ink);margin-bottom:6px}
.who input{width:100%;box-sizing:border-box;border:0;border-radius:14px;background:var(--inner);color:var(--body);font:inherit;padding:12px 16px}
.who input:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.who .known{background:var(--teal-bg);color:#1c6e6b;border-radius:14px;padding:12px 16px}
.who.missing input:placeholder-shown{box-shadow:inset 0 0 0 2px var(--wine)}
</style>

</head>
<body>
<img class="bg-tree" src="assets/img/survey/s-cf907a7ea6.png" alt="" aria-hidden="true">
<div class="wrap" dir="rtl" lang="ar">
  <div class="brand"><img src="assets/img/survey/s-aab694bcb2.png" alt="كاش كلينك"></div>
  <header class="hero">
    <h1>رايك يصنع الفرق</h1>
    <p id="intro"></p>
    <div class="meta" id="meta"></div>
  </header>

  <form id="survey" novalidate>
    <div class="progress" aria-hidden="true"><div class="bar"><i id="barFill"></i></div><span class="count" id="count"></span><span class="pct" id="pct">0%</span></div>

    <section class="part card who" id="whoCard" style="margin-top:18px">
      <div class="sec-head"><div><h2>عرّفنا عليك</h2><div class="sub">عشان نعرف منو صاحب التقييم ونتواصل معاك إذا احتجنا</div></div></div>
      <div class="known" id="whoKnown" hidden></div>
      <div class="two" id="whoFields">
        <div><label for="wName">الاسم</label><input id="wName" autocomplete="name" placeholder="اسمك"></div>
        <div><label for="wPhone">رقم الواتساب</label><input id="wPhone" inputmode="tel" autocomplete="tel" placeholder="9xxxxxxx" dir="ltr" style="text-align:right"></div>
      </div>
    </section>
    <div id="parts"></div>

    <section class="part card" style="margin-top:18px">
      <div class="sec-head"><div class="sec-num" id="sugNum">03</div><div><h2>بكلماتك انت</h2><div class="sub">اختياري .. بس نحب نسمعه</div></div></div>
      <div class="q">
        <label class="qt" for="learned"><span class="qn">1.</span>شنو شي يديد تعلمته؟</label>
        <textarea id="learned" name="learned" placeholder="فكرة، مفهوم، أو شي غيّر نظرتك.."></textarea>
      </div>
      <div class="q">
        <label class="qt" for="notes"><span class="qn">2.</span>ملاحظاتك</label>
        <textarea id="notes" name="notes" placeholder="أي شي حاب تقوله لنا.."></textarea>
      </div>
      <div class="q">
        <label class="qt" for="suggest"><span class="qn">3.</span>شنو اقتراحك لتطوير خدماتنا؟</label>
        <textarea id="suggest" name="suggest" placeholder="اكتب اللي ببالك هني.."></textarea>
      </div>
    </section>

    <div class="actions" style="margin-top:22px">
      <button class="btn" type="submit" id="submitBtn">أرسل تقييمي</button>
      <div class="err" id="err" hidden></div>
      <div class="err" id="doneNote" hidden style="color:#1c6e6b">وصلنا تقييمك قبل — إذا أرسلته مرة ثانية يتحدّث.</div>
    </div>
  </form>

  <section class="done" id="done" hidden>
    <div class="thanks card">
      <div><h1>شكراً من القلب</h1>
      <p>وصلنا تقييمك 🌷 كل كلمة كتبتها بتوصل للفريق، وبنشتغل عليها عشان نطوّر خدماتنا على حسب احتياجك انت.</p></div>
      <img src="assets/img/survey/s-7335144f26.png" alt="">
    </div>
    <pre class="summary" id="summary" hidden></pre>
  </section>
</div>

<script>
// رقم واتساب كاش كلينك بالصيغة الدولية بدون + (مثال: 965XXXXXXXX). إذا فاضي، العميل يختار جهة الاتصال بنفسه.
const WA_NUMBER = "";

const AR = n => String(n);

const SERVICE = "diwaniya";
const _qp = new URLSearchParams(location.search);
window.ccRef = { b: (_qp.get("b")||"").slice(0,64), r: (_qp.get("r")||"").slice(0,64), e: (_qp.get("e")||"").slice(0,40) };
const ALL = {
  diwaniya: { name: "الديوانية", en: "Diwaniya", intro: "شاركنا تجربتك في الديوانية عشان نطوّر المواضيع والنقاش والوقت على حسب احتياجك انت. جاوب بكل صراحة، ما في جواب صح أو غلط.", title: "تقييم الديوانية", qs: [
    ["شلون تقيّم تجربتك العامة في الديوانية؟", ["ممتازة","جيدة جداً","جيدة","مقبولة","غير مرضية"]],
    ["إلى أي درجة كانت المواضيع المطروحة مفيدة لك؟", ["مفيدة جداً","مفيدة","متوسطة الفائدة","قليلة الفائدة","غير مفيدة"]],
    ["شلون تقيّم أسلوب إدارة النقاش والتفاعل؟", ["ممتاز","جيد جداً","جيد","مقبول","يحتاج تطوير"]],
    ["هل ساعدتك الديوانية على فهم سلوكياتك المالية بشكل أعمق؟", ["نعم، بشكل كبير","نعم، إلى حد ما","بشكل بسيط","لا"]],
    ["هل الوقت المخصص للديوانية مناسب؟", ["مناسب جداً","أفضل وقت أطول","أفضل وقت أقصر","أفضل تغيير الموعد"]],
  ]},
  consult: { name: "الاستشارات", en: "Consultation", intro: "شاركنا تجربتك في الاستشارة عشان نطوّر جودتها ووقتها وقيمتها على حسب احتياجك انت. جاوب بكل صراحة، ما في جواب صح أو غلط.", title: "تقييم الاستشارات", qs: [
    ["شلون تقيّم جودة الاستشارة اللي حصلت عليها؟", ["ممتازة","جيدة جداً","جيدة","مقبولة","غير مرضية"]],
    ["إلى أي درجة حسّيت إن المستشارة فهمت احتياجك؟", ["بشكل كامل","بدرجة كبيرة","بدرجة متوسطة","بدرجة قليلة","ما فهمت احتياجي"]],
    ["هل طلعت من الاستشارة بخطوات واضحة وقابلة للتطبيق؟", ["نعم، واضحة جداً","نعم، لكن تحتاج توضيح","جزئياً","لا"]],
    ["شلون تقيّم الوقت المخصص للاستشارة؟", ["مناسب جداً","أحتاج وقت أطول","كان أطول من اللازم"]],
    ["شلون تقيّم المكان؟", ["ممتاز","جيد جداً","جيد","مقبول","يحتاج تطوير"]],
  ]},
  followup: { name: "نظام المتابعة", en: "Follow-up", intro: "شاركنا تجربتك مع المتابعة عشان نضبط طريقتها ومعدلها على حسب احتياجك انت. جاوب بكل صراحة، ما في جواب صح أو غلط.", title: "تقييم نظام المتابعة", qs: [
    ["شلون تقيّم انتظام المتابعة معاك؟", ["ممتاز","جيد جداً","جيد","غير منتظم","ما حصلت على متابعة"]],
    ["هل كانت طريقة التواصل والمتابعة مناسبة لك؟", ["مناسبة جداً","مناسبة","تحتاج تحسين","غير مناسبة"]],
    ["إلى أي درجة ساعدتك المتابعة على الالتزام بخطتك؟", ["بدرجة كبيرة جداً","بدرجة كبيرة","بدرجة متوسطة","بدرجة قليلة","ما ساعدتني"]],
    ["شنو معدل المتابعة اللي تفضّله؟", ["مرتين بالأسبوع","مرة بالأسبوع","كل أسبوعين","مرة بالشهر","حسب الحاجة"]],
    ["شنو أكثر شي تحتاجه من نظام المتابعة؟", ["تذكير بالمهام","مراجعة التقدم والإنجاز","مناقشة التحديات","تعديل الخطة عند الحاجة","تشجيع ومحاسبة على الالتزام"]],
  ]},
  online: { name: "اللقاء المجاني", en: "Free online session", general: false, intro: "شكراً إنك حضرت اللقاء المجاني الأونلاين. شاركنا تجربتك عشان نطوّر اللقاءات الياية على حسب احتياجك انت. جاوب بكل صراحة، ما في جواب صح أو غلط.", title: "تقييم اللقاء المجاني الأونلاين", qs: [
    ["شلون تقيّم تجربتك العامة في اللقاء؟", ["ممتازة","جيدة جداً","جيدة","مقبولة","غير مرضية"]],
    ["إلى أي درجة كان محتوى اللقاء مفيد لك؟", ["مفيد جداً","مفيد","متوسط الفائدة","قليل الفائدة","غير مفيد"]],
    ["شلون تقيّم أسلوب التقديم والشرح؟", ["ممتاز","جيد جداً","جيد","مقبول","يحتاج تطوير"]],
    ["شلون كانت جودة الصوت والبث؟", ["ممتازة","جيدة","فيها مشاكل بسيطة","سيئة"]],
    ["هل الوقت المخصص للقاء مناسب؟", ["مناسب جداً","أفضل وقت أطول","أفضل وقت أقصر","أفضل تغيير الموعد"]],
    ["شلون عرفت عن اللقاء؟", ["انستقرام","صديق أو قريب","واتساب","غير ذلك"]],
    ["ما مدى احتمالية ترشيح اللقاء لشخص آخر؟", "NPS"],
    ["هل تفكر تستفيد من خدماتنا بعد اللقاء؟", ["نعم أكيد","يمكن","مو الحين","لا"]],
    ["شنو الخدمة اللي تحب تستفيد منها مستقبلاً؟", ["ديوانيات ولقاءات جماعية","استشارات فردية","برامج متابعة","ورش استثمار وذهب","ورش سلوكيات مالية"]],
  ]},
};
const GENERAL = { title: "التجربة العامة", qs: [
    ["شنو أكثر جانب استفدت منه في خدماتنا؟", ["فهم سلوكياتي المالية","تغيير نظرتي للمال","وضوح أهدافي المالية","تنظيم قراراتي المالية","الالتزام بخطة عملية"]],
    ["إلى أي درجة تشعر إن خدماتنا ساعدتك تحقق تقدم فعلي؟", ["تقدم كبير","تقدم ملحوظ","تقدم بسيط","ما لاحظت تقدم","ما أقدر أحدد للحين"]],
    ["ما مدى احتمالية ترشيح خدماتنا لشخص آخر؟", "NPS"],
    ["شنو الخدمة اللي تحب تستفيد منها مستقبلاً؟", ["ديوانيات ولقاءات جماعية","استشارات فردية","برامج متابعة","ورش استثمار وذهب","ورش سلوكيات مالية"]],
  ]};
const SV = ALL[SERVICE];
const PARTS = SV.general === false ? [SV] : [SV, GENERAL];
const ORD = ["أولاً","ثانياً","ثالثاً","رابعاً"];
const TOTAL = PARTS.reduce((s,p)=>s+p.qs.length,0);
document.getElementById("sugNum").textContent = AR("0" + (PARTS.length + 1));
document.getElementById("intro").textContent = SV.intro;
document.getElementById("meta").innerHTML = `<span>استبيان ${SV.name}</span><span>·</span><span>${AR(TOTAL)} سؤال + 3 أسئلة مفتوحة</span><span>·</span><span>تقريباً دقيقتين</span>`;

const host = document.getElementById("parts");
const qIds = [];
PARTS.forEach((part, pi) => {
  const sec = document.createElement("section");
  sec.className = "part card";
  sec.innerHTML = `<div class="sec-head"><div class="sec-num">${AR("0"+(pi+1))}</div><div><div class="sub">${ORD[pi]}</div><h2>${part.title}</h2></div></div>`;
  part.qs.forEach(([text, opts], qi) => {
    const id = `p${pi+1}q${qi+1}`;
    qIds.push({id, text, part: part.title, pi});
    const fs = document.createElement("fieldset");
    fs.className = "q"; fs.id = "fs_" + id;
    let inner = `<legend><span class="qn">${AR(qi+1)}.</span>${text}</legend>`;
    if (opts === "NPS") {
      inner += `<div class="nps">`;
      for (let n = 0; n <= 10; n++) inner += `<label class="opt"><input type="radio" id="${id}_${n}" name="${id}" value="${n}"><span>${AR(n)}</span></label>`;
      inner += `</div><div class="nps-ends"><span>0 · مستبعد تماماً</span><span>10 · بالتأكيد أرشحها</span></div><div class="nps-note">0 يعني مستبعد تماماً، و10 يعني بالتأكيد أرشحها</div>`;
    } else {
      inner += `<div class="opts">` + opts.map((o, oi) => `<label class="opt"><input type="radio" id="${id}_${oi}" name="${id}" value="${o}"><span>${o}</span></label>`).join("") + `</div>`;
    }
    inner += `<span class="hint">هالسؤال ناقص</span>`;
    fs.innerHTML = inner;
    sec.appendChild(fs);
  });
  host.appendChild(sec);
});

const form = document.getElementById("survey");
const val = id => { const el = form.querySelector(`input[name="${id}"]:checked`); return el ? el.value : null; };
function updateProgress(){
  const n = qIds.filter(q => val(q.id) !== null).length;
  document.getElementById("barFill").style.width = (n / TOTAL * 100) + "%";
  document.getElementById("count").textContent = `${AR(n)} من ${AR(TOTAL)}`;
  document.getElementById("pct").textContent = Math.round(n / TOTAL * 100) + "%";
}
form.addEventListener("change", e => {
  const fs = e.target.closest("fieldset"); if (fs) fs.classList.remove("missing");
  updateProgress(); saveDraft();
});
const TEXTS = [["learned","الشي اليديد اللي تعلمته"],["notes","الملاحظات"],["suggest","الاقتراح"]];
TEXTS.forEach(([id]) => document.getElementById(id).addEventListener("input", saveDraft));

function saveDraft(){
  try{ const d = {}; qIds.forEach(q => d[q.id] = val(q.id)); TEXTS.forEach(([id]) => d[id] = document.getElementById(id).value); localStorage.setItem("cc_survey_draft_"+SERVICE, JSON.stringify(d)); }catch(e){}
}
function loadDraft(){
  try{ const d = JSON.parse(localStorage.getItem("cc_survey_draft_"+SERVICE) || "null"); if(!d) return;
    qIds.forEach(q => { if (d[q.id] != null) { const el = [...form.querySelectorAll(`input[name="${q.id}"]`)].find(i => i.value === d[q.id]); if (el) el.checked = true; } });
    TEXTS.forEach(([id]) => { if (d[id]) document.getElementById(id).value = d[id]; });
  }catch(e){}
}
loadDraft(); updateProgress();

function buildText(){
  let t = "استبيان " + SV.name + " · كاش كلينك\n";
  let last = -1;
  qIds.forEach((q, i) => {
    if (q.pi !== last) { t += `\n${ORD[q.pi]}: ${q.part}\n`; last = q.pi; }
    const v = val(q.id);
    t += `- ${q.text}\n  ${v === null ? "(بدون إجابة)" : v}\n`;
  });
  TEXTS.forEach(([id, label]) => { const s = document.getElementById(id).value.trim(); t += `\n${label}:\n${s || "(فاضي)"}\n`; });
  return t;
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const missing = qIds.filter(q => val(q.id) === null);
  qIds.forEach(q => document.getElementById("fs_" + q.id).classList.toggle("missing", val(q.id) === null));
  const err = document.getElementById("err");
  const name = (document.getElementById("wName").value || "").trim(), phone = (document.getElementById("wPhone").value || "").trim();
  const whoBad = !window.ccKnown && (name.length < 2 || phone.replace(/\D/g, "").length < 7);
  document.getElementById("whoCard").classList.toggle("missing", whoBad);
  if (whoBad) { err.textContent = "اكتب اسمك ورقم الواتساب عشان نعرف منو صاحب التقييم."; err.hidden = false;
    document.getElementById("whoCard").scrollIntoView({behavior:"smooth", block:"center"}); return; }
  if (missing.length) {
    err.textContent = `باقي ${AR(missing.length)} ${missing.length > 2 && missing.length < 11 ? "أسئلة" : "سؤال"} ما جاوبت عليها، تحددت لك باللون الأحمر.`;
    err.hidden = false;
    document.getElementById("fs_" + missing[0].id).scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }
  err.hidden = true;
  const answers = {}; qIds.forEach(q => answers[q.id] = val(q.id));
  const btn = document.getElementById("submitBtn"); btn.disabled = true; const t0 = btn.textContent; btn.textContent = "جاري الإرسال…";
  try {
    await window.ccSend({ name, phone, answers,
      learned: document.getElementById("learned").value, notes: document.getElementById("notes").value, suggest: document.getElementById("suggest").value });
    try { localStorage.removeItem("cc_survey_draft_" + SERVICE); } catch (e2) {}
    form.hidden = true;
    document.getElementById("done").hidden = false;
    window.scrollTo({top:0, behavior:"smooth"});
  } catch (x) {
    err.textContent = (x && x.message) || "ما قدرنا نرسل التقييم، جرّب مرة ثانية.";
    err.hidden = false;
  } finally { btn.disabled = false; btn.textContent = t0; }
});

</script>
